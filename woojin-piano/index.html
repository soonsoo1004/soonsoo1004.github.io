<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="googlebot" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<meta name="theme-color" content="#58b4f0" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>도레미 별빛 피아노 · 우진이</title>
<link rel="icon" href="assets/icon-192.png" />
<link rel="apple-touch-icon" href="assets/icon-192.png" />
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <canvas id="stage" aria-hidden="true"></canvas>

  <!-- 상단 HUD -->
  <button id="pauseBtn" class="hud-pause" type="button" aria-label="일시정지">❚❚</button>

  <div class="hud-score" id="hudScore">
    <span class="crown" aria-hidden="true">👑</span>
    <b id="scoreNum">0</b>
  </div>

  <div class="hud-hearts" id="hearts" aria-label="남은 하트">
    <span>❤️</span><span>❤️</span><span>❤️</span>
  </div>

  <div class="song-tag">
    <span class="stage-chip" id="stageBadge">STAGE 1 🌱</span>
    <span id="songTag">⭐ 작은별</span>
  </div>

  <div class="hud-acc" id="accTag">PERFECT <b id="accNum">100</b>%</div>

  <!-- 콤보 -->
  <div class="combo-box" id="comboBox">
    <span class="combo-star" aria-hidden="true">★</span>
    <span class="combo-num" id="comboNum">0</span>
    <span class="combo-lbl">콤보</span>
  </div>

  <!-- 판정 팝업 -->
  <div class="judge" id="judge" aria-live="polite"></div>

  <!-- 우측 세로 진행 -->
  <div class="prog-wrap" id="progWrap">
    <div class="prog-flag" aria-hidden="true">TOP</div>
    <div class="prog-track">
      <div class="prog-fill" id="progFill"></div>
      <img class="prog-ico" id="progIco" src="assets/woojin-face.png" alt="" width="28" height="28" />
    </div>
  </div>

  <div class="banner" id="banner"></div>

  <!-- 하단 조작부: 시간 게이지 · 멜로디 건반 불빛 · 오르기/방향전환 -->
  <div class="controls" id="controls">
    <div class="gauge" id="gauge"><i id="gaugeFill"></i></div>
    <div class="melody" id="melody" aria-hidden="true">
      <span data-note="도">도</span>
      <span data-note="레">레</span>
      <span data-note="미">미</span>
      <span data-note="파">파</span>
      <span data-note="솔">솔</span>
      <span data-note="라">라</span>
      <span data-note="시">시</span>
    </div>
    <div class="btn-row">
      <button class="act turn" id="btnTurn" type="button" aria-label="방향전환">
        <i aria-hidden="true">↺</i>
        <b>방향전환</b>
        <small>계단이 꺾이면</small>
      </button>
      <button class="act up" id="btnUp" type="button" aria-label="오르기">
        <i aria-hidden="true">⬆</i>
        <b>오르기</b>
        <small>곧게 이어지면</small>
      </button>
    </div>
  </div>

  <!-- 시작 화면 -->
  <div class="overlay show" id="startScreen">
    <div class="card">
      <div class="card-head">
        <img class="card-sprite" src="assets/woojin-play.png" alt="우진이" width="86" height="106" />
        <div class="card-titles">
          <p class="card-kicker">구름 위 피아노 계단</p>
          <h1 class="card-title">도레미<br />별빛 피아노</h1>
          <p class="card-sub">우진이와 계단을 톡톡! ✨</p>
        </div>
      </div>

      <div class="howto">
        <div class="howto-row">
          <span class="howto-ico up">⬆</span>
          <span class="howto-txt"><b>오르기</b> — 계단이 <i>곧게</i> 이어질 때</span>
        </div>
        <div class="howto-row">
          <span class="howto-ico turn">↺</span>
          <span class="howto-txt"><b>방향전환</b> — 계단이 <i>꺾일 때</i></span>
        </div>
        <p class="howto-foot">누를 때마다 그 음이 피아노로 울려요 🎹 판이 오르면 다음 노래로!</p>
      </div>

      <p class="sec-label">시작할 노래 <span class="sec-hint">별이 많을수록 빨라요</span></p>
      <div class="songs" id="songPicker" role="radiogroup" aria-label="시작할 노래">
        <button class="song is-on" type="button" data-song="twinkle" role="radio" aria-checked="true">
          <span class="song-emoji">⭐</span><span class="song-name">작은별</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="joy" role="radio" aria-checked="false">
          <span class="song-emoji">🌅</span><span class="song-name">환희의 송가</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="mary" role="radio" aria-checked="false">
          <span class="song-emoji">🐑</span><span class="song-name">메리의 양</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="butterfly" role="radio" aria-checked="false">
          <span class="song-emoji">🦋</span><span class="song-name">나비야</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="macdonald" role="radio" aria-checked="false">
          <span class="song-emoji">🐄</span><span class="song-name">농장 노래</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="london" role="radio" aria-checked="false">
          <span class="song-emoji">🌉</span><span class="song-name">런던 다리</span><span class="song-stars">★</span>
        </button>
        <button class="song" type="button" data-song="lullaby" role="radio" aria-checked="false">
          <span class="song-emoji">🌙</span><span class="song-name">자장가</span><span class="song-stars">★★</span>
        </button>
        <button class="song" type="button" data-song="jingle" role="radio" aria-checked="false">
          <span class="song-emoji">🔔</span><span class="song-name">징글벨</span><span class="song-stars">★★</span>
        </button>
        <button class="song" type="button" data-song="birthday" role="radio" aria-checked="false">
          <span class="song-emoji">🎂</span><span class="song-name">생일 축하</span><span class="song-stars">★★</span>
        </button>
        <button class="song" type="button" data-song="elise" role="radio" aria-checked="false">
          <span class="song-emoji">🌷</span><span class="song-name">엘리제를 위하여</span><span class="song-stars">★★</span>
        </button>
        <button class="song" type="button" data-song="minuet" role="radio" aria-checked="false">
          <span class="song-emoji">🎻</span><span class="song-name">미뉴에트</span><span class="song-stars">★★★</span>
        </button>
        <button class="song" type="button" data-song="canon" role="radio" aria-checked="false">
          <span class="song-emoji">🌈</span><span class="song-name">캐논</span><span class="song-stars">★★★</span>
        </button>
      </div>

      <button class="cta" id="startBtn" type="button">계단 오르기 시작!</button>
      <p class="best-line">최고 점수 <b id="bestNum">0</b>점</p>
    </div>
  </div>

  <!-- 게임오버 화면 -->
  <div class="overlay" id="overScreen">
    <div class="card over-card">
      <img class="over-face" src="assets/woojin-oops.png" alt="우진이" width="96" height="118" />
      <h2 class="over-title" id="overTitle">참 잘했어요!</h2>
      <p class="over-msg" id="overMsg">별빛 계단이 반짝반짝 ✨</p>
      <div class="over-stats">
        <div class="ov-stat"><span>점수</span><b id="overScore">0</b></div>
        <div class="ov-stat"><span>최고 콤보</span><b id="overCombo">0</b></div>
        <div class="ov-stat"><span>판</span><b id="overStage">STAGE 1</b></div>
      </div>
      <p class="over-best">최고 점수 <b id="overBest">0</b>점</p>
      <button class="cta" id="retryBtn" type="button">한 번 더!</button>
      <button class="ghost-btn" id="menuBtn" type="button">노래 바꾸기</button>
    </div>
  </div>

  <!-- 일시정지 화면 -->
  <div class="overlay" id="pauseScreen">
    <div class="card small-card">
      <p class="pause-emoji" aria-hidden="true">☁️</p>
      <h2 class="over-title">잠깐 쉬는 중</h2>
      <p class="over-msg">준비되면 다시 올라가요!</p>
      <button class="cta" id="resumeBtn" type="button">계속하기</button>
      <button class="ghost-btn" id="muteToggle" type="button">🔊 소리 끄기</button>
      <button class="ghost-btn" id="pauseMenuBtn" type="button">처음으로</button>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
