<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080c">
<title>무드 플리 — 기분 한 줄이면 5곡</title>
<meta name="description" content="연령대·목소리 취향·성격·기분을 고르면 딱 맞는 숨은 명곡 5곡과 다정한 답장을 골라주는 플레이리스트 앱.">
<style>
  :root{
    --bg:#08080c;
    --ink:#f5f5f8;
    --dim:#9d9daa;
    --line:rgba(255,255,255,.10);
    --glass:rgba(255,255,255,.055);
    --glass-2:rgba(255,255,255,.085);
    --accent:#b9a7ff;
    --accent-2:#7ad0ff;
    --yt:#ff5a5a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Liberation Sans",Arial,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans CJK KR",system-ui,sans-serif;
    font-size:16px;line-height:1.45;
    letter-spacing:-0.01em;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before,body::after{
    content:"";position:fixed;z-index:0;pointer-events:none;
    width:74vw;height:74vw;max-width:520px;max-height:520px;border-radius:50%;
    filter:blur(70px);opacity:.5;
  }
  body::before{top:-24vw;left:-18vw;background:radial-gradient(circle,#5a3fb3 0%,rgba(90,63,179,0) 70%)}
  body::after{bottom:-30vw;right:-22vw;background:radial-gradient(circle,#1c5f86 0%,rgba(28,95,134,0) 70%)}
  .wrap{position:relative;z-index:1;width:100%;max-width:430px;margin:0 auto;padding:26px 18px calc(40px + env(safe-area-inset-bottom))}
  header.head{padding:6px 2px 16px}
  .eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:600}
  h1{font-size:26px;line-height:1.28;margin:9px 0 8px;letter-spacing:-0.035em;font-weight:700}
  h1 .grad{background:linear-gradient(100deg,#cfc3ff,#8fd8ff 60%,#ffd9a8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:0;color:var(--dim);font-size:13px}

  .card{
    background:var(--glass);
    border:1px solid var(--line);
    border-radius:22px;
    padding:16px 15px;
    margin-bottom:14px;
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .row-label{display:flex;align-items:baseline;gap:7px;margin:0 0 9px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.02em}
  .row-label .n{color:var(--accent);font-variant-numeric:tabular-nums}
  .row-label .hint{font-weight:400;color:#6f6f7d;font-size:11px}
  .row + .row{margin-top:15px}

  .chips{display:flex;flex-wrap:wrap;gap:7px}
  #ages,#genders{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
  #pers{display:grid;grid-template-columns:1fr 1fr}
  #moods{display:grid;grid-template-columns:1fr 1fr 1fr}
  #moods .chip{font-size:11.5px;padding:9px 4px;gap:3px;letter-spacing:-0.04em}
  #moods .chip .e{font-size:12px}
  .chip{
    appearance:none;border:1px solid var(--line);
    background:rgba(255,255,255,.045);
    color:#dcdce6;font:inherit;font-size:12.5px;font-weight:600;
    padding:9px 12px;border-radius:13px;cursor:pointer;
    transition:transform .12s ease, background .18s ease, border-color .18s ease, color .18s;
    display:inline-flex;align-items:center;gap:5px;
    max-width:100%;white-space:nowrap;justify-content:center;overflow:hidden;text-overflow:ellipsis;
  }
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{
    background:linear-gradient(180deg,rgba(185,167,255,.30),rgba(185,167,255,.16));
    border-color:rgba(185,167,255,.62);
    color:#fff;
    box-shadow:0 4px 16px rgba(150,120,255,.22), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .chip .e{font-size:13px;line-height:1}

  .ask{display:flex;gap:8px;margin-top:2px}
  .ask input{
    flex:1 1 auto;min-width:0;
    background:rgba(255,255,255,.05);
    border:1px solid var(--line);
    border-radius:14px;
    color:var(--ink);font:inherit;font-size:14px;
    padding:13px 13px;
  }
  .ask input::placeholder{color:#6c6c7a}
  .ask input:focus{outline:none;border-color:rgba(185,167,255,.55);background:rgba(255,255,255,.075)}
  .btn-go{
    flex:0 0 auto;border:0;border-radius:14px;padding:0 17px;
    background:linear-gradient(160deg,#8b74ff,#5fb4ff);
    color:#fff;font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 8px 22px rgba(110,110,255,.32);
  }
  .btn-go:active{transform:scale(.97)}

  .result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
  .result-head h2{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .tags{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
  .tag{font-size:10.5px;color:#cfc9ff;background:rgba(185,167,255,.13);border:1px solid rgba(185,167,255,.24);padding:3px 7px;border-radius:8px;white-space:nowrap}
  .mood-name{font-size:12px;color:var(--accent-2);font-weight:700;letter-spacing:.02em;margin:0 0 8px}
  .pool-note{margin:-2px 0 10px;font-size:11px;color:#8b86b8;background:rgba(255,255,255,.04);border:1px dashed rgba(255,255,255,.12);border-radius:10px;padding:7px 10px}
  blockquote{
    margin:0 0 14px;padding:14px 15px;
    border-radius:16px;
    background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    border:1px solid rgba(255,255,255,.10);
    font-size:15.5px;line-height:1.62;font-weight:600;letter-spacing:-0.015em;
    overflow-wrap:anywhere;
  }
  blockquote .who{display:block;margin-top:8px;font-size:11.5px;font-weight:600;color:#8f8f9e;letter-spacing:.02em}

  ol.songs{list-style:none;margin:0;padding:0}
  ol.songs li{
    padding:13px 0 12px;border-top:1px solid rgba(255,255,255,.075);
  }
  ol.songs li:first-child{border-top:0;padding-top:2px}
  .s-top{display:flex;gap:10px;align-items:flex-start}
  .num{
    flex:0 0 auto;width:20px;height:20px;border-radius:7px;
    background:rgba(255,255,255,.07);border:1px solid var(--line);
    display:grid;place-items:center;font-size:11px;font-weight:700;color:#b9b9c9;
    margin-top:1px;font-variant-numeric:tabular-nums;
  }
  .s-body{flex:1 1 auto;min-width:0}
  .s-title{font-size:14.5px;font-weight:700;letter-spacing:-0.01em;overflow-wrap:anywhere}
  .s-artist{font-size:11.5px;color:#9a9aab;margin-top:2px;overflow-wrap:anywhere}
  .s-why{font-size:12.5px;color:#b6b6c6;line-height:1.55;margin-top:6px;overflow-wrap:anywhere}
  .s-why::before{content:"“";color:#6f68a8}
  .s-why::after{content:"”";color:#6f68a8}
  .links{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  a.link{
    display:inline-flex;align-items:center;gap:5px;
    text-decoration:none;font-size:11.5px;font-weight:700;
    padding:8px 11px;border-radius:11px;white-space:nowrap;
    border:1px solid rgba(255,255,255,.13);
    background:rgba(255,255,255,.05);color:#e9e9f2;
  }
  a.link.yt{background:rgba(255,90,90,.14);border-color:rgba(255,90,90,.42);color:#ffd9d9}
  a.link.ytm{background:linear-gradient(160deg,rgba(255,90,90,.85),rgba(214,40,80,.85));border-color:rgba(255,120,120,.5);color:#fff}
  a.link:active{transform:scale(.97)}
  a.link .ic{font-size:10px}

  .actions{display:flex;gap:8px;margin-top:14px}
  .btn{
    flex:1 1 0;min-width:0;border-radius:13px;padding:12px 8px;
    border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:#e8e8f2;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
  }
  .btn:active{transform:scale(.98)}
  .btn.primary{background:linear-gradient(160deg,rgba(185,167,255,.26),rgba(122,208,255,.18));border-color:rgba(185,167,255,.4)}

  .sound-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .sound-top .t{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
  .state{font-size:11px;color:#7f7f8f;font-variant-numeric:tabular-nums}
  .sound-chips{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap}
  .sound-chips .chip{padding:9px 11px;border-radius:12px;font-size:12px}
  .sound-ctrl{display:flex;align-items:center;gap:9px}
  .btn-play{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
    background:linear-gradient(160deg,#9d86ff,#4fa9f5);color:#fff;font-size:15px;
    display:grid;place-items:center;box-shadow:0 8px 20px rgba(110,110,255,.3);
  }
  .btn-play:active{transform:scale(.95)}
  .volwrap{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:8px}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;
  }
  input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;margin-top:-6px;
    box-shadow:0 2px 8px rgba(0,0,0,.4)
  }
  input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.16)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
  .btn-mini{
    flex:0 0 auto;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#d4d4e0;
    font:inherit;font-size:11.5px;font-weight:700;padding:9px 11px;border-radius:11px;cursor:pointer;white-space:nowrap;
  }
  .btn-mini:active{transform:scale(.97)}

  footer.note{margin:6px 4px 0;color:#65657a;font-size:11px;line-height:1.65;text-align:center}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:rgba(28,28,38,.96);border:1px solid rgba(255,255,255,.14);
    color:#eee;font-size:12.5px;font-weight:600;padding:11px 15px;border-radius:13px;
    opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:20;max-width:88vw;text-align:center;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div class="eyebrow">Mood Playlist</div>
    <h1>지금 기분 <span class="grad">한 줄</span>이면,<br>노래 다섯 곡.</h1>
    <p class="sub">연령대·목소리·성격·기분을 고르면, 몰라서 못 들었던 곡으로 골라줄게.</p>
  </header>

  <section class="card" aria-label="취향 선택">
    <div class="row">
      <p class="row-label"><span class="n">1</span> 연령대 <span class="hint">그때의 감성</span></p>
      <div class="chips" id="ages" role="group" aria-label="연령대">
        <button class="chip" type="button" data-age="20s" aria-pressed="false">20대</button>
        <button class="chip" type="button" data-age="30s" aria-pressed="false">30대</button>
        <button class="chip" type="button" data-age="40s" aria-pressed="false">40대</button>
        <button class="chip" type="button" data-age="50s" aria-pressed="false">50대+</button>
      </div>
    </div>

    <div class="row">
      <p class="row-label"><span class="n">2</span> 목소리 취향 <span class="hint">누가 부르면 좋아</span></p>
      <div class="chips" id="genders" role="group" aria-label="목소리 취향">
        <button class="chip" type="button" data-gender="any" aria-pressed="true">상관없음</button>
        <button class="chip" type="button" data-gender="M" aria-pressed="false">남성 보컬</button>
        <button class="chip" type="button" data-gender="F" aria-pressed="false">여성 보컬</button>
      </div>
    </div>

    <div class="row">
      <p class="row-label"><span class="n">3</span> 성격 <span class="hint">요즘의 나</span></p>
      <div class="chips" id="pers" role="group" aria-label="성격">
        <button class="chip" type="button" data-p="calm" aria-pressed="false"><span class="e">🌿</span>차분·내향</button>
        <button class="chip" type="button" data-p="passion" aria-pressed="false"><span class="e">🔥</span>열정·직진</button>
        <button class="chip" type="button" data-p="dreamy" aria-pressed="false"><span class="e">🌌</span>몽환·감성</button>
        <button class="chip" type="button" data-p="real" aria-pressed="false"><span class="e">🧊</span>현실·담백</button>
      </div>
    </div>

    <div class="row">
      <p class="row-label"><span class="n">4</span> 기분·상태 <span class="hint">지금 이 순간</span></p>
      <div class="chips" id="moods" role="group" aria-label="기분">
        <button class="chip" type="button" data-mood="tired" aria-pressed="false"><span class="e">🌙</span>지친 밤</button>
        <button class="chip" type="button" data-mood="rain" aria-pressed="false"><span class="e">☔</span>비 오는 날</button>
        <button class="chip" type="button" data-mood="drive" aria-pressed="false"><span class="e">🏍️</span>드라이브·주행</button>
        <button class="chip" type="button" data-mood="drink" aria-pressed="false"><span class="e">🥃</span>혼자 한잔</button>
        <button class="chip" type="button" data-mood="dawn" aria-pressed="false"><span class="e">🌃</span>새벽</button>
        <button class="chip" type="button" data-mood="refresh" aria-pressed="false"><span class="e">🔆</span>리프레시</button>
      </div>
    </div>

    <div class="row">
      <p class="row-label"><span class="n">5</span> 한 줄로 말해도 돼 <span class="hint">키워드로 알아서</span></p>
      <div class="ask">
        <input id="free" type="text" maxlength="60" placeholder="예) 비 맞으면서 배달했어, 녹초야" aria-label="지금 상태 한 줄">
        <button class="btn-go" id="go" type="button">플리 짜줘</button>
      </div>
    </div>
  </section>

  <section class="card" id="result" hidden aria-live="polite">
    <div class="result-head">
      <h2>Today's 5</h2>
      <div class="tags" id="tags"></div>
    </div>
    <p class="mood-name" id="mood-name"></p>
    <p class="pool-note" id="pool-note" hidden></p>
    <blockquote id="reply"></blockquote>
    <ol class="songs" id="songs"></ol>
    <div class="actions">
      <button class="btn primary" id="save" type="button">🖼 카드 저장</button>
      <button class="btn" id="copy" type="button">📋 텍스트 복사</button>
      <button class="btn" id="reroll" type="button">🔄 다시</button>
    </div>
  </section>

  <section class="card" aria-label="무드 사운드">
    <div class="sound-top">
      <span class="t">Mood Sound</span>
      <span class="state" id="snd-state">정지 · 0.000</span>
    </div>
    <div class="sound-chips" id="snd-modes" role="group" aria-label="배경음 종류">
      <button class="chip" type="button" data-snd="rain" aria-pressed="true">🌧 비 오는 밤 로파이</button>
      <button class="chip" type="button" data-snd="piano" aria-pressed="false">🎹 따뜻한 피아노</button>
      <button class="chip" type="button" data-snd="hush" aria-pressed="false">☁️ 포근한 백색소음</button>
    </div>
    <div class="sound-ctrl">
      <button class="btn-play" id="play" type="button" aria-label="배경음 재생">▶</button>
      <div class="volwrap">
        <input id="vol" type="range" min="0" max="100" value="55" aria-label="볼륨">
      </div>
      <button class="btn-mini" id="reset-snd" type="button">리셋</button>
    </div>
  </section>

  <footer class="note">
    추천곡은 원곡 음원을 직접 담지 않고, 유튜브·유튜브 뮤직에서 바로 찾아 듣도록 연결만 합니다.<br>
    배경음은 이 앱이 실시간으로 만드는 소리예요.
  </footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  "use strict";

  /* ─────────────── 곡 데이터 ───────────────
     g: M 남성 / F 여성 / I 연주
     ages: 잘 맞는 연령대, p: 성격, moods: 기분
     why: 왜 이 곡인지 한 줄                                   */
  const SONGS = [
    // ── 한국 올드·포크·발라드
    {t:"사랑하는 그대에게", a:"유심초", y:"1985", g:"F", ages:["40s","50s"], p:["dreamy"], moods:["tired","dawn"], why:"몰라서 못 들었을 1985년 목소리. 오늘 같은 밤에 처음 만나면 더 좋아요."},
    {t:"개여울", a:"정미조", y:"1972", g:"F", ages:["40s","50s"], p:["dreamy","calm"], moods:["rain","dawn"], why:"김소월 시에 붙인 멜로디. 비 오는 날엔 유난히 또렷하게 들려요."},
    {t:"휘파람을 부세요", a:"정미조", y:"", g:"F", ages:["40s","50s"], p:["calm"], moods:["dawn","refresh"], why:"휘파람 하나로 마음을 가라앉히는 1970년대식 방법."},
    {t:"비처럼 음악처럼", a:"김현식", y:"1986", g:"M", ages:["40s","50s"], p:["dreamy"], moods:["rain","dawn"], why:"비 오는 날 왜 이 노래가 제일 정확한지, 들으면 알아요."},
    {t:"그대 떠난 뒤", a:"빛과 소금", y:"1990", g:"M", ages:["40s","50s"], p:["dreamy"], moods:["rain"], why:"첫 소절이 '온종일 비가 온 날은'. 오늘 날씨 전용곡이에요."},
    {t:"내 곁에서 떠나가지 말아요", a:"빛과 소금", y:"1990", g:"M", ages:["40s","50s"], p:["calm"], moods:["tired","dawn"], why:"1990년 감성인데 이상하게 오늘 밤에 딱 맞아요."},
    {t:"샴푸의 요정", a:"빛과 소금", y:"1990", g:"M", ages:["40s","50s"], p:["passion"], moods:["drink","refresh"], why:"1990년 클럽 감성. 혼자인데 왜 어깨가 들썩이죠?"},
    {t:"오래된 친구", a:"빛과 소금", y:"1990", g:"M", ages:["40s","50s"], p:["real"], moods:["drive","tired"], why:"퇴근길에 딱 맞는, 옛 친구 같은 곡."},

    {mood:"drink",   words:[["술",3],["한잔",3],["소주",3],["맥주",3],["혼술",3],["안주",2],["취했",2]]},
    {mood:"dawn",    words:[["새벽",3],["불면",3],["잠이",2],["못 자",2],["깨어",2],["밤새",2],["잠",1]]},
    {mood:"refresh", words:[["답답",3],["짜증",3],["스트레스",3],["환기",2],["기분전환",3],["신나",2],["설레",2],["두근",2],["멍",2],["지루",2],["화",1]]},
    {mood:"tired",   words:[["지치",3],["피곤",3],["힘들",3],["녹초",3],["번아웃",3],["죽겠",2],["기운",2],["무기력",2],["우울",2],["슬프",2],["외로",2]]}
  ];

  const state = {age:"30s", gender:"any", p:"calm", mood:null, seed:0, picked:null, lastMatch:null};

  const $ = (s, r) => (r||document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r||document).querySelectorAll(s));

  function ytUrl(s){ return "https://www.youtube.com/results?search_query=" + encodeURIComponent(s.a + " " + s.t); }
  function ytmUrl(s){ return "https://music.youtube.com/search?q=" + encodeURIComponent(s.a + " " + s.t); }

  function hashStr(str){
    let h = 2166136261;
    for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0);
  }
  function seededShuffle(arr, seed){
    const a = arr.slice();
    let x = seed >>> 0 || 1;
    for(let i=a.length-1;i>0;i--){
      x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0;
      const j = x % (i+1);
      const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function pickSongs(sel){
    const inMood = SONGS.filter(s => s.moods.indexOf(sel.mood) !== -1);
    const gOk = s => sel.gender === "any" ? true : (s.g === sel.gender || s.g === "I");

    // 1) 무드 + 목소리 + 연령대가 모두 맞는 곡이 5곡 이상이면 그것만 사용
    // 2) 아니면 무드 + 목소리, 3) 그래도 부족하면 무드 전체에서 고름
    const strict = inMood.filter(s => gOk(s) && s.ages.indexOf(sel.age) !== -1);
    const byGender = inMood.filter(gOk);
    const pool = strict.length >= 5 ? strict : (byGender.length >= 5 ? byGender : (inMood.length >= 5 ? inMood : SONGS.slice()));

    const scored = pool.map(s => {
      let sc = 10;
      if(sel.gender !== "any" && s.g === sel.gender) sc += 6;
      if(s.ages.indexOf(sel.age) !== -1) sc += 6;
      if(s.p.indexOf(sel.p) !== -1) sc += 3;
      return {s:s, sc:sc};
    });
    scored.sort((x,y)=> (y.sc - x.sc) || (x.s.t < y.s.t ? -1 : 1));

    const seedBase = hashStr(sel.mood + sel.age + sel.gender + sel.p) + sel.seed * 7919;
    const agePool = scored.filter(o => o.s.ages.indexOf(sel.age) !== -1).map(o => o.s);
    const restPool = scored.filter(o => o.s.ages.indexOf(sel.age) === -1).map(o => o.s);

    const perArtist = pool.length >= 10 ? 2 : 3;
    const out = [], count = {};
    const take = s => {
      const c = count[s.a] || 0;
      if(c >= perArtist) return false;
      if(out.indexOf(s) !== -1) return false;
      out.push(s); count[s.a] = c + 1;
      return true;
    };

    // 연령대가 맞는 곡을 먼저 채우고, 모자라면 이웃 세대로 채웁니다.
    const ageFirst = agePool.length >= 5
      ? seededShuffle(agePool.slice(0, Math.min(12, agePool.length)), seedBase)
      : seededShuffle(agePool, seedBase);
    for(const s of ageFirst){ if(out.length === 5) break; take(s); }
    if(out.length < 5){
      for(const s of seededShuffle(restPool, seedBase + 13)){ if(out.length === 5) break; take(s); }
    }
    if(out.length < 5){
      for(const s of pool){
        if(out.length === 5) break;
        if(out.indexOf(s) === -1) out.push(s);
      }
    }
    if(out.length < 5){
      for(const s of SONGS){
        if(out.length === 5) break;
        if(out.indexOf(s) === -1 && s.moods.indexOf(sel.mood) !== -1) out.push(s);
      }
    }

    const ageHit = out.filter(s => s.ages.indexOf(sel.age) !== -1).length;
    const note = ageHit < out.length
      ? AGE_LABEL[sel.age] + " 곡이 모자라 이웃 세대에서 " + (out.length - ageHit) + "곡 채웠어"
      : "";
    return {list: out, note: note};
  }

  function replyFor(sel){
    const r = MOODS[sel.mood].reply;
    const idx = (hashStr(sel.age + sel.gender + sel.p + sel.mood) + sel.seed) % r.length;
    return r[idx];
  }

  /* ─────────────── 무드 사운드 ─────────────── */
  const SND = {
    ctx:null, master:null, analyser:null, nodes:[], buf:null,
    playing:false, mode:"rain", vol:0.55, timer:null, phase:0,

    ensure(){
      if(this.ctx) return this.ctx;
      const AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0;
      this.analyser = this.ctx.createAnalyser();
      this.analyser.fftSize = 2048;
      this.master.connect(this.analyser);
      this.analyser.connect(this.ctx.destination);
      return this.ctx;
    },

    noiseBuffer(){
      if(this.buf) return this.buf;
      const ctx = this.ctx;
      const len = Math.floor(ctx.sampleRate * 4);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2 - 1;
        last = (last + 0.02 * w) / 1.02;
        d[i] = last * 3.2;
      }
      // 아주 옅은 파도 결
      for(let i=0;i<len;i++){
        d[i] += Math.sin(i / ctx.sampleRate * 2 * Math.PI * 0.12) * 0.02;
      }
      this.buf = buf;
      return buf;
    },

    start(mode){
      const ctx = this.ensure();
      if(!ctx) return false;
      this.stopNodes();
      this.mode = mode || this.mode;
      if(ctx.state === "suspended") { ctx.resume(); }

      const t0 = ctx.currentTime + 0.03;
      const ramp = 0.6;

      if(this.mode === "rain"){
        const src = ctx.createBufferSource();
        src.buffer = this.noiseBuffer(); src.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.4;
        const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 180;
        const g = ctx.createGain(); g.gain.value = 0.42;
        // 느린 파도 LFO
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.09;
        const lfoGain = ctx.createGain(); lfoGain.gain.value = 0.16;
        lfo.connect(lfoGain); lfoGain.connect(g.gain);
        src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(this.master);
        src.start(t0); lfo.start(t0);
        this.nodes.push(src, lfo);
        // 따뜻한 패드
        [220, 277.18, 329.63].forEach((f, i) => {
          const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
          const og = ctx.createGain(); og.gain.value = 0.035 - i*0.008;
          o.connect(og); og.connect(this.master); o.start(t0);
          this.nodes.push(o);
        });
      } else if(this.mode === "piano"){
        this.schedulePiano(t0);
      } else {
        const src = ctx.createBufferSource();
        src.buffer = this.noiseBuffer(); src.loop = true;
        const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 900; lp.Q.value = 0.2;
        const g = ctx.createGain(); g.gain.value = 0.3;
        src.connect(lp); lp.connect(g); g.connect(this.master);
        src.start(t0);
        this.nodes.push(src);
      }

      this.master.gain.cancelScheduledValues(ctx.currentTime);
      this.master.gain.setValueAtTime(0.0001, ctx.currentTime);
      this.master.gain.exponentialRampToValueAtTime(Math.max(0.0001, this.vol), ctx.currentTime + ramp);
      this.playing = true;
      return true;
    },

    schedulePiano(t0){
      const ctx = this.ctx;
      const notes = [261.63, 329.63, 392.00, 493.88, 392.00, 329.63];
      const self = this;
      const playNote = (freq, start, dur, level) => {
        const o = ctx.createOscillator(); o.type = "triangle"; o.frequency.value = freq;
        const o2 = ctx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(level, start + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
        const g2 = ctx.createGain(); g2.gain.value = 0.18;
        o.connect(g); o2.connect(g2); g2.connect(g);
        g.connect(self.master);
        o.start(start); o.stop(start + dur + 0.05);
        o2.start(start); o2.stop(start + dur + 0.05);
      };
      let step = 0;
      const tick = () => {
        if(!self.playing) return;
        const now = ctx.currentTime + 0.06;
        const f = notes[step % notes.length];
        playNote(f, now, 1.9, 0.26);
        if(step % 3 === 0) playNote(f / 2, now, 2.6, 0.14);
        step++;
        self.timer = setTimeout(tick, 620);
      };
      tick();
    },

    stopNodes(){
      if(this.timer){ clearTimeout(this.timer); this.timer = null; }
      this.nodes.forEach(n => { try{ n.stop(0); }catch(e){} try{ n.disconnect(); }catch(e){} });
      this.nodes = [];
    },

    mute(){
      if(this.ctx){
        try{
          this.master.gain.cancelScheduledValues(this.ctx.currentTime);
          this.master.gain.setValueAtTime(0, this.ctx.currentTime);
        }catch(e){}
      }
      this.playing = false;
      this.stopNodes();
    },

    reset(){
      this.playing = false;
      this.stopNodes();
      if(this.ctx){
        try{ this.master.gain.value = 0; }catch(e){}
        try{ this.ctx.close(); }catch(e){}
      }
      this.ctx = null; this.master = null; this.analyser = null; this.buf = null;
    },

    rms(){
      if(!this.analyser) return 0;
      const a = this.analyser;
      const buf = new Float32Array(a.fftSize);
      a.getFloatTimeDomainData(buf);
      let sum = 0;
      for(let i=0;i<buf.length;i++) sum += buf[i]*buf[i];
      const v = Math.sqrt(sum / buf.length);
      return isFinite(v) ? v : 0;
    }
  };

  function sndState(){
    const el = $("#snd-state");
    const v = SND.rms();
    el.textContent = (SND.playing ? "재생" : "정지") + " · " + v.toFixed(3);
  }
  let rmsTimer = null;
  function startRmsLoop(){
    if(rmsTimer) return;
    rmsTimer = setInterval(sndState, 220);
  }
  startRmsLoop();

  /* ─────────────── 카드 저장 (1080×1350) ─────────────── */
  function drawCard(sel){
    const W = 1080, H = 1350;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    const g = cv.getContext("2d");

    const bg = g.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#0b0b12");
    bg.addColorStop(0.5, "#101425");
    bg.addColorStop(1, "#0a1014");
    g.fillStyle = bg; g.fillRect(0, 0, W, H);

    const glow1 = g.createRadialGradient(170, 90, 20, 170, 90, 620);
    glow1.addColorStop(0, "rgba(120,90,230,0.55)");
    glow1.addColorStop(1, "rgba(120,90,230,0)");
    g.fillStyle = glow1; g.fillRect(0, 0, W, 700);

    const glow2 = g.createRadialGradient(W-80, H-120, 30, W-80, H-120, 700);
    glow2.addColorStop(0, "rgba(40,140,190,0.45)");
    glow2.addColorStop(1, "rgba(40,140,190,0)");
    g.fillStyle = glow2; g.fillRect(0, H-800, W, 800);

    const pad = 82;
    // 헤더
    g.fillStyle = "rgba(255,255,255,0.45)";
    g.font = "600 26px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    g.fillText("MOOD PLAYLIST", pad, 118);

    g.fillStyle = "#ffffff";
    g.font = "700 60px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    const mood = MOODS[sel.mood];
    g.fillText(mood.emoji + " " + mood.label, pad, 208);

    g.fillStyle = "rgba(200,196,255,0.85)";
    g.font = "600 28px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    g.fillText(AGE_LABEL[sel.age] + " · " + G_LABEL[sel.gender] + " · " + P_LABEL[sel.p], pad, 258);

    // 답장
    const reply = replyFor(sel);
    g.fillStyle = "rgba(255,255,255,0.07)";
    roundRect(g, pad, 300, W - pad*2, 210, 28); g.fill();
    g.strokeStyle = "rgba(255,255,255,0.12)"; g.lineWidth = 2;
    roundRect(g, pad, 300, W - pad*2, 210, 28); g.stroke();

    g.fillStyle = "#f4f4f8";
    g.font = "600 34px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    wrapText(g, reply, pad + 30, 372, W - pad*2 - 60, 48, 3);

    g.fillStyle = "rgba(255,255,255,0.42)";
    g.font = "600 24px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    g.fillText("— 린다가", pad + 30, 486);

    // 곡 목록
    let y = 580;
    sel.picked.forEach(function(s, i){
      g.fillStyle = "rgba(255,255,255,0.055)";
      roundRect(g, pad, y - 46, W - pad*2, 118, 22); g.fill();

      g.fillStyle = "rgba(255,255,255,0.35)";
      g.font = "700 26px -apple-system,sans-serif";
      g.fillText(String(i+1).padStart(2, "0"), pad + 28, y);

      g.fillStyle = "#ffffff";
      g.font = "700 33px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
      const title = fitText(g, s.t, W - pad*2 - 220);
      g.fillText(title, pad + 88, y - 2);

      g.fillStyle = "rgba(210,210,225,0.72)";
      g.font = "500 24px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
      const sub = fitText(g, s.a + (s.y ? " · " + s.y : ""), W - pad*2 - 220);
      g.fillText(sub, pad + 88, y + 36);

      y += 138;
    });

    // 푸터
    g.fillStyle = "rgba(255,255,255,0.30)";
    g.font = "500 22px -apple-system,'Apple SD Gothic Neo','Liberation Sans',Arial,sans-serif";
    g.fillText("원곡은 유튜브·유튜브 뮤직에서 바로 들을 수 있어요", pad, H - 86);
    g.fillStyle = "rgba(255,255,255,0.18)";
    g.fillText("soonsoo1004.github.io/mood-playlist", pad, H - 52);

    return cv;
  }
  function roundRect(g, x, y, w, h, r){
    g.beginPath();
    g.moveTo(x+r, y);
    g.arcTo(x+w, y, x+w, y+h, r);
    g.arcTo(x+w, y+h, x, y+h, r);
    g.arcTo(x, y+h, x, y, r);
    g.arcTo(x, y, x+w, y, r);
    g.closePath();
  }
  function wrapText(g, text, x, y, maxW, lh, maxLines){
    const words = text.split(" ");
    let line = "", lines = 0;
    for(let i=0;i<words.length;i++){
      const test = line ? line + " " + words[i] : words[i];
      if(g.measureText(test).width > maxW && line){
        g.fillText(line, x, y);
        line = words[i]; y += lh; lines++;
        if(maxLines && lines >= maxLines - 1 && i < words.length - 1){
          line = fitText(g, line + " " + words.slice(i+1).join(" "), maxW);
        }
      } else {
        line = test;
      }
    }
    if(line) g.fillText(line, x, y);
  }
  function fitText(g, text, maxW){
    if(g.measureText(text).width <= maxW) return text;
    let t = text;
    while(t.length > 1 && g.measureText(t + "…").width > maxW) t = t.slice(0, -1);
    return t + "…";
  }

  }

    if(state.mood) { state.seed = 0; applyPick(false); }
  });
  $("#moods").addEventListener("click", function(e){
    const b = e.target.closest(".chip"); if(!b) return;
    state.mood = b.dataset.mood; setPressed($("#moods"), "mood", state.mood);
    run();
  });

  function fromFreeText(text){
    const t = text.trim();
    if(!t) return null;
    let best = null, bestScore = 0;
    KEYWORDS.forEach(function(k){
      k.words.forEach(function(pair){
        const w = pair[0], weight = pair[1];
        const at = t.indexOf(w);
        if(at !== -1){
          // 센 신호 우선, 같은 세기면 먼저 말한 쪽 우선
          const sc = weight * 100 - at;
          if(sc > bestScore){ bestScore = sc; best = k.mood; }
        }
      });
    });
    return best;
  }

  $("#go").addEventListener("click", function(){
    const t = $("#free").value;
    const found = fromFreeText(t);
    if(found){
      state.mood = found; setPressed($("#moods"), "mood", found);
      toast("‘" + t.trim().slice(0,12) + "’ → " + MOODS[found].label + "으로 맞췄어");
    } else if(!state.mood){
      state.mood = "tired"; setPressed($("#moods"), "mood", "tired");
    }
    run();
  });
  $("#free").addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); $("#go").click(); }
  });

  $("#reroll").addEventListener("click", function(){
    if(!state.mood) return;
    state.seed += 1;
    applyPick();
    toast("다른 조합으로 다시 골랐어");
  });

  $("#save").addEventListener("click", function(){
    if(!state.mood) return;
    try{
      const cv = drawCard(state);
      const url = cv.toDataURL("image/png");
      if(!url || url.length < 1000) throw new Error("empty canvas");
      window.__lastCard = {w:cv.width, h:cv.height, bytes:url.length};
      const a = document.createElement("a");
      a.href = url;
      a.download = "mood-playlist-" + state.mood + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast("카드 저장했어 (1080×1350)");
    }catch(err){
      toast("저장이 안 되면 텍스트 복사를 써줘");
    }
  });

  $("#copy").addEventListener("click", function(){
    if(!state.mood) return;
    const txt = plainText(state);
    const done = function(){ toast("복사했어. 붙여넣기만 하면 돼"); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(done).catch(function(){ legacyCopy(txt, done); });
    } else {
      legacyCopy(txt, done);
    }
  });
  function legacyCopy(txt, cb){
    try{
      const ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed"; ta.style.top = "-1000px";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
      cb();
    }catch(e){ toast("복사가 막혔어. 길게 눌러 선택해줘"); }
  }

  $("#snd-modes").addEventListener("click", function(e){
    const b = e.target.closest(".chip"); if(!b) return;
    $$(".chip", $("#snd-modes")).forEach(function(x){ x.setAttribute("aria-pressed", String(x === b)); });
    SND.mode = b.dataset.snd;
    if(SND.playing) SND.start(SND.mode);
  });

  $("#play").addEventListener("click", function(){
    if(SND.playing){
      SND.mute();
      this.textContent = "▶";
      this.setAttribute("aria-label", "배경음 재생");
    } else {
      const ok = SND.start(SND.mode);
      this.textContent = ok ? "❚❚" : "▶";
      if(ok) this.setAttribute("aria-label", "배경음 정지");
    }
    sndState();
  });

  $("#vol").addEventListener("input", function(){
    SND.vol = Number(this.value) / 100;
    if(SND.ctx && SND.playing){
      try{
        SND.master.gain.cancelScheduledValues(SND.ctx.currentTime);
        SND.master.gain.setTargetAtTime(Math.max(0.0001, SND.vol), SND.ctx.currentTime, 0.05);
      }catch(e){}
    }
  });

  $("#reset-snd").addEventListener("click", function(){
    SND.reset();
    $("#play").textContent = "▶";
    sndState();
    toast("사운드 리셋 완료");
  });

  // 초기 상태 반영
  setPressed($("#ages"), "age", state.age);
  setPressed($("#genders"), "gender", state.gender);
  setPressed($("#pers"), "p", state.p);

  // 테스트·검증용 훅
  window.__mood = {
    state: state,
    songs: SONGS,
    rms: function(){ return SND.rms(); },
    isPlaying: function(){ return SND.playing; },
    setAll: function(age, gender, p, mood){
      state.age = age; state.gender = gender; state.p = p; state.mood = mood; state.seed = 0;
      const r = pickSongs(state);
      state.picked = r.list; state.note = r.note;
      setPressed($("#ages"), "age", age);
      setPressed($("#genders"), "gender", gender);
      setPressed($("#pers"), "p", p);
      setPressed($("#moods"), "mood", mood);
      render(state);
      return state.picked.map(function(s){ return s.a + " - " + s.t; });
    },
    links: function(){
      return $$("a.link").map(function(a){ return a.href; });
    }
  };
})();
</script>
</body>
</html>
