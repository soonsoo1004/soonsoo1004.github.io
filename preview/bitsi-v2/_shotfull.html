<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<title>shotfull</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block;width:390px;height:800px}</style>
</head><body>
<iframe id="f" src="index.html" scrolling="no"></iframe>
<script>
window.addEventListener('load',function(){
  var f=document.getElementById('f');
  function fit(){
    try{
      var h=f.contentDocument.documentElement.scrollHeight;
      if(h>0){ f.style.height=h+'px'; document.title='shotfull '+h; }
    }catch(e){ document.title='err '+e.message; }
  }
  f.addEventListener('load',function(){ setTimeout(fit,300); });
  setTimeout(fit,700);
});
</script>
</body></html>
