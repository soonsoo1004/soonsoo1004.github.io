<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d63b6">
<title>🎯 눈먼 탱크 — 숨은 적을 찾아 쏘는 7×7 아케이드</title>
<meta name="description" content="보이지 않는 적 탱크를 7×7 격자에서 추적하는 무광고 단일 HTML 게임. 한 턴에 한 칸 이동하고 한 번 사격합니다. 적은 내가 직전에 쏜 자리를 노립니다.">
<meta name="author" content="린다 (Linda)">
<meta name="robots" content="index,follow">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:#0a4d94;
    color:#f2f9ff;
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Gulim",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    letter-spacing:-.01em;
    -webkit-tap-highlight-color:transparent;
    -webkit-font-smoothing:antialiased;
  }
  :root{
    --neon:#66d4ff;
    --cyan:#a9ecff;
    --red:#ff5f55;
    --gold:#ffd15c;
    --pb:56px;
  }

  /* ───────── 바다 배경 (전부 자체 CSS/SVG) ───────── */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .scene .sky{
    position:absolute;inset:0 0 auto 0;height:26%;
    background:
      radial-gradient(46% 120% at 82% 6%,rgba(255,252,220,.95),rgba(255,246,190,.35) 42%,rgba(255,246,190,0) 68%),
      radial-gradient(120% 100% at 50% -20%,#eafaff 0%,#a8e9ff 46%,#6ccbf7 100%);
  }
  .scene .cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:999px;filter:blur(.5px)}
  .scene .cloud::before,.scene .cloud::after{content:"";position:absolute;background:inherit;border-radius:999px}
  .scene .cloud::before{width:64%;height:150%;left:6%;top:-70%}
  .scene .cloud::after{width:50%;height:120%;right:8%;top:-56%}
  .scene .c1{left:6%;top:3%;width:74px;height:20px;opacity:.85}
  .scene .c2{left:56%;top:8%;width:96px;height:24px;opacity:.7}
  .scene .c3{left:34%;top:0.5%;width:54px;height:15px;opacity:.6}
  .scene .wake{
    position:absolute;left:-20px;bottom:112px;width:150px;height:16px;border-radius:999px;
    background:radial-gradient(60% 100% at 30% 50%,rgba(255,255,255,.8),rgba(255,255,255,0) 72%);
    filter:blur(1px);opacity:.55;
  }
  .scene .horizon{
    position:absolute;left:0;right:0;top:24.4%;height:12px;
    background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.15) 62%,rgba(255,255,255,0));
    filter:blur(.3px);
  }
  .scene .sea{
    position:absolute;inset:24% 0 0 0;
    background:
      radial-gradient(70% 46% at 10% 6%,rgba(150,235,255,.55),rgba(150,235,255,0) 62%),
      radial-gradient(80% 52% at 94% 12%,rgba(150,235,255,.4),rgba(150,235,255,0) 64%),
      radial-gradient(120% 60% at 50% 100%,rgba(4,32,74,.75),rgba(4,32,74,0) 62%),
      linear-gradient(180deg,#37b1ef 0%,#1785d6 18%,#0d62b4 46%,#08458a 74%,#06326a 100%);
  }
  .scene .waves{position:absolute;left:0;right:0;top:19%;width:100%;height:24%;opacity:.95}
  .scene .foam{
    position:absolute;left:-4%;right:-4%;top:24.6%;height:26px;
    background:
      radial-gradient(14px 12px at 10% 60%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%),
      radial-gradient(20px 14px at 34% 45%,rgba(255,255,255,.75),rgba(255,255,255,0) 72%),
      radial-gradient(16px 12px at 62% 62%,rgba(255,255,255,.8),rgba(255,255,255,0) 70%),
      radial-gradient(22px 16px at 86% 48%,rgba(255,255,255,.7),rgba(255,255,255,0) 72%);
    filter:blur(.4px);
  }
  .bubbles i{
    position:absolute;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.75);
    background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,.06) 62%);
    box-shadow:inset 0 0 8px rgba(255,255,255,.5),0 0 10px rgba(180,235,255,.35);
    opacity:.55;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translate3d(0,10vh,0) scale(.85)}
    50%{transform:translate3d(10px,-40vh,0) scale(1.05)}
    100%{transform:translate3d(-6px,-95vh,0) scale(.9)}
  }
  .sparkles i{
    position:absolute;width:14px;height:14px;opacity:.75;
    background:
      radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 62%);
    clip-path:polygon(50% 0%,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0% 50%,42% 42%);
    animation:twinkle 4.6s ease-in-out infinite;
  }
  @keyframes twinkle{0%,100%{transform:scale(.55);opacity:.25}50%{transform:scale(1.1);opacity:.9}}
  .ship{position:absolute;left:-10px;bottom:120px;width:100px;height:44px;opacity:.9;filter:drop-shadow(0 3px 6px rgba(0,25,60,.35))}
  .strike{position:absolute;left:16px;top:2px;width:140px;height:70px;opacity:.5}
  .bmine{position:absolute;width:96px;height:96px;bottom:-30px;filter:drop-shadow(0 6px 12px rgba(0,10,30,.55))}
  .bmine.l{left:-26px}
  .bmine.r{right:-26px;bottom:-6px;width:88px;height:88px}

  /* ───────── 레이아웃 ───────── */
  .wrap{
    position:relative;z-index:2;width:100%;max-width:430px;margin:0 auto;min-height:100dvh;
    padding:calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:8px;
  }
  .wrap>*{flex:0 0 auto}

  /* 상단 */
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:6px;padding-top:16px}
  .titleBadge{
    display:inline-flex;align-items:center;gap:5px;padding:7px 14px 7px 9px;border-radius:14px;
    background:linear-gradient(180deg,#49b3ff 0%,#1a7dd6 58%,#0d55a3 100%);
    border:2px solid rgba(198,240,255,.92);
    box-shadow:0 4px 0 #073a72,0 10px 20px rgba(0,30,70,.45),inset 0 2px 5px rgba(255,255,255,.6);
    transform:rotate(-1.6deg);
    color:#fff;font-weight:900;font-size:16.5px;line-height:1;letter-spacing:-.03em;white-space:nowrap;
    text-shadow:0 2px 0 #0a4a92,0 0 12px rgba(150,225,255,.85);
  }
  .titleBadge .ic{font-size:15px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
  .topRight{display:flex;align-items:flex-end;gap:5px;min-width:0}
  .rbtn{
    flex:none;width:33px;height:33px;border-radius:50%;cursor:pointer;
    display:grid;place-items:center;font-size:14px;line-height:1;color:#eaf7ff;
    background:linear-gradient(180deg,#5fbdff,#1b6ec4 62%,#0e4d94);
    border:1.5px solid rgba(190,240,255,.9);
    box-shadow:0 3px 0 #073a72,0 5px 12px rgba(0,25,60,.4),inset 0 2px 4px rgba(255,255,255,.6);
    transition:transform .1s ease,filter .15s ease;
  }
  .rbtn svg{width:16px;height:16px;display:block;filter:drop-shadow(0 1px 1px rgba(0,20,50,.35))}
  .rbtn .icOff{display:none}
  .rbtn.muted .icOn{display:none}
  .rbtn.muted .icOff{display:block}
  .rbtn:active{transform:translateY(2px);filter:brightness(1.08)}
  .rbtn[aria-pressed="true"]{background:linear-gradient(180deg,#8c98a8,#4c5866 62%,#39434f);border-color:rgba(210,220,230,.8);box-shadow:0 3px 0 #262d36,inset 0 2px 4px rgba(255,255,255,.35)}
  .mascot{width:84px;height:84px;flex:none;margin:0 -2px -6px 0;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,25,60,.45))}
  .mascot svg{width:100%;height:100%;display:block;animation:bobM 3.4s ease-in-out infinite}
  @keyframes bobM{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}

  /* 체력 · 턴 */
  .hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:2px 2px 0}
  .hp{display:flex;flex-direction:column;gap:4px;min-width:0}
  .hp.foe{align-items:flex-end}
  .lab{font-size:10.5px;font-weight:800;color:#d5eeff;letter-spacing:-.01em;text-shadow:0 1px 3px rgba(0,30,70,.55);white-space:nowrap}
  .pips{display:inline-flex;gap:3px}
  .pips i{
    width:17px;height:9px;border-radius:5px;background:rgba(6,32,62,.65);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.14);
    transition:background .2s ease,box-shadow .2s ease,transform .2s ease;
  }
  .pips i.on{background:linear-gradient(180deg,#c9f6ff,#3ec8ff 55%,#0d8fe0);box-shadow:0 0 8px rgba(105,225,255,.95),inset 0 1px 0 rgba(255,255,255,.85)}
  .pips.foe i.on{background:linear-gradient(180deg,#ffd0c9,#ff7a6b 55%,#e03425);box-shadow:0 0 8px rgba(255,120,100,.9),inset 0 1px 0 rgba(255,255,255,.7)}
  .turn{
    font-size:11.5px;font-weight:900;padding:6px 12px;border-radius:999px;white-space:nowrap;
    background:linear-gradient(180deg,rgba(130,225,255,.5),rgba(20,95,175,.75));
    border:1.5px solid rgba(180,240,255,.9);color:#f4fdff;
    text-shadow:0 1px 3px rgba(0,40,90,.7);
    box-shadow:0 3px 10px rgba(0,30,70,.4),inset 0 2px 4px rgba(255,255,255,.5);
    transition:all .18s ease;
  }
  .turn[data-tone="enemy"]{background:linear-gradient(180deg,rgba(255,160,140,.55),rgba(190,45,35,.82));border-color:rgba(255,200,190,.9);animation:turnPulse 1.1s ease-in-out infinite}
  @keyframes turnPulse{0%,100%{box-shadow:0 3px 10px rgba(0,30,70,.4),0 0 0 rgba(255,120,100,0)}50%{box-shadow:0 3px 10px rgba(0,30,70,.4),0 0 16px rgba(255,120,100,.75)}}

  /* ───────── 보드 ───────── */
  .panel{
    position:relative;padding:7px;border-radius:22px;margin:0 auto;
    width:100%;max-width:min(100%,352px,calc(100dvh - 428px));
    background:linear-gradient(180deg,#123059 0%,#0a1f3e 52%,#071732 100%);
    border:2px solid #7ce4ff;
    box-shadow:
      0 0 0 4px rgba(124,228,255,.22),
      0 0 34px rgba(86,196,255,.7),
      inset 0 0 30px rgba(40,130,225,.55),
      0 16px 34px rgba(0,20,50,.55);
  }
  .board{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:min-content;align-items:start;gap:4px;width:100%}
  .cell{
    position:relative;width:100%;aspect-ratio:1/1;height:auto;padding:0;margin:0;font:inherit;color:inherit;
    border-radius:9px;cursor:pointer;overflow:hidden;
    border:1px solid rgba(150,222,255,.62);
    background:
      radial-gradient(130% 88% at 50% -14%,rgba(150,215,255,.5),rgba(150,215,255,0) 60%),
      linear-gradient(170deg,#356ca8 0%,#245183 46%,#1a3f6b 100%);
    box-shadow:inset 0 1px 0 rgba(220,248,255,.55),inset 0 -4px 9px rgba(0,12,34,.45),0 2px 4px rgba(0,12,34,.3);
    display:grid;place-items:center;
    transition:transform .1s ease,background .16s ease,border-color .16s ease;
  }
  .cell:active{transform:scale(.93)}
  .cell .tankIcon{display:none;width:72%;height:72%;filter:drop-shadow(0 1px 1px rgba(0,20,50,.55))}
  .cell.mine{
    background:radial-gradient(circle at 50% 42%,#d9f8ff 0%,#6fd6ff 34%,#2a9be6 62%,#1263b4 100%);
    border-color:#d5f5ff;
  }
  .cell.mine .tankIcon{display:block;animation:tankIdle 2.4s ease-in-out infinite}
  .cell.mine::after{
    content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none;
    box-shadow:0 0 0 2px rgba(150,240,255,.95),0 0 16px rgba(105,220,255,.9),inset 0 2px 6px rgba(255,255,255,.6);
    animation:minePulse 1.9s ease-in-out infinite;
  }
  @keyframes minePulse{0%,100%{opacity:.85}50%{opacity:1}}
  @keyframes tankIdle{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
  .cell.miss{background:linear-gradient(170deg,#2c5c8f,#1d4370 60%,#163454)}
  .cell.miss::before,.cell.miss::after{
    content:"";position:absolute;left:50%;top:50%;width:60%;height:6px;border-radius:3px;
    background:linear-gradient(180deg,#ffb0a4 0%,#ef4a3c 46%,#9c150d 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 2px 4px rgba(0,0,0,.5),0 0 9px rgba(255,90,70,.6);
    transform:translate(-50%,-50%) rotate(45deg);
    animation:xpopA .3s cubic-bezier(.2,1.5,.4,1) both;
  }
  .cell.miss::after{
    transform:translate(-50%,-50%) rotate(-45deg);
    animation:xpopB .3s cubic-bezier(.2,1.5,.4,1) both;
  }
  @keyframes xpopA{0%{opacity:0;transform:translate(-50%,-50%) rotate(45deg) scale(.3)}100%{opacity:1;transform:translate(-50%,-50%) rotate(45deg) scale(1)}}
  @keyframes xpopB{0%{opacity:0;transform:translate(-50%,-50%) rotate(-45deg) scale(.3)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-45deg) scale(1)}}
  .cell.hit{
    background:radial-gradient(circle at 50% 48%,#6b2609 0%,#3a1206 58%,#210a04 100%);
    border-color:rgba(255,160,90,.75);
    box-shadow:inset 0 1px 0 rgba(255,190,140,.35),inset 0 -4px 8px rgba(0,10,30,.5);
  }
  .cell.hit::before{
    content:"";position:absolute;left:50%;top:50%;width:72%;height:72%;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,rgba(255,196,110,.5) 0%,rgba(255,110,45,.22) 50%,rgba(255,90,30,0) 76%);
  }
  .cell.hit::after{
    content:"✸";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:clamp(12px,3.6vw,17px);line-height:1;color:#ffc470;
    text-shadow:0 0 9px rgba(255,120,40,.95),0 0 3px rgba(255,255,255,.9);
  }
  .cell.step{animation:stepPop .28s ease}
  @keyframes stepPop{0%{transform:scale(.86)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
  .cell.watch::after{
    content:"";position:absolute;inset:-1px;border-radius:9px;pointer-events:none;
    border:2.5px solid var(--gold);box-shadow:0 0 14px rgba(255,200,90,.9);
    animation:ping .9s ease forwards;
  }
  .cell.watch.hit-watch::after{border-color:#ff5f55;box-shadow:0 0 16px rgba(255,90,80,.95)}

  @keyframes ping{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.22)}}

  /* 이펙트 레이어 */
  .fx{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
  .shell{position:absolute;border-radius:50%;will-change:transform;
    background:radial-gradient(circle at 38% 34%,#fff 0%,#ffe6a3 34%,#ff9c3d 66%,rgba(255,120,40,0) 82%);
    box-shadow:0 0 10px #ffb347,0 0 26px rgba(255,140,60,.75)}
  .shell.enemy{background:radial-gradient(circle at 38% 34%,#fff 0%,#ffc9c2 34%,#ff5a4d 66%,rgba(255,70,60,0) 82%);
    box-shadow:0 0 10px #ff7a70,0 0 26px rgba(255,80,70,.75)}
  .boom{position:absolute;width:0;height:0;transform:translate(-50%,-50%)}
  .boom i{position:absolute;left:0;top:0;display:block}
  .boom .flash{
    width:var(--cw,44px);height:var(--cw,44px);
    margin:calc(-0.5 * var(--cw,44px)) 0 0 calc(-0.5 * var(--cw,44px));
    border-radius:10px;background:rgba(255,255,255,.95);
    box-shadow:0 0 20px rgba(255,225,160,.95),0 0 40px rgba(255,150,70,.65);
    animation:flashOut .26s ease-out forwards;
  }
  .boom .glow{
    width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,210,120,.85) 0%,rgba(255,150,60,.5) 45%,rgba(255,110,40,0) 74%);
    animation:glowOut .82s ease-out forwards;
  }
  .boom .burst{
    width:132px;height:132px;margin:-66px 0 0 -66px;
    background:radial-gradient(circle,#fff 0%,#fff3c4 30%,#ffc25e 58%,rgba(255,140,50,.85) 78%,rgba(255,120,40,0) 92%);
    clip-path:polygon(50% 0%,56% 33%,72% 6%,68% 37%,94% 21%,74% 47%,100% 58%,72% 60%,88% 92%,62% 68%,56% 100%,48% 69%,28% 98%,35% 64%,4% 80%,25% 54%,0% 44%,27% 43%,13% 11%,39% 34%);
    animation:burstPop .56s cubic-bezier(.2,.9,.3,1) forwards;
  }
  .boom .core{
    width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
    background:radial-gradient(circle,#fff 0%,#fffbdc 42%,#ffd27a 70%,rgba(255,180,80,0) 92%);
    box-shadow:0 0 18px rgba(255,240,190,.95);
    animation:corePop .5s cubic-bezier(.15,.8,.3,1) forwards;
  }
  .boom .ring{
    width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
    border:3px solid rgba(255,232,170,.95);
    animation:ringOut .72s ease-out forwards;
  }
  .boom .ring.r2{border-color:rgba(255,255,255,.8);animation-duration:.52s;animation-delay:.06s}
  .boom .spark{
    width:3.6px;height:11px;margin:-5.5px 0 0 -1.8px;border-radius:2px;background:#fff2be;
    box-shadow:0 0 8px #ffa63c,0 0 16px rgba(255,140,60,.8);
    transform:rotate(var(--a)) translateY(-20px);
    animation:sparkOut .74s ease-out forwards;animation-delay:var(--dl,0ms);
  }
  @keyframes flashOut{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.16)}}
  @keyframes glowOut{0%{opacity:.55;transform:scale(.6)}28%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
  @keyframes burstPop{0%{transform:scale(.24) rotate(-18deg);opacity:0}22%{opacity:1}100%{transform:scale(1.06) rotate(8deg);opacity:0}}
  @keyframes corePop{0%{transform:scale(.35);opacity:.6}22%{transform:scale(1.25);opacity:1}100%{transform:scale(1.9);opacity:0}}
  @keyframes ringOut{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.1);opacity:0}}
  @keyframes sparkOut{0%{transform:rotate(var(--a)) translateY(-20px) scaleY(.4);opacity:1}100%{transform:rotate(var(--a)) translateY(calc(-1 * var(--d))) scaleY(1.1);opacity:0}}
  .boom.red .glow{background:radial-gradient(circle,rgba(255,180,150,.85) 0%,rgba(255,90,70,.5) 45%,rgba(220,40,30,0) 74%)}
  .boom.red .burst{background:radial-gradient(circle,#fff 0%,#ffe0d8 30%,#ff8f7d 58%,rgba(230,60,45,.85) 78%,rgba(220,40,30,0) 92%)}
  .boom.red .ring{border-color:rgba(255,190,180,.95)}
  .boom.red .spark{background:#ffd3cb;box-shadow:0 0 8px #ff6a58,0 0 16px rgba(255,80,60,.8)}

  .splash{position:absolute;width:0;height:0;transform:translate(-50%,-50%)}
  .splash .w{
    position:absolute;left:0;top:0;width:8px;height:8px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,rgba(160,225,255,.35) 62%,rgba(140,210,255,0));
    box-shadow:0 0 7px rgba(180,235,255,.8);
    animation:dropOut .5s ease-out forwards;
  }
  .splash .ring{
    position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
    border:2px solid rgba(200,240,255,.85);animation:ringOut .5s ease-out forwards;
  }
  @keyframes dropOut{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}

  /* ───────── 오버레이 ───────── */
  .overlay{
    position:absolute;inset:0;z-index:6;display:grid;place-items:center;padding:10px;
    border-radius:20px;background:rgba(3,16,36,.46);
    backdrop-filter:blur(2.5px);-webkit-backdrop-filter:blur(2.5px);
    opacity:0;transition:opacity .24s ease;
  }
  .overlay[hidden]{display:none}
  .overlay.show{opacity:1}
  .ovCard{
    text-align:center;padding:18px 16px 16px;width:100%;max-width:264px;border-radius:20px;
    background:
      radial-gradient(120% 70% at 50% -10%,rgba(120,205,255,.35),rgba(120,205,255,0) 62%),
      linear-gradient(180deg,rgba(28,88,156,.98),rgba(8,34,68,.98));
    border:2px solid rgba(140,232,255,.9);
    box-shadow:0 0 26px rgba(90,200,255,.55),inset 0 1px 0 rgba(255,255,255,.35),0 16px 30px rgba(0,10,30,.6);
  }
  .ovEmoji{width:60px;height:60px;margin:0 auto 6px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
  .ovEmoji svg{width:100%;height:100%;display:block}
  .ovTitle{margin:0 0 4px;font-size:23px;font-weight:900;letter-spacing:-.03em;color:#fff;text-shadow:0 2px 10px rgba(0,80,160,.9)}

  .pad{

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    s.connect(bp); bp.connect(g); g.connect(A.master);
    s.start(t0); s.stop(t0 + dur + 0.06);
    reg(s);
  }

  function sfx(kind) {
    if (!A.ctx || A.muted) return;
    var t = A.ctx.currentTime + 0.01;
    if (kind === 'fire') {
      noiseBurst(t, 0.34, 0.20, 1900, 240, 'bandpass');
      tone(520, t, 0.26, 'sawtooth', 0.07, 150);
    } else if (kind === 'enemyfire') {
      noiseBurst(t, 0.30, 0.15, 1250, 200, 'bandpass');
      tone(300, t, 0.24, 'square', 0.04, 120);
    } else if (kind === 'boom') {
      noiseBurst(t, 0.55, 0.33, 950, 70, 'lowpass');
      tone(120, t, 0.42, 'sine', 0.26, 38);
      tone(240, t + 0.012, 0.18, 'triangle', 0.10, 60);
    } else if (kind === 'hitme') {
      noiseBurst(t, 0.50, 0.30, 1500, 100, 'lowpass');
      tone(92, t, 0.50, 'sine', 0.30, 34);
      tone(340, t + 0.02, 0.16, 'square', 0.05, 120);
    } else if (kind === 'splash') {
      noiseBurst(t, 0.26, 0.16, 2600, 900, 'highpass');
      tone(700, t + 0.02, 0.09, 'sine', 0.055, 1300);
      tone(980, t + 0.11, 0.08, 'sine', 0.045, 1700);
    } else if (kind === 'move') {
      noiseBurst(t, 0.05, 0.085, 3200, 1600, 'highpass');
      tone(1100, t, 0.045, 'square', 0.03, 700);
    } else if (kind === 'win') {
      [0, 4, 7, 12, 16].forEach(function (n, i) { tone(523.25 * Math.pow(2, n / 12), t + i * 0.10, 0.28, 'triangle', 0.15); });
      tone(130.81, t, 0.75, 'sine', 0.13);
    } else if (kind === 'lose') {
      [0, -2, -5, -9].forEach(function (n, i) { tone(392 * Math.pow(2, n / 12), t + i * 0.14, 0.34, 'triangle', 0.12); });
    } else if (kind === 'start') {
      tone(660, t, 0.10, 'triangle', 0.09); tone(990, t + 0.08, 0.12, 'sine', 0.07);
    } else if (kind === 'deny') {
      tone(190, t, 0.12, 'square', 0.045, 150);
    }
  }

  /* 배경음 — 가벼운 아케이드 아르페지오 */
  var BGM_MEL = [0, 4, 7, 12, 7, 4, 0, -3, 2, 5, 9, 14, 9, 5, 2, 0,
                 0, 4, 7, 12, 16, 12, 7, 4, 10, 7, 5, 2, 0, 2, 5, 7];
  var BGM_BASS = [0, 0, 7, 7, 9, 9, 5, 5];

  function bgmStart() {
    if (!A.ctx || A.muted || A.bgm.on || (S && S.over)) return;
    if (A.ctx.state === 'suspended') { try { A.ctx.resume(); } catch (e) {} }
    A.bgm.on = true; A.bgm.step = 0; A.bgm.next = A.ctx.currentTime + 0.09;
    A.bgm.timer = setInterval(bgmTick, 70);
  }
  function bgmStop() {
    A.bgm.on = false;
    if (A.bgm.timer) { clearInterval(A.bgm.timer); A.bgm.timer = 0; }
  }
  function bgmTick() {
    if (!A.ctx || !A.bgm.on) return;
    var look = A.ctx.currentTime + 0.26;
    var stepDur = 60 / A.bgm.bpm / 2;
    var guard = 0;
    while (A.bgm.next < look && guard++ < 16) {
      var t = A.bgm.next, i = A.bgm.step;
      var n = BGM_MEL[i % BGM_MEL.length];
      tone(261.63 * Math.pow(2, n / 12), t, 0.17, 'triangle', 0.042);
      if (i % 4 === 0) {
        tone(65.41 * Math.pow(2, BGM_BASS[(i / 4) % BGM_BASS.length] / 12), t, 0.34, 'sine', 0.075);
      }
      if (i % 8 === 4) {
        noiseBurst(t, 0.05, 0.02, 5000, 2400, 'highpass');
      }
      A.bgm.step = (i + 1) % (BGM_MEL.length * 4);
      A.bgm.next += stepDur;
    }
  }

  function stopVoices() {
    var arr = A.nodes.slice();
    A.nodes.length = 0;
    for (var i = 0; i < arr.length; i++) { try { arr[i].stop(0); } catch (e) {} }
  }
  function audioSilence() {
    bgmStop();
    stopVoices();
    masterTo(0, 0);
  }
  function armAudio() {
    var c = audioInit();
    if (!c) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (e) {} }
    if (!A.muted) {
      masterTo(0.9, 0.06);
      if (S && !S.over) bgmStart();
    }
  }
  function rms() {
    if (!A.ctx || !A.ana || !A.master) return 0;
    if (A.ctx.state !== 'running') return 0;
    if (!(A.master.gain.value > 1e-6)) return 0;
    A.ana.getFloatTimeDomainData(A.buf);
    var s = 0;
    for (var i = 0; i < A.buf.length; i++) { var v = A.buf[i]; s += v * v; }
    return Math.sqrt(s / A.buf.length);
  }

  /* ═════════════ DOM ═════════════ */
  var boardEl = document.getElementById('board');
  var fxEl = document.getElementById('fx');
  var panelEl = document.getElementById('panel');
  var wrapEl = document.getElementById('wrap');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('statusText');
  var turnEl = document.getElementById('turn');
  var pipsMe = document.getElementById('pipsMe');
  var pipsFoe = document.getElementById('pipsFoe');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');
  var ovEmoji = document.getElementById('ovEmoji');
  var padEl = document.getElementById('pad');
  var btnMute = document.getElementById('btnMute');

  var TANK_SVG = '<svg class="tankIcon" viewBox="0 0 32 32" aria-hidden="true">' +
    '<rect x="3.2" y="13.4" width="4.6" height="9.2" rx="2.3" fill="#0a3d6d"/>' +
    '<rect x="24.2" y="13.4" width="4.6" height="9.2" rx="2.3" fill="#0a3d6d"/>' +
    '<rect x="7.2" y="11.4" width="17.6" height="12.8" rx="4.4" fill="#10477a"/>' +
    '<rect x="7.2" y="11.4" width="17.6" height="4.4" rx="2.2" fill="#3f8fce"/>' +
    '<circle cx="16" cy="18" r="5.3" fill="#082f57"/>' +
    '<circle cx="16" cy="18" r="3.3" fill="#2276b8"/>' +
    '<rect x="14.85" y="5" width="2.5" height="8.4" rx="1.25" fill="#0a3d6d"/>' +
    '<rect x="14.85" y="5" width="2.5" height="3.2" rx="1.2" fill="#3f8fce"/>' +
    '</svg>';

  var cells = [];
  var S = null;
  var round = 0;

  /* ═════════════ 보드 ═════════════ */
  function build() {
    boardEl.innerHTML = '';
    cells = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cell';
        b.dataset.k = r + ',' + c;
        b.setAttribute('aria-label', (r + 1) + '행 ' + (c + 1) + '열 사격');
        b.innerHTML = TANK_SVG;
        boardEl.appendChild(b);
        cells.push(b);
      }
    }
  }

  /* ═════════════ 상태 ═════════════ */
  function startGame() {
    round += 1;
    audioSilence();
    S = {
      rng: mulberry32(seed + round * 7919),
      phase: 'player',
      hpMe: 3,
      hpFoe: 3,
      me: { r: 6, c: 3 },
      foe: { r: 0, c: 3 },
      marks: new Map(),
      moved: false,
      shots: 0,
      enemyAim: null,
      revealed: null,
      over: false,
      busy: false,
      result: null,
      lastEnemy: null
    };
    S.foe = randomEnemyStart();
    overlay.classList.remove('show');
    overlay.hidden = true;
    fxEl.innerHTML = '';
    setTurn('내 차례', 'me');
    say('적 탱크는 보이지 않아. 칸을 눌러 사격해 봐.', 'idle');
    paint();
    syncHud();
    syncPad();
  }

  function randomEnemyStart() {
    for (var i = 0; i < 300; i++) {
      var r = Math.floor(S.rng() * N), c = Math.floor(S.rng() * N);
      if (Math.max(Math.abs(r - S.me.r), Math.abs(c - S.me.c)) >= 3) return { r: r, c: c };
    }
    return { r: 0, c: 0 };
  }

  function key(r, c) { return r + ',' + c; }
  function inBoard(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

  /* ═════════════ 그리기 ═════════════ */
  function paint() {
    for (var i = 0; i < cells.length; i++) {
      var r = (i / N) | 0, c = i % N, el = cells[i];
      var m = S.marks.get(key(r, c));
      var isMe = (S.me.r === r && S.me.c === c);
      el.classList.toggle('mine', isMe);
      el.classList.toggle('miss', m === 'miss');
      el.classList.toggle('hit', m === 'hit');
      el.setAttribute('aria-label', (r + 1) + '행 ' + (c + 1) + '열' +
        (m === 'hit' ? ' 명중' : m === 'miss' ? ' 빗나감' : '') +
        (isMe ? ' · 내 탱크' : '') + ' 사격');
    }
  }

  function syncHud() {
    var me = pipsMe.children, foe = pipsFoe.children;
    for (var i = 0; i < 3; i++) {
      me[i].className = i < S.hpMe ? 'on' : '';
      foe[i].className = i < S.hpFoe ? 'on' : '';
    }
    pipsMe.setAttribute('aria-label', '내 탱크 체력 ' + S.hpMe);
    pipsFoe.setAttribute('aria-label', '적 탱크 체력 ' + S.hpFoe);
  }

  function syncPad() {
    var lock = !S || S.over || S.phase !== 'player' || S.busy;
    padEl.classList.toggle('lock', !!lock);
  }

  function setTurn(text, tone) {
    turnEl.textContent = text;
    turnEl.setAttribute('data-tone', tone);
  }

  function say(text, tone) {
    statusText.textContent = text;
    statusEl.setAttribute('data-tone', tone || 'idle');
  }

  /* ═════════════ 이펙트 ═════════════ */
  function cellAt(r, c) { return cells[r * N + c]; }

  function centerOf(el) {
    var p = panelEl.getBoundingClientRect(), b = el.getBoundingClientRect();
    return { x: b.left - p.left + b.width / 2, y: b.top - p.top + b.height / 2, w: b.width };
  }

  function fxShell(from, to, kind) {
    var a = centerOf(cellAt(from.r, from.c));
    var b = centerOf(cellAt(to.r, to.c));
    var size = Math.max(10, a.w * 0.34);
    var el = document.createElement('div');
    el.className = 'shell' + (kind === 'enemy' ? ' enemy' : '');
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = (a.x - size / 2) + 'px';
    el.style.top = (a.y - size / 2) + 'px';
    fxEl.appendChild(el);
    var dx = b.x - a.x, dy = b.y - a.y;
    var arc = Math.min(46, Math.hypot(dx, dy) * 0.26 + 10);
    var kf = [
      { transform: 'translate(0,0) scale(.45)', opacity: .25 },
      { transform: 'translate(' + (dx * 0.52) + 'px,' + (dy * 0.52 - arc) + 'px) scale(1)', opacity: 1, offset: .52 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.7)', opacity: 1 }
    ];
    if (el.animate) {
      var an = el.animate(kf, { duration: FLIGHT, easing: 'cubic-bezier(.42,0,.62,1)', fill: 'forwards' });
      an.onfinish = function () { if (el.parentNode) el.parentNode.removeChild(el); };
    }
    /* 애니메이션이 끝나지 않는 예외(탭 전환 등)에서도 포탄이 남지 않도록 안전 삭제 */
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, FLIGHT + 500);
    sfx(kind === 'enemy' ? 'enemyfire' : 'fire');
  }

  function fxBoom(pt, red) {
    var d = document.createElement('div');
    d.className = 'boom' + (red ? ' red' : '');
    d.style.left = pt.x + 'px';
    d.style.top = pt.y + 'px';
    if (pt.w) d.style.setProperty('--cw', pt.w + 'px');
    var sparks = '';
    for (var i = 0; i < 10; i++) {
      var ang = (360 / 10) * i + (Math.random() * 20 - 10);
      var dist = 18 + Math.random() * 24;
      sparks += '<i class="spark" style="--a:' + ang.toFixed(0) + 'deg;--d:' + dist.toFixed(0) + 'px;--dl:' + (i * 10) + 'ms"></i>';
    }
    d.innerHTML = '<i class="flash"></i><i class="glow"></i><i class="burst"></i><i class="core"></i><i class="ring"></i><i class="ring r2"></i>' + sparks;
    fxEl.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1100);
  }

  function fxSplash(pt) {
    var d = document.createElement('div');
    d.className = 'splash';
    d.style.left = pt.x + 'px';
    d.style.top = pt.y + 'px';
    var s = '<i class="ring"></i>';
    for (var i = 0; i < 6; i++) {
      var ang = -160 + i * 32 + (Math.random() * 12 - 6);
      var dx = Math.cos(ang * Math.PI / 180) * (12 + Math.random() * 12);
      var dy = Math.sin(ang * Math.PI / 180) * (10 + Math.random() * 10);
      s += '<i class="w" style="--dx:' + dx.toFixed(0) + 'px;--dy:' + dy.toFixed(0) + 'px;animation-delay:' + (i * 14) + 'ms"></i>';
    }
    d.innerHTML = s;
    fxEl.appendChild(d);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 700);
  }

  function shake() {
    wrapEl.classList.remove('shake');
    void wrapEl.offsetWidth;
    wrapEl.classList.add('shake');
    setTimeout(function () { wrapEl.classList.remove('shake'); }, TEST ? 120 : 400);
  }

  function watchCell(r, c, hit) {
    var el = cellAt(r, c);
    if (!el) return;
    el.classList.remove('watch', 'hit-watch');
    void el.offsetWidth;
    el.classList.add('watch');
    if (hit) el.classList.add('hit-watch');
    setTimeout(function () { el.classList.remove('watch', 'hit-watch'); }, TEST ? 200 : 1100);
  }

  /* ═════════════ 플레이어 ═════════════ */
  function movePlayer(dir) {
    if (!S || S.over) return false;
    if (S.phase !== 'player' || S.busy) { say('지금은 적 차례야. 잠깐만.', 'warn'); return false; }
    if (S.moved) { say('이번 턴엔 이미 한 칸 움직였어. 이제 사격만 남았어.', 'warn'); sfx('deny'); return false; }
    var d = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    if (!d) return false;
    var r = S.me.r + d[0], c = S.me.c + d[1];
    if (!inBoard(r, c)) { say('격자 밖으로는 못 나가.', 'warn'); sfx('deny'); return false; }
    S.me = { r: r, c: c };
    S.moved = true;
    paint();
    var el = cellAt(r, c);
    if (el) { el.classList.remove('step'); void el.offsetWidth; el.classList.add('step'); setTimeout(function () { el.classList.remove('step'); }, 320); }
    sfx('move');
    say('한 칸 옮겼어. 이제 쏠 칸을 골라.', 'good');
    return true;
  }

  function playerFire(r, c) {
    if (!S || S.over) return false;
    if (S.phase !== 'player' || S.busy) { say('지금은 적 차례야. 잠깐만.', 'warn'); return false; }
    if (!inBoard(r, c)) return false;
    if (r === S.me.r && c === S.me.c) { say('내 탱크가 있는 칸엔 쏠 수 없어.', 'warn'); sfx('deny'); return false; }
    var k = key(r, c);
    if (S.marks.has(k)) { say('이미 확인한 칸이야. 다른 칸을 골라 봐.', 'warn'); sfx('deny'); return false; }

    S.busy = true;
    S.shots += 1;
    S.revealed = { r: S.me.r, c: S.me.c };
    syncPad();

    var isHit = (r === S.foe.r && c === S.foe.c);
    fxShell(S.me, { r: r, c: c }, 'player');
    say('포탄 발사!', 'idle');

    setTimeout(function () { resolvePlayerShot(r, c, isHit); }, FLIGHT);
    return true;
  }

  function resolvePlayerShot(r, c, isHit) {
    if (!S || S.over) return;
    var k = key(r, c);
    var pt = centerOf(cellAt(r, c));

    if (isHit) {
      S.marks.set(k, 'hit');
      S.hpFoe -= 1;
      paint();
      syncHud();
      fxBoom(pt, false);
      sfx('boom');
      shake();
      if (S.hpFoe <= 0) { finish('win'); return; }
      say('명중! 적 탱크에 한 발 꽂혔어. 적이 자리를 옮겼어.', 'good');
      relocateFoe();
    } else {
      S.marks.set(k, 'miss');
      paint();
      fxSplash(pt);
      sfx('splash');
      say('빗나감 · 적은 ' + hint(r, c) + '.', 'bad');
    }
    afterPlayer();
  }

  function hint(r, c) {
    var dr = S.foe.r - r, dc = S.foe.c - c;
    var v = dr < 0 ? '북' : (dr > 0 ? '남' : '');
    var h = dc > 0 ? '동' : (dc < 0 ? '서' : '');
    var dir = (v + h) || '바로 앞';
    var md = Math.max(Math.abs(dr), Math.abs(dc));
    var near = md <= 2 ? '바로 근처' : (md <= 4 ? '가까운 편' : '먼 편');
    return dir + '쪽 ' + near;
  }

  function relocateFoe() {
    var pool = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (S.marks.has(key(r, c))) continue;
        if (r === S.foe.r && c === S.foe.c) continue;
        pool.push({ r: r, c: c });
      }
    }
    if (!pool.length) return;
    S.foe = pool[Math.floor(S.rng() * pool.length)];
  }

  /* ═════════════ 적 턴 ═════════════ */
  function afterPlayer() {
    if (!S || S.over) return;
    S.phase = 'enemy';
    S.busy = false;
    setTurn('적 차례', 'enemy');
    syncPad();
    if (TEST) enemyTurn();
    else setTimeout(enemyTurn, THINK);
  }

  function enemyTurn() {
    if (!S || S.over) return;

    if (S.rng() < 0.3) enemyMove();

    var aimed = !!S.enemyAim;
    var target = S.enemyAim || randomFreeCell();

    if (!target) { endEnemyTurn(aimed, false, null); return; }

    S.busy = true;
    syncPad();
    fxShell(S.foe, target, 'enemy');
    setTimeout(function () { resolveEnemyShot(target, aimed); }, FLIGHT);
  }

  function resolveEnemyShot(target, aimed) {
    if (!S || S.over) return;
    var hit = (target.r === S.me.r && target.c === S.me.c);
    var pt = centerOf(cellAt(target.r, target.c));

    if (hit) {
      S.hpMe -= 1;
      syncHud();
      fxBoom(pt, true);
      sfx('hitme');
      shake();
      watchCell(target.r, target.c, true);
      if (S.hpMe <= 0) { S.enemyAim = S.revealed ? { r: S.revealed.r, c: S.revealed.c } : S.enemyAim; finish('lose'); return; }
    } else {
      fxSplash(pt);
      sfx('splash');
      watchCell(target.r, target.c, false);
    }
    endEnemyTurn(aimed, hit, target);
  }

  function endEnemyTurn(aimed, hit, target) {
    if (!S || S.over) return;
    S.enemyAim = S.revealed ? { r: S.revealed.r, c: S.revealed.c } : S.enemyAim;
    S.lastEnemy = target ? { r: target.r, c: target.c, hit: hit } : null;
    S.phase = 'player';
    S.busy = false;
    S.moved = false;
    setTurn('내 차례', 'me');
    syncHud();
    syncPad();
    if (hit) say('피격! 내 탱크 체력 1 줄었어. 쏜 자리를 벗어나야 해.', 'bad');
    else if (aimed) say('적이 지난번에 쏜 자리를 노렸지만 빗나갔어.', 'good');
    else say('적이 아무 데나 한 발 — 빗나갔어.', 'good');
  }

  function randomFreeCell() {
    var pool = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (r === S.foe.r && c === S.foe.c) continue;
        pool.push({ r: r, c: c });
      }
    }
    if (!pool.length) return null;
    return pool[Math.floor(S.rng() * pool.length)];
  }

  function enemyMove() {
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    var pool = [];
    for (var i = 0; i < dirs.length; i++) {
      var r = S.foe.r + dirs[i][0], c = S.foe.c + dirs[i][1];
      if (!inBoard(r, c)) continue;
      if (S.marks.has(key(r, c))) continue;
      if (r === S.me.r && c === S.me.c) continue;
      pool.push({ r: r, c: c });
    }
    if (!pool.length) return;
    S.foe = pool[Math.floor(S.rng() * pool.length)];
  }

  /* ═════════════ 종료 ═════════════ */
  function finish(result) {
    S.over = true;
    S.busy = false;
    S.result = result;
    S.phase = 'over';
    bgmStop();
    setTurn('끝', 'over');
    syncPad();
    ovTitle.textContent = result === 'win' ? '승리!' : '패배';
    ovEmoji.innerHTML = result === 'win'
      ? '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M20 10h24v8h8v4a10 10 0 0 1-10 10h-1.4A12 12 0 0 1 34 37.4V44h8v6H22v-6h8v-6.6A12 12 0 0 1 23.4 32H22a10 10 0 0 1-10-10v-4h8z" fill="#ffd75e" stroke="#e0a400" stroke-width="2.4" stroke-linejoin="round"/><path d="M20 18h-6v3a6 6 0 0 0 6 6zM44 18h6v3a6 6 0 0 1-6 6z" fill="#ffe89a"/></svg>'
      : '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 4l6.2 14.2L53 12.6l-5.6 14.8L60 32l-12.6 4.6L53 51.4 38.2 45.8 32 60l-6.2-14.2L11 51.4l5.6-14.8L4 32l12.6-4.6L11 12.6l14.8 5.6z" fill="#ff8a4a" stroke="#e04b1f" stroke-width="2.4" stroke-linejoin="round"/><circle cx="32" cy="32" r="7.5" fill="#ffd05c"/></svg>';
    ovSub.textContent = result === 'win'
      ? S.shots + '발 만에 적 탱크를 격파했어.'
      : '적 탱크한테 먼저 당했어. ' + S.shots + '발 쐈어.';
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add('show'); });
    sfx(result === 'win' ? 'win' : 'lose');
    setTimeout(function () { stopVoices(); masterTo(0, 0); }, 1600);
    say(result === 'win' ? '적 탱크 격파! 한 판 더 해 볼까?' : '내 탱크가 당했어. 다시 해 볼까?',
      result === 'win' ? 'good' : 'bad');
    paint();
    syncHud();
  }

  /* ═════════════ 입력 ═════════════ */
  function onBoardTap(e) {
    var t = e.target;
    while (t && t !== boardEl && !(t.dataset && t.dataset.k)) t = t.parentNode;
    if (!t || t === boardEl) return;
    var p = t.dataset.k.split(',');
    playerFire(parseInt(p[0], 10), parseInt(p[1], 10));
  }

  boardEl.addEventListener('click', onBoardTap);

  var moveBtns = document.querySelectorAll('[data-move]');
  for (var bi = 0; bi < moveBtns.length; bi++) {
    (function (b) {
      b.addEventListener('click', function () { movePlayer(b.dataset.move); });
    })(moveBtns[bi]);
  }

  /* 리셋: 이전 소리를 모두 끊고 조용히 새 판 시작.
     배경음은 다음 터치(첫 사격) 때 다시 올라온다. */
  document.getElementById('btnReset').addEventListener('click', function () {
    startGame();
  });
  document.getElementById('ovBtn').addEventListener('click', function () {
    startGame();
  });

  btnMute.addEventListener('click', function () {
    A.muted = !A.muted;
    lsSet('bt2_muted', A.muted ? '1' : '0');
    paintMute();
    if (A.muted) {
      audioSilence();
    } else {
      armAudio();
      sfx('start');
    }
  });

  function paintMute() {
    btnMute.classList.toggle('muted', A.muted);
    btnMute.setAttribute('aria-pressed', A.muted ? 'true' : 'false');
    btnMute.setAttribute('aria-label', A.muted ? '소리 켜기' : '소리 끄기');
  }

  /* 첫 터치/키 입력에 오디오 활성 (자동재생 정책 대응) */
  function firstGesture() {
    armAudio();
  }
  document.addEventListener('pointerdown', firstGesture, { once: false });
  document.addEventListener('keydown', function (e) {
    armAudio();
    var map = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' };
    if (map[e.key]) { e.preventDefault(); movePlayer(map[e.key]); }
  });

  /* ═════════════ 테스트 API ═════════════ */
  var api = {
    version: 2,
    get errors() { return errors.slice(); },
    get state() {
      return {
        phase: S.phase, over: S.over, result: S.result, busy: S.busy,
        hpMe: S.hpMe, hpFoe: S.hpFoe,
        me: { r: S.me.r, c: S.me.c }, foe: { r: S.foe.r, c: S.foe.c },
        shots: S.shots, moved: S.moved, enemyAim: S.enemyAim, lastEnemy: S.lastEnemy,
        marks: Array.from(S.marks.entries())
      };
    },
    rms: rms,
    audio: function () {
      return {
        ctx: A.ctx ? A.ctx.state : 'none',
        muted: A.muted,
        gain: A.master ? A.master.gain.value : 0,
        voices: A.nodes.length,
        bgm: A.bgm.on,
        rms: rms()
      };
    },
    fire: playerFire,
    move: movePlayer,
    reset: startGame,
    hint: hint
  };
  if (TEST) {
    api.test = {
      setFoe: function (r, c) { if (inBoard(r, c) && S && !S.over) { S.foe = { r: r, c: c }; return true; } return false; },
      setAim: function (r, c) { if (!S || S.over) return false; S.enemyAim = (r === null) ? null : { r: r, c: c }; return true; },
      setHp: function (me, foe) { if (!S) return false; S.hpMe = me; S.hpFoe = foe; syncHud(); return true; },
      lastEnemy: function () { return S.lastEnemy; }
    };
  }
  window.__blindTank = api;

  /* ═════════════ 배경 장식 생성 ═════════════ */
  (function decorate() {
    var bub = document.getElementById('bubbles'), sp = document.getElementById('sparkles');
    var i, el, size, left, dur, delay;
    for (i = 0; i < 13; i++) {
      el = document.createElement('i');
      size = 6 + Math.random() * 16;
      left = 2 + Math.random() * 94;
      dur = 16 + Math.random() * 16;
      delay = -Math.random() * dur;
      el.style.cssText = 'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;left:' + left.toFixed(1) + '%;top:' + (62 + Math.random() * 34).toFixed(1) + '%;animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + delay.toFixed(1) + 's';
      bub.appendChild(el);
    }
    for (i = 0; i < 6; i++) {
      el = document.createElement('i');
      size = 8 + Math.random() * 8;
      left = 4 + Math.random() * 90;
      el.style.cssText = 'width:' + size.toFixed(0) + 'px;height:' + size.toFixed(0) + 'px;left:' + left.toFixed(1) + '%;top:' + (4 + Math.random() * 52).toFixed(1) + '%;animation-delay:' + (-Math.random() * 4.6).toFixed(1) + 's';
      sp.appendChild(el);
    }
  })();

  /* ═════════════ 시작 ═════════════ */
  paintMute();
  build();
  startGame();
})();
</script>
</body>
</html>
