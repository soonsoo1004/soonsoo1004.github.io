<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>🎯 눈먼 탱크 — 숨은 적을 찾아 쏘는 7×7 게임</title>
<meta name="description" content="보이지 않는 적 탱크를 7×7 격자에서 추적하는 무광고 단일 HTML 게임. 한 턴에 한 칸 이동하고 한 번 사격합니다. 적은 내가 직전에 쏜 자리를 노립니다.">
<meta name="author" content="린다 (Linda)">
<meta name="robots" content="index,follow">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    background:radial-gradient(120% 72% at 50% -12%,#1b2431 0%,#0e1217 58%,#0a0d11 100%);
    color:#eef2f7;
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
    letter-spacing:-.01em;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    width:100%;max-width:420px;margin:0 auto;min-height:100dvh;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:11px;
  }

  /* ---------- 상단 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand .mark{font-size:15px;line-height:1}
  .brand h1{margin:0;font-size:17px;font-weight:750;letter-spacing:-.025em;white-space:nowrap}
  .icon-btn{
    flex:none;width:34px;height:34px;border-radius:50%;cursor:pointer;
    border:1px solid #232c37;background:#161c24;color:#c8d3e0;
    font-size:15px;line-height:1;display:grid;place-items:center;
    transition:transform .12s ease,background .15s ease;
  }
  .icon-btn:active{transform:scale(.93);background:#1d2634}

  /* ---------- 체력 / 턴 ---------- */
  .hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
  .meter{display:flex;flex-direction:column;gap:5px;min-width:0}
  .meter.right{align-items:flex-end}
  .who{font-size:11.5px;color:#8b96a5;letter-spacing:-.01em}
  .pips{display:inline-flex;gap:4px}
  .pips i{width:9px;height:9px;border-radius:999px;background:#2b343f;transition:background .2s ease,transform .2s ease}
  .pips i.on{background:#4ad6a3}
  .pips.foe i.on{background:#ff7a7a}
  .badge{
    font-size:11.5px;font-weight:700;padding:6px 11px;border-radius:999px;white-space:nowrap;
    background:#1b2430;color:#9fb2c8;border:1px solid #263241;transition:all .18s ease;
  }
  .badge[data-tone="me"]{background:#132a44;border-color:#1f4a78;color:#8ec1ff}
  .badge[data-tone="enemy"]{background:#2b1720;border-color:#55272f;color:#ffa2a2}

  /* ---------- 보드 ---------- */
  .panel{
    position:relative;padding:8px;border-radius:22px;
    background:#0f141a;border:1px solid #1d2732;
    box-shadow:0 12px 32px rgba(0,0,0,.38);
  }
  .board{
    display:grid;grid-template-columns:repeat(7,1fr);gap:5px;
    width:100%;max-width:min(376px,50vh);margin:0 auto;
  }
  .cell{
    position:relative;aspect-ratio:1/1;padding:0;margin:0;font:inherit;color:inherit;
    border-radius:11px;border:1px solid #212b36;background:#151b23;cursor:pointer;
    display:grid;place-items:center;
    transition:transform .12s ease,background .15s ease,border-color .15s ease;
  }
  .cell:active{transform:scale(.94)}
  .cell.miss{background:#121821;border-color:#1a232d}
  .cell.miss .glyph{color:#414d5b}
  .cell.hit{background:#3a1520;border-color:#7c2b38;animation:pop .26s ease}
  .cell.hit .glyph{color:#ff9b9b}
  .cell.mine{background:#16304d;border-color:#2f6799;box-shadow:inset 0 0 0 1px #2f6799}
  .glyph{font-size:14px;line-height:1;font-weight:700}
  .unit{display:none;position:absolute;inset:0;place-items:center}
  .unit svg{width:62%;height:62%;fill:#93c5ff}
  .cell.mine .unit{display:grid}
  @keyframes pop{0%{transform:scale(.84)}62%{transform:scale(1.07)}100%{transform:scale(1)}}

  .cell.foe-shot::after,.cell.foe-hit::after{
    content:"";position:absolute;inset:-2px;border-radius:13px;pointer-events:none;
    border:2px solid #ffcf6b;animation:ping .85s ease forwards;
  }
  .cell.foe-hit::after{border-color:#ff6b6b;border-width:3px}
  @keyframes ping{0%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.18)}}

  /* ---------- 결과 ---------- */
  .overlay{
    position:absolute;inset:0;display:grid;place-items:center;z-index:5;
    border-radius:22px;background:rgba(8,11,15,.8);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;transition:opacity .22s ease;
  }
  .overlay[hidden]{display:none}
  .overlay.show{opacity:1}
  .overlay .card{text-align:center;padding:20px}
  .overlay .big{margin:0 0 6px;font-size:24px;font-weight:800;letter-spacing:-.03em}
  .overlay .sub{margin:0 0 16px;font-size:13px;color:#a2aebd;line-height:1.45}
  .primary{
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    padding:11px 20px;border-radius:999px;border:0;
    background:#3d8bfd;color:#fff;transition:transform .12s ease,background .15s ease;
  }
  .primary:active{transform:scale(.96);background:#2f7ae8}

  /* ---------- 상태 / 조작 ---------- */
  .status{
    margin:0;min-height:2.9em;text-align:center;font-size:13.5px;line-height:1.45;
    color:#a9b6c6;padding:0 2px;
  }
  .status[data-tone="good"]{color:#7ee2b8}
  .status[data-tone="bad"]{color:#ffa8a8}
  .status[data-tone="warn"]{color:#ffd08a}

  .pad{
    display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);
    gap:6px;justify-content:center;margin:0 auto;
  }
  .pad button{
    font:inherit;font-size:12px;cursor:pointer;border-radius:12px;
    border:1px solid #253040;background:#161d26;color:#c6d2e0;
    transition:transform .1s ease,background .15s ease;
  }
  .pad button:active{transform:scale(.93);background:#1e2835}
  .pad .c{display:grid;place-items:center;font-size:10.5px;color:#6d7a8a;letter-spacing:.02em}

  .foot{margin:0;font-size:11px;line-height:1.55;color:#5f6b7a;text-align:center}

  @media (max-height:720px){
    .wrap{gap:8px;padding-top:10px}
    .board{max-width:min(376px,44vh)}
    .pad{grid-template-columns:repeat(3,36px);grid-template-rows:repeat(3,36px)}
    .status{min-height:2.6em}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true">🎯</span>
      <h1>눈먼 탱크</h1>
    </div>
    <button class="icon-btn" id="restart" type="button" aria-label="다시 시작" title="다시 시작">↻</button>
  </header>

  <div class="hud">
    <div class="meter">
      <span class="who">내 탱크</span>
      <div class="pips" id="pipsMe" aria-label="내 탱크 체력"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    </div>
    <div class="badge" id="badge" data-tone="me">내 차례</div>
    <div class="meter right">
      <span class="who">적 탱크</span>
      <div class="pips foe" id="pipsFoe" aria-label="적 탱크 체력"><i class="on"></i><i class="on"></i><i class="on"></i></div>
    </div>
  </div>

  <div class="panel">
    <div class="board" id="board"></div>
    <div class="overlay" id="overlay" hidden>
      <div class="card">
        <p class="big" id="ovTitle">승리!</p>
        <p class="sub" id="ovSub"></p>
        <button class="primary" id="ovBtn" type="button">다시 하기</button>
      </div>
    </div>
  </div>

  <p class="status" id="status" data-tone="idle" aria-live="polite">적 탱크는 보이지 않아. 칸을 눌러 사격해 봐.</p>

  <div class="pad" aria-label="탱크 이동">
    <span></span><button type="button" data-move="up" aria-label="위로 한 칸">▲</button><span></span>
    <button type="button" data-move="left" aria-label="왼쪽으로 한 칸">◀</button><span class="c">이동</span><button type="button" data-move="right" aria-label="오른쪽으로 한 칸">▶</button>
    <span></span><button type="button" data-move="down" aria-label="아래로 한 칸">▼</button><span></span>
  </div>

  <p class="foot">한 턴에 한 칸 이동 + 한 번 사격 · 적은 네가 직전에 쏜 칸을 노려</p>
</div>

<script>
(function () {
  'use strict';

  var N = 7;

  var params = new URLSearchParams(location.search);
  var TEST = params.get('test') === '1';
  var seedParam = params.get('seed');
  var seed = seedParam ? (parseInt(seedParam, 10) || 1) : ((Date.now() >>> 0) % 2147483647);
  var DELAY = TEST ? 0 : 760;

  var errors = [];
  window.addEventListener('error', function (e) { errors.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function (e) { errors.push('rejection: ' + String(e && e.reason)); });

  /* 시드 고정 난수 (테스트 재현용) */
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var badgeEl = document.getElementById('badge');
  var pipsMe = document.getElementById('pipsMe');
  var pipsFoe = document.getElementById('pipsFoe');
  var overlay = document.getElementById('overlay');
  var ovTitle = document.getElementById('ovTitle');
  var ovSub = document.getElementById('ovSub');

  var TANK = '<span class="unit" aria-hidden="true"><svg viewBox="0 0 24 24">' +
    '<path d="M2.4 14.6h19.2v1.6H2.4z"/><path d="M3.6 12.4h16.8v2.2H3.6z"/>' +
    '<path d="M7.2 8.6h8.2v3.8H7.2z"/><path d="M15.4 9.8h6.2v1.6h-6.2z"/>' +
    '<path d="M2.2 16.2h1.6v2.4H2.2zM20.2 16.2h1.6v2.4h-1.6z"/></svg></span>';

  var cells = [];
  var S = null;
  var round = 0;

  /* ---------- 보드 생성 ---------- */
  function build() {
    boardEl.innerHTML = '';
    cells = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'cell';
        b.dataset.k = r + ',' + c;
        b.setAttribute('aria-label', (r + 1) + '행 ' + (c + 1) + '열 사격');
        b.innerHTML = '<span class="glyph"></span>' + TANK;
        boardEl.appendChild(b);
        cells.push(b);
      }
    }
  }

  /* ---------- 상태 ---------- */
  function startGame() {
    round += 1;
    S = {
      rng: mulberry32(seed + round * 7919),
      phase: 'player',
      hpMe: 3,
      hpFoe: 3,
      me: { r: 6, c: 3 },
      foe: { r: 0, c: 3 },
      marks: new Map(),
      moved: false,
      shots: 0,
      enemyAim: null,
      revealed: null,
      over: false,
      result: null
    };
    S.foe = randomEnemyStart();
    overlay.classList.remove('show');
    overlay.hidden = true;
    setBadge('내 차례', 'me');
    say('적 탱크는 보이지 않아. 칸을 눌러 사격해 봐.', 'idle');
    paint();
    syncHud();
  }

  function randomEnemyStart() {
    for (var i = 0; i < 300; i++) {
      var r = Math.floor(S.rng() * N), c = Math.floor(S.rng() * N);
      if (Math.max(Math.abs(r - S.me.r), Math.abs(c - S.me.c)) >= 3) return { r: r, c: c };
    }
    return { r: 0, c: 0 };
  }

  function key(r, c) { return r + ',' + c; }

  /* ---------- 그리기 ---------- */
  function paint() {
    for (var i = 0; i < cells.length; i++) {
      var r = Math.floor(i / N), c = i % N, el = cells[i];
      var m = S.marks.get(key(r, c));
      el.classList.toggle('mine', S.me.r === r && S.me.c === c);
      el.classList.toggle('hit', m === 'hit');
      el.classList.toggle('miss', m === 'miss');
      var g = el.children[0];
      g.textContent = m === 'hit' ? '✕' : (m === 'miss' ? '·' : '');
    }
  }

  function syncHud() {
    var me = pipsMe.children, foe = pipsFoe.children;
    for (var i = 0; i < 3; i++) {
      me[i].className = i < S.hpMe ? 'on' : '';
      foe[i].className = i < S.hpFoe ? 'on' : '';
    }
  }

  function setBadge(text, tone) {
    badgeEl.textContent = text;
    badgeEl.setAttribute('data-tone', tone);
  }

  function say(text, tone) {
    statusEl.textContent = text;
    statusEl.setAttribute('data-tone', tone || 'idle');
  }

  /* ---------- 플레이어 ---------- */
  function movePlayer(dir) {
    if (!S || S.over || S.phase !== 'player') return false;
    if (S.moved) { say('이번 턴엔 이미 한 칸 움직였어. 이제 사격만 남았어.', 'warn'); return false; }
    var d = { up: [-1, 0], down: [1, 0], left: [0, -1], right: [0, 1] }[dir];
    if (!d) return false;
    var r = S.me.r + d[0], c = S.me.c + d[1];
    if (r < 0 || r >= N || c < 0 || c >= N) { say('격자 밖으로는 못 나가.', 'warn'); return false; }
    S.me = { r: r, c: c };
    S.moved = true;
    paint();
    say('한 칸 옮겼어. 이제 쏠 칸을 골라.', 'ok');
    return true;
  }

  function fire(r, c) {
    if (!S || S.over || S.phase !== 'player') return false;
    if (r === S.me.r && c === S.me.c) { say('내 탱크가 있는 칸엔 쏠 수 없어.', 'warn'); return false; }
    var k = key(r, c);
    if (S.marks.has(k)) { say('이미 확인한 칸이야. 다른 칸을 골라 봐.', 'warn'); return false; }

    S.shots += 1;
    S.revealed = { r: S.me.r, c: S.me.c };

    if (r === S.foe.r && c === S.foe.c) {
      S.marks.set(k, 'hit');
      S.hpFoe -= 1;
      syncHud();
      paint();
      if (S.hpFoe <= 0) { finish('win'); return true; }
      say('명중! 적 탱크 체력 1 줄었어. 적이 자리를 옮겼어.', 'good');
      relocateFoe();
    } else {
      S.marks.set(k, 'miss');
      paint();
      say('빗나감 · 적은 ' + hint(r, c) + '.', 'bad');
    }

    syncHud();
    endPlayerTurn();
    return true;
  }

  function hint(r, c) {
    var dr = S.foe.r - r, dc = S.foe.c - c;
    var v = dr < 0 ? '북' : (dr > 0 ? '남' : '');
    var h = dc > 0 ? '동' : (dc < 0 ? '서' : '');
    var dir = (v + h) || '바로 앞';
    var md = Math.max(Math.abs(dr), Math.abs(dc));
    var near = md <= 2 ? '바로 근처' : (md <= 4 ? '가까운 편' : '먼 편');
    return dir + '쪽 ' + near;
  }

  function relocateFoe() {
    var pool = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (S.marks.has(key(r, c))) continue;
        if (r === S.foe.r && c === S.foe.c) continue;
        pool.push({ r: r, c: c });
      }
    }
    if (!pool.length) return;
    S.foe = pool[Math.floor(S.rng() * pool.length)];
  }

  /* ---------- 적 턴 ---------- */
  function endPlayerTurn() {
    S.phase = 'enemy';
    setBadge('적 차례', 'enemy');
    paint();
    if (TEST) enemyTurn();
    else setTimeout(enemyTurn, DELAY);
  }

  function enemyTurn() {
    if (!S || S.over) return;

    if (S.rng() < 0.3) enemyMove();

    var aimed = !!S.enemyAim;
    var target = S.enemyAim || randomFreeCell();
    var hit = false;

    if (target) {
      hit = (target.r === S.me.r && target.c === S.me.c);
      flash(target.r, target.c, hit);
      if (hit) {
        S.hpMe -= 1;
        syncHud();
        if (S.hpMe <= 0) { S.enemyAim = S.revealed; finish('lose'); return; }
      }
    }

    S.enemyAim = S.revealed ? { r: S.revealed.r, c: S.revealed.c } : S.enemyAim;
    S.phase = 'player';
    S.moved = false;
    setBadge('내 차례', 'me');
    paint();
    syncHud();

    if (hit) say('피격! 내 탱크 체력 1 줄었어. 쏜 자리를 벗어나야 해.', 'bad');
    else if (aimed) say('적이 지난번에 쏜 자리를 노렸지만 빗나갔어.', 'ok');
    else say('적이 아무 데나 한 발 — 빗나갔어.', 'ok');
  }

  function randomFreeCell() {
    var pool = [];
    for (var r = 0; r < N; r++) {
      for (var c = 0; c < N; c++) {
        if (r === S.foe.r && c === S.foe.c) continue;
        pool.push({ r: r, c: c });
      }
    }
    if (!pool.length) return null;
    return pool[Math.floor(S.rng() * pool.length)];
  }

  function enemyMove() {
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    var pool = [];
    for (var i = 0; i < dirs.length; i++) {
      var r = S.foe.r + dirs[i][0], c = S.foe.c + dirs[i][1];
      if (r < 0 || r >= N || c < 0 || c >= N) continue;
      if (S.marks.has(key(r, c))) continue;
      if (r === S.me.r && c === S.me.c) continue;
      pool.push({ r: r, c: c });
    }
    if (!pool.length) return;
    S.foe = pool[Math.floor(S.rng() * pool.length)];
  }

  function flash(r, c, hit) {
    var el = cells[r * N + c];
    if (!el) return;
    el.classList.add(hit ? 'foe-hit' : 'foe-shot');
    setTimeout(function () { el.classList.remove('foe-shot', 'foe-hit'); }, TEST ? 10 : 900);
  }

  function finish(result) {
    S.over = true;
    S.result = result;
    S.phase = 'over';
    setBadge('끝', 'over');
    ovTitle.textContent = result === 'win' ? '승리!' : '패배';
    ovSub.textContent = result === 'win'
      ? S.shots + '발 만에 적 탱크를 격파했어.'
      : '적 탱크한테 먼저 당했어. ' + S.shots + '발 쐈어.';
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add('show'); });
    say(result === 'win' ? '적 탱크 격파! 한 판 더 해 볼까?' : '내 탱크가 당했어. 다시 해 볼까?', result === 'win' ? 'good' : 'bad');
    paint();
    syncHud();
  }

  /* ---------- 입력 ---------- */
  boardEl.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.cell') : null;
    if (!el) return;
    var p = el.dataset.k.split(',');
    fire(parseInt(p[0], 10), parseInt(p[1], 10));
  });

  document.querySelectorAll('[data-move]').forEach(function (b) {
    b.addEventListener('click', function () { movePlayer(b.dataset.move); });
  });

  document.getElementById('restart').addEventListener('click', startGame);
  document.getElementById('ovBtn').addEventListener('click', startGame);

  /* ---------- 테스트 API ---------- */
  window.__blindTank = {
    version: 1,
    get errors() { return errors.slice(); },
    get state() {
      return {
        phase: S.phase, over: S.over, result: S.result,
        hpMe: S.hpMe, hpFoe: S.hpFoe,
        me: { r: S.me.r, c: S.me.c }, foe: { r: S.foe.r, c: S.foe.c },
        shots: S.shots, moved: S.moved, enemyAim: S.enemyAim,
        marks: Array.from(S.marks.entries())
      };
    },
    fire: fire,
    move: movePlayer,
    reset: startGame,
    hint: hint
  };

  build();
  startGame();
})();
</script>
</body>
</html>
