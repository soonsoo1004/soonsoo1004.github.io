<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>🏛️ 헛소리 박물관 — 확신에 찬 라벨 넷 중 진짜를 고르는 게임</title>
<meta name="description" content="평범한 물건에 거창한 이름이 붙은 박물관. 라벨 네 개 중 진짜 설명은 하나뿐입니다. 틀리면 그 헛소리가 내 전시관에 걸립니다. 가입·설치·광고 없는 단일 HTML 게임.">
<meta name="author" content="린다 (Linda)">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#f3ece0">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%,#fdf9f0 0%,#f3ece0 46%,#e9dfcd 100%);
    color:#241d14;
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
    letter-spacing:-.012em;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    width:100%;max-width:420px;margin:0 auto;min-height:100dvh;
    padding:calc(12px + env(safe-area-inset-top)) 15px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;
  }

  /* ---------- 상단 ---------- */
  .top{display:flex;align-items:center;gap:9px}
  .mark{font-size:17px;line-height:1}
  .top h1{margin:0;font-size:16.5px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
  .rank{
    margin-left:auto;flex:none;
    font-size:11px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;
    padding:6px 10px;border-radius:999px;
    color:#8a6614;background:#fbf1d8;border:1px solid #e8d29a;
    transition:background .2s,color .2s,border-color .2s,transform .2s;
  }
  .rank.up{animation:rankUp .5s ease}
  @keyframes rankUp{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
  .icon-btn{
    flex:none;width:31px;height:31px;border-radius:50%;cursor:pointer;
    border:1px solid #ded2ba;background:#fffdf8;color:#7a6c56;
    font-size:14px;line-height:1;display:grid;place-items:center;
    transition:transform .12s ease,background .15s ease;
  }
  .icon-btn:active{transform:scale(.92);background:#f1e8d8}

  /* ---------- 진행 ---------- */
  .prog{display:flex;align-items:center;gap:7px}
  .dots{display:flex;gap:6px;flex:1}
  .dots i{
    flex:1;height:5px;border-radius:999px;background:#e2d6c0;
    transition:background .28s ease;
  }
  .dots i.now{background:#c9a227}
  .dots i.ok{background:#2f7d5c}
  .dots i.no{background:#bd553a}
  .count{font-size:11px;font-weight:700;color:#98876c;font-variant-numeric:tabular-nums}

  /* ---------- 유물 액자 ---------- */
  .frame{
    position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0;
    border-radius:20px;padding:9px;
    background:linear-gradient(160deg,#fffdf8,#f6efe0);
    border:1px solid #e3d7c1;
    box-shadow:0 1px 0 #fff inset,0 10px 26px rgba(90,68,32,.10);
  }
  .frame::before{
    content:"";position:absolute;inset:9px;border-radius:13px;pointer-events:none;
    border:1px solid #ecdfc7;
  }
  .stage{
    position:relative;flex:1 1 auto;width:100%;min-height:clamp(144px,24vh,220px);border-radius:13px;overflow:hidden;
    background:
      radial-gradient(70% 90% at 50% 16%,#fdf7e7 0%,#f2e7cf 58%,#e8dabc 100%);
    display:grid;place-items:center;
  }
  .stage .lamp{
    position:absolute;top:-34px;left:50%;width:150px;height:150px;transform:translateX(-50%);
    background:radial-gradient(50% 50% at 50% 50%,rgba(255,241,196,.95) 0%,rgba(255,241,196,0) 72%);
    pointer-events:none;
  }
  #art{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    height:84%;aspect-ratio:1/1;max-width:78%;display:grid;place-items:center;
  }
  .stage svg{position:relative;width:100%;height:100%;display:block;
    animation:artIn .42s cubic-bezier(.2,.85,.3,1) both;
    filter:drop-shadow(0 9px 16px rgba(120,92,40,.22));}
  @keyframes artIn{from{opacity:0;transform:translateY(9px) scale(.94)}to{opacity:1;transform:none}}
  .stage .pedestal{
    position:absolute;left:50%;bottom:12%;transform:translateX(-50%);
    width:56%;height:10px;border-radius:50%;
    background:radial-gradient(50% 50% at 50% 50%,rgba(120,92,40,.20),rgba(120,92,40,0) 72%);
    pointer-events:none;
  }
  .art{display:contents}
  .tag{
    position:absolute;bottom:7px;right:9px;font-size:9.5px;font-weight:800;letter-spacing:.06em;
    color:#a8926a;
  }

  /* ---------- 명패 ---------- */
  .plaque{display:flex;flex-direction:column;gap:2px;padding:0 3px}
  .plaque h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
  .plaque p{margin:0;font-size:11px;color:#9c8a6c;letter-spacing:.01em}
  .ask{margin:0;padding:0 3px;font-size:13px;font-weight:700;color:#6f6047}

  /* ---------- 선택지 ---------- */
  .choices{display:flex;flex-direction:column;gap:9px}
  .choice{
    position:relative;width:100%;text-align:left;font:inherit;cursor:pointer;
    padding:12px 14px 12px 36px;border-radius:14px;
    border:1px solid #e2d6c0;background:#fffdf9;color:#2c2419;
    font-size:13.5px;line-height:1.45;letter-spacing:-.018em;
    transition:transform .1s ease,background .16s ease,border-color .16s ease,box-shadow .16s ease;
  }
  .choice .n{
    position:absolute;left:12px;top:13px;width:16px;height:16px;border-radius:50%;
    display:grid;place-items:center;font-size:10px;font-weight:800;
    color:#a1906f;background:#f3ebdb;border:1px solid #e6d9c1;
  }
  .choice:active{transform:scale(.985);background:#faf3e5}
  .choice[disabled]{cursor:default}
  .choice.right{
    background:#eaf6ef;border-color:#8fc4a8;color:#1d5a41;
    box-shadow:0 0 0 2px rgba(47,125,92,.10);
  }
  .choice.right .n{background:#2f7d5c;border-color:#2f7d5c;color:#fff}
  .choice.wrong{
    background:#fdeee9;border-color:#e6ae9a;color:#8f3a22;
    animation:shake .34s ease;
  }
  .choice.wrong .n{background:#bd553a;border-color:#bd553a;color:#fff}
  .choice.dim{opacity:.46}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-4px)}48%{transform:translateX(4px)}72%{transform:translateX(-2px)}}

  /* ---------- 하단 ---------- */
  .note{
    margin:0;min-height:35px;padding:0 3px;font-size:12.5px;line-height:1.42;
    color:#8a7a5f;
  }
  .foot{
    margin:0;padding:0 4px 2px;text-align:center;
    font-size:10.5px;line-height:1.5;color:#a29174;letter-spacing:-.005em;
  }
  .note b{font-weight:800}
  .note.ok{color:#23704f}
  .note.no{color:#a0442a}
  .cta{
    width:100%;height:50px;font:inherit;font-size:14.5px;font-weight:800;cursor:pointer;
    border:0;border-radius:15px;color:#fff;letter-spacing:-.02em;
    background:linear-gradient(180deg,#3a3226,#241d14);
    box-shadow:0 8px 20px rgba(50,38,18,.20);
    transition:transform .1s ease,opacity .2s ease,box-shadow .15s ease;
  }
  .cta:active{transform:scale(.985)}
  .cta[hidden]{display:none}
  .cta[disabled]{
    background:#f7f0e3;color:#a89a80;border:1px dashed #dccdb2;box-shadow:none;cursor:default;
  }
  .cta.ghost{background:#fffdf9;color:#4a3f2f;border:1px solid #e2d6c0;box-shadow:none}

  /* ---------- 결과 ---------- */
  .result{
    position:fixed;inset:0;z-index:20;overflow-y:auto;
    background:linear-gradient(180deg,#fdf8ee 0%,#f0e6d4 100%);
    padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));
    opacity:0;transition:opacity .26s ease;
    display:flex;align-items:center;justify-content:center;
  }
  .result[hidden]{display:none}
  .result.show{opacity:1}
  .result .inner{width:100%;max-width:390px;margin:auto;display:flex;flex-direction:column;gap:12px;text-align:center}
  .result .crest{
    width:74px;height:74px;margin:4px auto 0;border-radius:22px;display:grid;place-items:center;
    font-size:34px;background:#fffdf8;border:1px solid #e6d8bd;
    box-shadow:0 10px 26px rgba(120,92,40,.14);
  }
  .result .kicker{margin:0;font-size:11px;font-weight:800;letter-spacing:.12em;color:#b09768}
  .result .grade{margin:0;font-size:27px;font-weight:900;letter-spacing:-.04em;line-height:1.15}
  .result .score{margin:0;font-size:13px;color:#7c6d53}
  .result .score b{font-size:16px;color:#241d14;font-variant-numeric:tabular-nums}
  .shelf{
    display:flex;flex-direction:column;gap:7px;text-align:left;
    padding:12px;border-radius:16px;background:#fffdf8;border:1px solid #e7dac1;
  }
  .shelf .h{
    display:flex;align-items:center;gap:6px;
    font-size:11px;font-weight:800;letter-spacing:.02em;color:#a48d63;
  }
  .shelf .h span{margin-left:auto;font-variant-numeric:tabular-nums}
  .shelf ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .shelf li{
    font-size:11.5px;line-height:1.42;color:#4e422f;
    padding-left:17px;position:relative;
  }
  .shelf li::before{
    content:"";position:absolute;left:0;top:4px;width:9px;height:9px;
    border:1.5px solid #b8a079;border-radius:2px;box-sizing:border-box;
  }
  .shelf .empty{font-size:11.5px;color:#8d7d62;line-height:1.5;padding-left:0!important}
  .shelf li.empty::before{display:none}
  .hint{margin:0;font-size:11.5px;line-height:1.5;color:#9c8a6c}
  .result .cta{margin-top:2px}

  @media (max-height:760px){
    .wrap{gap:6px}
    .stage{min-height:clamp(84px,14vh,118px)}
    #art{max-width:56%}
    .plaque h2{font-size:15px}
    .plaque p{font-size:10px}
    .choice{padding:7px 12px 7px 30px;font-size:12.5px;line-height:1.38}
    .choice .n{top:8px;left:9px}
    .note{min-height:27px;font-size:11.5px}
    .cta{height:43px;font-size:14px}
    .foot{display:none}
    .result .crest{width:60px;height:60px;font-size:28px}
    .result .grade{font-size:23px}
    .result .inner{gap:9px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="mark" aria-hidden="true">🏛️</span>
    <h1>헛소리 박물관</h1>
    <span class="rank" id="rank">관람객</span>
    <button class="icon-btn" id="restart" type="button" aria-label="처음부터" title="처음부터">↻</button>
  </header>

  <div class="prog">
    <div class="dots" id="dots" aria-hidden="true"></div>
    <span class="count" id="count">1 / 5</span>
  </div>

  <div class="frame">
    <div class="stage">
      <div class="lamp" aria-hidden="true"></div>
      <div class="pedestal" aria-hidden="true"></div>
      <div id="art"></div>
      <span class="tag" aria-hidden="true">유물</span>
    </div>
  </div>

  <div class="plaque">
    <h2 id="title">—</h2>
    <p id="meta">—</p>
  </div>

  <p class="ask" id="ask">이 유물의 진짜 정체는?</p>

  <div class="choices" id="choices" role="group" aria-label="라벨 네 개"></div>

  <p class="note" id="note" aria-live="polite"></p>
  <button class="cta" id="next" type="button" hidden>다음 유물 →</button>
  <p class="foot">라벨 넷 중 진짜는 하나 · 틀리면 그 헛소리가 내 전시관에 걸린다</p>
</div>

<div class="result" id="result" hidden aria-live="polite">
  <div class="inner">
    <div class="crest" id="crest">🏛️</div>
    <p class="kicker">오늘의 관장 등급</p>
    <p class="grade" id="rGrade">관람객</p>
    <p class="score" id="rScore"><b>0</b> / 5점</p>
    <div class="shelf">
      <div class="h">내 전시관에 걸린 헛소리 <span id="rCount">0점</span></div>
      <ul id="rList"></ul>
    </div>
    <p class="hint" id="rHint"></p>
    <button class="cta" id="again" type="button">한 세트 더</button>
    <button class="cta ghost" id="home" type="button">처음 화면으로</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var SIZE = 5;            // 한 세트 유물 수
  var params = new URLSearchParams(location.search);
  var TEST = params.get('test') === '1';
  var seedParam = params.get('seed');
  var seed = seedParam ? (parseInt(seedParam, 10) || 1) : ((Date.now() >>> 0) % 2147483647);
  var DELAY = TEST ? 0 : 340;

  var errors = [];
  window.addEventListener('error', function (e) { errors.push(String((e && e.message) || e)); });
  window.addEventListener('unhandledrejection', function (e) { errors.push('rejection: ' + String(e && e.reason)); });

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(arr, rng) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* =========================================================
     유물 SVG (전부 자체 제작 · 외부 이미지 0)
     ========================================================= */
  function cog(cx, cy, r1, r2, teeth) {
    var pts = [], n = teeth * 2;
    for (var i = 0; i < n; i++) {
      var ang = (Math.PI * 2 * i) / n - Math.PI / 2;
      var r = (i % 2 === 0) ? r1 : r2;
      pts.push((cx + Math.cos(ang) * r).toFixed(2) + ',' + (cy + Math.sin(ang) * r).toFixed(2));
    }
    return 'M' + pts.join('L') + 'Z';
  }

  var ICON = {
    cap: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="' + cog(60, 60, 46, 39, 21) + '" fill="#c9a227"/>' +
      '<path d="' + cog(60, 60, 45, 38, 21) + '" fill="none" stroke="#8f6a20" stroke-width="1.4" opacity=".55"/>' +
      '<circle cx="60" cy="60" r="33" fill="#f7f0dd"/>' +
      '<circle cx="60" cy="60" r="33" fill="none" stroke="#b3862f" stroke-width="2.4"/>' +
      '<circle cx="60" cy="60" r="22" fill="none" stroke="#c9b489" stroke-width="1.6" stroke-dasharray="3 4"/>' +
      '<circle cx="60" cy="60" r="5" fill="#b3862f" opacity=".7"/></svg>',

    bulb: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<circle cx="60" cy="50" r="30" fill="#fdf3cd"/>' +
      '<circle cx="60" cy="50" r="30" fill="none" stroke="#c9a227" stroke-width="2.6"/>' +
      '<path d="M48 72h24l-2 7H50z" fill="#b3862f"/>' +
      '<rect x="50" y="79" width="20" height="13" rx="3" fill="#9a7a33"/>' +
      '<path d="M50 84h20M50 88h20" stroke="#6f5622" stroke-width="1.5" opacity=".6"/>' +
      '<path d="M54 44l6 8 6-8" fill="none" stroke="#c08a1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M60 52v16" stroke="#c08a1c" stroke-width="2.4" stroke-linecap="round"/>' +
      '<circle cx="60" cy="46" r="26" fill="none" stroke="#fff" stroke-width="3" opacity=".5" stroke-dasharray="30 200"/></svg>',

    pin: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<g transform="rotate(-10 60 60)"><rect x="40" y="18" width="17" height="66" rx="8" fill="#e0c48c"/></g>' +
      '<g transform="rotate(10 60 60)"><rect x="63" y="18" width="17" height="66" rx="8" fill="#d3b475"/></g>' +
      '<circle cx="60" cy="62" r="11" fill="#f7f0dd" stroke="#8f6a20" stroke-width="3"/>' +
      '<circle cx="60" cy="62" r="4.5" fill="#8f6a20"/>' +
      '<path d="M46 26h5M69 26h5" stroke="#a8843c" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></svg>',

    cup: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="M38 34h44l-6 58a6 6 0 0 1-6 5H50a6 6 0 0 1-6-5z" fill="#f2e7cf"/>' +
      '<path d="M38 34h44l-6 58a6 6 0 0 1-6 5H50a6 6 0 0 1-6-5z" fill="none" stroke="#c9b489" stroke-width="2.2"/>' +
      '<ellipse cx="60" cy="34" rx="22" ry="7" fill="#fbf6e8" stroke="#b3862f" stroke-width="2.2"/>' +
      '<path d="M43 54h34M45 70h30" stroke="#d8c8a6" stroke-width="2" stroke-linecap="round"/>' +
      '<circle cx="60" cy="34" r="9" fill="#c9a227" opacity=".35"/></svg>',

    band: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<ellipse cx="60" cy="60" rx="44" ry="26" fill="none" stroke="#c98a8a" stroke-width="7" transform="rotate(-18 60 60)"/>' +
      '<ellipse cx="60" cy="60" rx="44" ry="26" fill="none" stroke="#e0a8a8" stroke-width="2.4" transform="rotate(-18 60 60)" opacity=".8"/>' +
      '<ellipse cx="60" cy="60" rx="38" ry="21" fill="none" stroke="#c98a8a" stroke-width="6" transform="rotate(14 60 60)"/>' +
      '<ellipse cx="60" cy="60" rx="38" ry="21" fill="none" stroke="#e8bcbc" stroke-width="2" transform="rotate(14 60 60)" opacity=".7"/></svg>',

    pad: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="M18 58l30-20h44l10 16-4 34a5 5 0 0 1-5 4H28a5 5 0 0 1-5-4z" fill="#8b9a8b"/>' +
      '<path d="M18 58l30-20h44l10 16z" fill="#a3b2a2"/>' +
      '<path d="M26 62h68M27 72h66M29 82h62" stroke="#6f7d6f" stroke-width="1.6" opacity=".55"/>' +
      '<rect x="50" y="40" width="22" height="30" rx="11" fill="#f4efe3" stroke="#6f7d6f" stroke-width="2"/>' +
      '<path d="M60 44v10" stroke="#6f7d6f" stroke-width="2" stroke-linecap="round"/></svg>',

    straw: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="M40 104V54a20 20 0 0 1 20-20h18" fill="none" stroke="#d8b6d8" stroke-width="13" stroke-linecap="round"/>' +
      '<path d="M40 104V54a20 20 0 0 1 20-20h18" fill="none" stroke="#e8cfe8" stroke-width="5" stroke-linecap="round"/>' +
      '<path d="M78 34h14" stroke="#b98cb9" stroke-width="13" stroke-linecap="round"/>' +
      '<path d="M40 76h-2M40 88h-2M40 62h-2" stroke="#fff" stroke-width="2" opacity=".7"/></svg>',

    slipper: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="M26 74c0-16 12-28 30-28s30 10 30 26c0 12-9 20-24 20H40c-9 0-14-7-14-18z" fill="#c98f7a"/>' +
      '<path d="M26 74c0-16 12-28 30-28s30 10 30 26c0 12-9 20-24 20H40c-9 0-14-7-14-18z" fill="none" stroke="#a9715d" stroke-width="2.2"/>' +
      '<path d="M38 58c8 12 34 12 40 0" fill="none" stroke="#f0d6c6" stroke-width="8" stroke-linecap="round"/>' +
      '<path d="M22 84h3M30 92h3" stroke="#a9715d" stroke-width="2.4" stroke-linecap="round" opacity=".7"/></svg>',

    receipt: '<svg viewBox="0 0 120 120" aria-hidden="true">' +
      '<path d="M36 16h48v82l-6-5-6 5-6-5-6 5-6-5-6 5-6-5-6 5z" fill="#fdfaf1" stroke="#c9b489" stroke-width="2"/>' +
      '<path d="M44 30h32M44 40h32M44 50h20" stroke="#a8977a" stroke-width="2.4" stroke-linecap="round"/>' +
      '<path d="M44 64h9M58 64h9M72 64h8M44 74h9M58 74h9" stroke="#d5c7ab" stroke-width="2.2" stroke-linecap="round"/>' +

  var RANKS = [

    { min: 1, name: '안내데스크', crest: '🪧' },
    { min: 0, name: '관람객',  crest: '🎫' }
  ];
  function rankOf(score) {
    for (var i = 0; i < RANKS.length; i++) if (score >= RANKS[i].min) return RANKS[i];
    return RANKS[RANKS.length - 1];
  }

  /* =========================================================
     요소
     ========================================================= */
  var elArt = document.getElementById('art');
  var elTitle = document.getElementById('title');
  var elMeta = document.getElementById('meta');
  var elAsk = document.getElementById('ask');
  var elChoices = document.getElementById('choices');
  var elNote = document.getElementById('note');
  var elNext = document.getElementById('next');
  var elDots = document.getElementById('dots');
  var elCount = document.getElementById('count');
  var elRank = document.getElementById('rank');
  var elResult = document.getElementById('result');
  var elGrade = document.getElementById('rGrade');
  var elScore = document.getElementById('rScore');
  var elCrest = document.getElementById('crest');
  var elList = document.getElementById('rList');
  var elRCount = document.getElementById('rCount');
  var elHint = document.getElementById('rHint');

  var S = null;

  function buildDots() {
    var h = '';
    for (var i = 0; i < SIZE; i++) h += '<i></i>';
    elDots.innerHTML = h;
  }

  function newSet() {
    var rng = mulberry32(seed + Math.floor(Math.random() * 100000));
    var picked = shuffle(RELICS, rng).slice(0, SIZE);
    var rounds = picked.map(function (r) {
      var opts = shuffle([{ text: r.truth, ok: true }].concat(
        r.lies.map(function (t) { return { text: t, ok: false }; })
      ), rng);
      return { relic: r, opts: opts, truthIdx: opts.findIndex(function (o) { return o.ok; }) };
    });
    S = {
      step: 0, score: 0, answered: false, over: false,
      rounds: rounds, marks: [], picked: [], collection: []
    };
  }

  function render() {
    var r = S.rounds[S.step].relic;
    elArt.innerHTML = ICON[r.icon] || '';
    elArt.className = 'art';
    elTitle.textContent = r.title;
    elMeta.textContent = r.meta;
    elAsk.textContent = '이 유물의 진짜 정체는?';

    var idx = 0;
    elChoices.innerHTML = S.rounds[S.step].opts.map(function (o) {
      idx += 1;
      return '<button class="choice" type="button" data-i="' + (idx - 1) + '">' +
        '<span class="n" aria-hidden="true">' + idx + '</span>' + escapeHtml(o.text) + '</button>';
    }).join('');

    S.answered = false;
    elNote.textContent = '';
    elNote.className = 'note';
    elNext.hidden = false;
    elNext.disabled = true;
    elNext.textContent = '라벨 하나를 골라 봐';
    elCount.textContent = (S.step + 1) + ' / ' + SIZE;
    syncDots();
    syncRank();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function syncDots() {
    var kids = elDots.children;
    for (var i = 0; i < kids.length; i++) {
      var m = S.marks[i];
      kids[i].className = m === 'ok' ? 'ok' : (m === 'no' ? 'no' : (i === S.step ? 'now' : ''));
    }
  }

  function syncRank() {
    var rk = rankOf(S.score);
    if (elRank.textContent !== rk.name) {
      elRank.textContent = rk.name;
      elRank.classList.remove('up');
      void elRank.offsetWidth;
      elRank.classList.add('up');
    }
  }

  function answer(i) {
    if (!S || S.over || S.answered) return false;
    var round = S.rounds[S.step];
    var btn = elChoices.querySelector('[data-i="' + i + '"]');
    if (!btn) return false;

    S.answered = true;
    var correct = (i === round.truthIdx);
    var all = elChoices.querySelectorAll('.choice');
    for (var k = 0; k < all.length; k++) {
      all[k].disabled = true;
      var ki = parseInt(all[k].getAttribute('data-i'), 10);
      if (ki === round.truthIdx) all[k].classList.add('right');
      else if (ki === i) all[k].classList.add('wrong');
      else all[k].classList.add('dim');
    }

    if (correct) {
      S.score += 1;
      S.marks[S.step] = 'ok';
      elNote.className = 'note ok';
      elNote.innerHTML = '<b>정답.</b> 이건 그냥 ' + shortTruth(round) + '. 관장 등급이 올라간다.';
      syncRank();
    } else {
      S.marks[S.step] = 'no';
      S.picked[S.step] = i;
      S.collection.push(round.opts[i].text);
      elNote.className = 'note no';
      elNote.innerHTML = '<b>틀렸어.</b> 고른 라벨이 내 전시관에 걸렸다. 초록색이 진짜야.';
    }

    syncDots();
    elNext.hidden = false;
    elNext.disabled = false;
    elNext.textContent = (S.step + 1 >= SIZE) ? '전시 결과 보기 →' : '다음 유물 →';
    elNext.focus({ preventScroll: true });
    return true;
  }

  function shortTruth(round) {
    var t = round.relic.truth;
    var cut = t.indexOf('.');
    return cut > 0 ? t.slice(0, cut) : t;
  }

  function next() {
    if (!S || !S.answered) return false;
    if (S.step + 1 >= SIZE) { finish(); return true; }
    S.step += 1;
    render();
    return true;
  }

  function finish() {
    S.over = true;
    var rk = rankOf(S.score);
    elCrest.textContent = rk.crest;
    elGrade.textContent = rk.name;
    elScore.innerHTML = '<b>' + S.score + '</b> / ' + SIZE + '점';
    elRCount.textContent = S.collection.length + '점';

    if (S.collection.length) {
      elList.innerHTML = S.collection.map(function (t) {
        return '<li>' + escapeHtml(t) + '</li>';
      }).join('');
    } else {
      elList.innerHTML = '<li class="empty" style="padding-left:0">걸린 헛소리가 없다. 오늘 이 박물관에 진실만 남았다.</li>';
    }
    elHint.textContent = S.score >= SIZE
      ? '헛소리 없이 통과. 이 박물관에서 제일 무서운 관람객이다.'
      : (SIZE - S.score) + '점 모자란다. 다 맞히면 관장이 된다.';

    elResult.hidden = false;
    requestAnimationFrame(function () { elResult.classList.add('show'); });
  }

  function restart() {
    elResult.classList.remove('show');
    elResult.hidden = true;
    newSet();
    render();
  }

  /* ---------- 입력 ---------- */
  elChoices.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('.choice') : null;
    if (!b || b.disabled) return;
    answer(parseInt(b.getAttribute('data-i'), 10));
  });

  elNext.addEventListener('click', function () { if (!elNext.disabled) next(); });
  document.getElementById('restart').addEventListener('click', restart);
  document.getElementById('again').addEventListener('click', restart);
  document.getElementById('home').addEventListener('click', restart);

  /* ---------- 테스트 API ---------- */
  window.__wrongMuseum = {
    version: 1,
    get errors() { return errors.slice(); },
    get state() {
      return {
        step: S.step, score: S.score, answered: S.answered, over: S.over,
        total: SIZE, marks: S.marks.slice(),
        title: S.rounds[S.step].relic.title,
        truthIdx: S.rounds[S.step].truthIdx,
        options: S.rounds[S.step].opts.map(function (o) { return o.text; }),
        collection: S.collection.slice(),
        rank: rankOf(S.score).name,
        resultVisible: !elResult.hidden
      };
    },
    answer: answer,
    next: next,
    reset: restart,
    rankOf: rankOf
  };

  buildDots();
  newSet();
  render();
})();
</script>
