<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>NEON RUSH</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#040613;color:white;
font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:22px 22px auto;display:flex;
justify-content:space-between;pointer-events:none;gap:20px}
.label{font-size:11px;letter-spacing:3px;color:#8aabc8}
#score{font-size:38px;font-weight:900}
#combo{color:#ffe785;font-weight:800;min-height:24px}
.right{text-align:right}
#best{font-size:20px;font-weight:800}
.bar{width:140px;height:7px;background:#ffffff18;
border-radius:10px;overflow:hidden;margin-top:12px}
#energy{height:100%;background:#4affee;box-shadow:0 0 15px #4affee}
#overlay{position:fixed;inset:0;display:grid;place-items:center;
background:linear-gradient(transparent,#030512dd)}
.panel{text-align:center;padding:32px 24px;max-width:520px}
h1{font-size:clamp(42px,10vw,76px);line-height:.95;margin:0 0 20px;
letter-spacing:-3px;text-shadow:0 0 35px #00d9ff80}
h1 span{color:#4affee}
p{color:#a4bad0;line-height:1.8}
button{border:1px solid #6affea80;border-radius:16px;
background:#103c48;color:#dffffa;padding:16px 30px;
font-size:17px;font-weight:900;cursor:pointer;
box-shadow:0 0 35px #21ffe51a}
button:active{transform:scale(.96)}
#dash{position:fixed;bottom:28px;right:24px;
background:#123341bb;user-select:none}
#hint{position:fixed;bottom:34px;left:24px;font-size:12px;
color:#8298b3;pointer-events:none}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div><div class="label">SCORE</div><div id="score">0</div>
  <div id="combo"></div></div>
  <div class="right"><div class="label">BEST</div><div id="best">0</div>
  <div class="bar"><div id="energy"></div></div>
  <div class="label" style="margin-top:8px">DASH ENERGY</div></div>
</div>
<div id="hint">← → 이동 · SPACE 대시</div>
<button id="dash">⚡ DASH</button>
<div id="overlay"><div class="panel">
  <h1>NEON<br><span>RUSH</span></h1>
  <p id="message">속도를 지배하세요.<br>코인을 연결하고, 대시로 장애물을 부수세요.</p>
  <button id="start">질주 시작 →</button>
  <p style="font-size:12px">방향키 / A · D / 좌우 스와이프</p>
</div></div>
<script>
"use strict";
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W,H,DPR;
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

let best=0;
try{best=Number(localStorage.getItem("neon-rush-best"))||0}catch{}
$("best").textContent=best;
let playing=false,lane=0,playerX=0,score=0,combo=0,energy=100;
let dashTime=0,speed=24,elapsed=0,travel=0,spawn=0,shake=0;
let objects=[],particles=[],last=performance.now(),audio;
const stars=Array.from({length:75},()=>({
  x:Math.random(),y:Math.random()*.5,r:Math.random()*1.5+.3
}));

function beep(freq,duration=.09,type="sine",volume=.035){
  if(!audio)return;
  const o=audio.createOscillator(),g=audio.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);
  g.gain.setValueAtTime(volume,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
  o.connect(g);g.connect(audio.destination);o.start();
  o.stop(audio.currentTime+duration);
}
function start(){
  try{
    audio ||= new(window.AudioContext||window.webkitAudioContext)();
    audio.resume();
  }catch{}
  playing=true;lane=0;playerX=0;score=0;combo=0;energy=100;
  dashTime=0;speed=24;elapsed=0;travel=0;spawn=.25;shake=0;
  objects=[];particles=[];
  $("overlay").classList.add("hidden");
}
function move(dir){if(playing)lane=Math.max(-1,Math.min(1,lane+dir))}
function dash(){
  if(!playing||energy<38||dashTime>0)return;
  energy-=38;dashTime=.75;shake=5;beep(150,.2,"sawtooth",.025);
}
$("start").onclick=start;
$("dash").onpointerdown=e=>{e.preventDefault();dash()};
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","Space","Enter"].includes(e.code))
    e.preventDefault();
  if(e.repeat)return;
  if(e.code==="ArrowLeft"||e.code==="KeyA")move(-1);
  if(e.code==="ArrowRight"||e.code==="KeyD")move(1);
  if(e.code==="Space")dash();
  if(e.code==="Enter"&&!playing)start();
});
let touchX=null;
canvas.addEventListener("pointerdown",e=>{touchX=e.clientX});
canvas.addEventListener("pointerup",e=>{
  if(touchX===null)return;
  const dx=e.clientX-touchX;
  if(Math.abs(dx)>20)move(Math.sign(dx));
  touchX=null;
});
canvas.addEventListener("pointercancel",()=>touchX=null);

function project(x,y,z){
  const f=Math.min(W*.86,H*.9),s=f/Math.max(.5,z+5);
  return{x:W/2+x*s,y:H*.34+(2.9-y)*s,s};
}
function polygon(points,fill,stroke){
  ctx.beginPath();
  points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
  ctx.closePath();ctx.fillStyle=fill;ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function quad(points,fill,stroke){
  polygon(points.map(p=>project(...p)),fill,stroke);
}
function box(x,y,z,w,h,d,colors){
  const a=x-w/2,b=x+w/2,n=z-d/2,f=z+d/2,t=y+h;
  const edge=colors[3];
  quad([[a,y,f],[b,y,f],[b,t,f],[a,t,f]],colors[2],edge);
  if(x>=0)
    quad([[a,y,n],[a,y,f],[a,t,f],[a,t,n]],colors[1],edge);
  else
    quad([[b,y,f],[b,y,n],[b,t,n],[b,t,f]],colors[1],edge);
  quad([[a,t,n],[a,t,f],[b,t,f],[b,t,n]],colors[0],edge);
  quad([[a,y,n],[b,y,n],[b,t,n],[a,t,n]],colors[2],edge);
}
function burst(x,z,color,count=24){
  const p=project(x,.55,z);
  for(let i=0;i<count;i++){
    const angle=Math.random()*Math.PI*2,v=50+Math.random()*260;
    particles.push({x:p.x,y:p.y,vx:Math.cos(angle)*v,
      vy:Math.sin(angle)*v,life:.5+Math.random()*.35,color});
  }
}
function wave(){
  const safe=Math.floor(Math.random()*3)-1;
  for(let l=-1;l<=1;l++){
    if(l!==safe&&Math.random()<.78)
      objects.push({type:"wall",x:l*2,z:100,done:false});
  }
  for(let i=0;i<4;i++)
    objects.push({type:"coin",x:safe*2,z:100+i*2.6,done:false});
}
function end(){
  playing=false;shake=15;beep(65,.4,"sawtooth",.05);
  const final=Math.floor(score),record=final>best;
  best=Math.max(best,final);
  try{localStorage.setItem("neon-rush-best",best)}catch{}
  $("best").textContent=best;
  $("message").innerHTML=(record?"🏆 새로운 최고 기록!":"다시 한 번, 더 멀리.")+
    "<br>점수 <strong style='color:#fff'>"+final.toLocaleString()+
    "</strong> · 생존 "+elapsed.toFixed(1)+"초";
  $("start").textContent="다시 질주 →";
  $("overlay").classList.remove("hidden");
}
function update(dt){
  shake=Math.max(0,shake-dt*25);
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);
  if(!playing)return;
  elapsed+=dt;speed=Math.min(58,24+elapsed*.48);
  dashTime=Math.max(0,dashTime-dt);
  energy=Math.min(100,energy+dt*9);
  const velocity=speed*(dashTime>0?1.35:1);
  travel+=velocity*dt;score+=velocity*dt*2;
  playerX+=(lane*2-playerX)*(1-Math.exp(-dt*19));
  spawn-=dt;
  if(spawn<=0){wave();spawn=35/speed}
  for(const o of objects){
    const previous=o.z;o.z-=velocity*dt;
    if(!o.done&&previous>3&&o.z<=3){
      o.done=true;
      if(Math.abs(o.x-playerX)<.83){
        if(o.type==="coin"){
          combo++;score+=30+Math.min(combo,30)*3;
          energy=Math.min(100,energy+1.7);
          burst(o.x,3,"#ffdc6e",12);
          beep(520+Math.min(combo,20)*35,.06);
        }else if(dashTime>0){
          score+=100;shake=8;burst(o.x,3,"#ff488e",35);
          beep(95,.13,"triangle",.07);
        }else{
          burst(playerX,3,"#4affee",45);end();break;
        }
      }else if(o.type==="coin"){combo=0}
    }
  }
  objects=objects.filter(o=>o.z>-3&&!(o.done&&o.type==="coin"));
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#030511");bg.addColorStop(.5,"#141030");
  bg.addColorStop(1,"#030712");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  for(const s of stars){
    ctx.fillStyle="#a5c8ff";ctx.globalAlpha=.3+s.r*.25;
    ctx.fillRect(s.x*W,s.y*H,s.r,s.r);
  }
  ctx.globalAlpha=1;
  const glow=ctx.createRadialGradient(W/2,H*.32,0,W/2,H*.32,W*.5);
  glow.addColorStop(0,"#923aff30");glow.addColorStop(1,"#923aff00");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

  for(let i=24;i>=0;i--){
    const z=i*7-(travel*.45%7);
    for(const side of [-1,1]){
      const height=3+(Math.sin(i*13.7)*.5+.5)*10;
      box(side*(6+(i%3)*1.8),0,z,1.8,height,2.6,
        ["#171d3d","#0b1029","#0b1129","#263258"]);
    }
  }
  quad([[-3.3,0,-1],[3.3,0,-1],[3.3,0,190],[-3.3,0,190]],"#080f24");
  for(let i=45;i>=0;i--){
    const z=i*4-travel%4;
    quad([[-3.2,.01,z],[3.2,.01,z],[3.2,.01,z+.035],[-3.2,.01,z+.035]],
      "#23536b");
  }
  for(const x of [-3.2,-1,1,3.2]){
    const edge=Math.abs(x)>3;
    quad([[x-.025,.015,-1],[x+.025,.015,-1],
      [x+.025,.015,180],[x-.025,.015,180]],edge?"#39eddf":"#345478");
  }
  const drawables=objects.filter(o=>!o.done||o.type!=="wall");
  drawables.push({type:"player",x:playerX,z:3});
  drawables.sort((a,b)=>b.z-a.z);
  for(const o of drawables){
    if(o.type==="wall"){
      box(o.x,0,o.z,1.45,1.5,1.2,
        ["#fc639f","#76234e","#b62964","#ff8cba"]);
      const p=project(o.x,.8,o.z-.62);
      ctx.fillStyle="#ffd2e6";ctx.font=`bold ${Math.max(5,p.s*.6)}px sans-serif`;
      ctx.textAlign="center";ctx.fillText("×",p.x,p.y);
    }else if(o.type==="coin"){
      const y=.8+Math.sin(elapsed*5+o.z)*.12,p=project(o.x,y,o.z);
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(elapsed*2+o.z*.1);
      ctx.shadowBlur=15;ctx.shadowColor="#ffc94f";
      polygon([{x:0,y:-p.s*.3},{x:p.s*.21,y:0},
        {x:0,y:p.s*.3},{x:-p.s*.21,y:0}],"#ffe595","#fff7c4");
      ctx.restore();
    }else{
      const active=dashTime>0;
      quad([[o.x-.34,.04,3.7],[o.x+.34,.04,3.7],
        [o.x+.18,.04,active?9:5.8],[o.x-.18,.04,active?9:5.8]],
        active?"#c2fffaaa":"#28e8ef77");
      box(o.x,.12,3,.85,.36,1.4,
        active?["#ffffff","#3de6d6","#b3fff5","#fff"]:
        ["#65fff0","#117a96","#20bfd0","#aefff6"]);
      box(o.x,.48,3.15,.48,.24,.6,
        ["#d2fcff","#13526f","#287f9c","#8defff"]);
    }
  }
  for(const p of particles){
    ctx.globalAlpha=Math.min(1,p.life*2);
    ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4);
  }
  ctx.globalAlpha=1;
  if(dashTime>0){
    ctx.strokeStyle="#86fff860";ctx.lineWidth=2;
    for(let i=0;i<16;i++){
      const a=i*Math.PI/8,r=Math.min(W,H)*.35;
      ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r,H*.5+Math.sin(a)*r);
      ctx.lineTo(W/2+Math.cos(a)*r*1.8,H*.5+Math.sin(a)*r*1.8);ctx.stroke();
    }
  }
  ctx.restore();
  $("score").textContent=Math.floor(score).toLocaleString();
  $("combo").textContent=combo>1?combo+" COMBO · +"+(30+Math.min(combo,30)*3):"";
  $("energy").style.width=energy+"%";
  $("dash").style.opacity=energy>=38?"1":".4";
}
function frame(now){
  const dt=Math.min((now-last)/1000,.035);last=now;
  update(dt);draw();requestAnimationFrame(frame);
}
document.addEventListener("visibilitychange",()=>{last=performance.now()});
requestAnimationFrame(frame);
</script>
</body>
</html>
