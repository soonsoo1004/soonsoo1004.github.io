<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>스카이 코인 러너 3D</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;overflow:hidden;background:#101b36;
  font-family:system-ui,sans-serif;color:white;
  touch-action:none;
}
canvas{display:block;width:100vw;height:100dvh}
#hud{
  position:fixed;top:20px;left:20px;right:20px;
  display:flex;justify-content:space-between;
  gap:12px;pointer-events:none;flex-wrap:wrap;
}
.card{
  background:#101b36cc;border:1px solid #ffffff25;
  border-radius:16px;padding:12px 18px;
  backdrop-filter:blur(10px);
}
#progress{
  position:fixed;top:83px;left:22px;right:22px;
  height:6px;background:#ffffff25;border-radius:8px;
}
#bar{
  width:0;height:100%;border-radius:8px;
  background:linear-gradient(90deg,#42e8cf,#ffdf71);
}
#panel{
  position:fixed;inset:0;display:flex;
  align-items:center;justify-content:center;
  background:#08132788;padding:24px;
}
.dialog{
  width:min(440px,100%);padding:32px;
  text-align:center;background:#122443ef;
  border:1px solid #ffffff30;border-radius:28px;
  box-shadow:0 24px 80px #0006;
}
h1{font-size:30px;margin:0 0 16px}
p{line-height:1.8;color:#c5d9ee}
button{
  border:0;border-radius:16px;
  background:#64efd4;color:#102a39;
  padding:15px 24px;font-size:18px;
  font-weight:800;cursor:pointer;
  touch-action:none;
}
#controls{
  position:fixed;bottom:22px;left:20px;right:20px;
  display:flex;justify-content:space-between;
  user-select:none;
}
#controls div{display:flex;gap:12px}
#controls button{
  min-width:64px;background:#ffffff25;
  color:white;border:1px solid #ffffff40;
  backdrop-filter:blur(8px);
}
#controls button:active{background:#64efd477}
.small{font-size:13px;color:#a4bfd8}
#pause,#mute{pointer-events:auto;padding:10px 14px;font-size:16px;background:#ffffff25;color:#fff;border:1px solid #ffffff40}
#combo{position:fixed;top:100px;left:0;right:0;text-align:center;font-size:22px;font-weight:900;color:#ffe176;text-shadow:0 2px 8px #0008;pointer-events:none;opacity:0;transition:opacity .2s}
#buffs{position:fixed;top:132px;left:0;right:0;text-align:center;font-size:15px;pointer-events:none}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div class="card">🪙 <b id="coins">0</b></div>
  <div class="card">❤️ <b id="lives">3</b></div>
  <div class="card">⭐ <b id="score">0</b></div>
  <div class="card">🏁 <b id="distance">0</b> / 1000 m</div>
  <div style="display:flex;gap:8px"><button id="mute">🔊</button><button id="pause">⏸</button></div>
</div>
<div id="combo"></div><div id="buffs"></div>
<div id="progress"><div id="bar"></div></div>
<div id="panel">
  <div class="dialog">
    <h1 id="title">스카이 코인 러너</h1>
    <p id="message">
      코인을 연속으로 모으면 콤보 배율이 올라가요!<br>
      빨간 벽은 피하고, 주황 장애물과 틈은 점프!<br>
      🛡 방패: 한 번 막아줌 · 🧲 자석: 6초간 코인 흡수<br>
      갈수록 빨라져요. 최고 점수: <b id="best0">0</b>
    </p>
    <button id="start">게임 시작</button>
    <p class="small">← → 이동 · 스페이스 점프 · P 일시정지<br>모바일: 화면 밀기(좌우/위) · 탭 점프 · 버튼</p>
  </div>
</div>
<div id="controls">
  <div>
    <button id="left" aria-label="왼쪽">◀</button>
    <button id="right" aria-label="오른쪽">▶</button>
  </div>
  <button id="jump">점프 ↑</button>
</div>
<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W,H,DPR,scale;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  scale=Math.min(W*0.9,H*1.1);
}
addEventListener("resize",resize);resize();

const END=1000;
let state="ready",distance=0,coins=0,lives=3,score=0,combo=0,best=+localStorage.skyBest||0;
let lane=0,x=0,y=0,vy=0,invincible=0,shield=false,magnet=0,shake=0,muted=localStorage.skyMute==="1";
let objects=[],gaps=[],last=0,time=0,parts=[];
let faces=[];
const laneX=n=>n*2.25;
const speed=()=>14+12*(distance/END);
let ac;
function beep(f,d,type="sine",v=.07){
  if(muted)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
  const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);}catch(e){}
}
function project(p){
  const dz=p[2]+9,dy=p[1]-4.2;
  const c=.972,s=.235;
  const depth=dz*c-dy*s;
  if(depth<=.15)return null;
  return {x:W/2+p[0]*scale/depth,y:H*.43-(dy*c+dz*s)*scale/depth,z:depth};
}
function polygon(points,color){
  const ps=points.map(project);
  if(ps.some(p=>!p))return;
  faces.push({p:ps,color,z:ps.reduce((sum,p)=>sum+p.z,0)/ps.length});
}
function box(cx,cy,cz,w,h,d,colors){
  const a=cx-w/2,b=cx+w/2;
  const lo=cy,hi=cy+h,f=cz-d/2,k=cz+d/2;
  polygon([[a,lo,f],[b,lo,f],[b,hi,f],[a,hi,f]],colors[0]);
  polygon([[a,hi,f],[b,hi,f],[b,hi,k],[a,hi,k]],colors[1]);
  polygon([[a,lo,k],[a,lo,f],[a,hi,f],[a,hi,k]],colors[2]);
  polygon([[b,lo,f],[b,lo,k],[b,hi,k],[b,hi,f]],colors[2]);
}
function coin(cx,cy,cz,color="#ffe176",r=.35){
  const pts=[];
  for(let i=0;i<12;i++){
    const a=i/12*Math.PI*2;
    pts.push([cx+Math.cos(a)*r*Math.cos(time*3),cy+Math.sin(a)*r,cz]);
  }
  polygon(pts,color);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function buildLevel(){
  objects=[];gaps=[];
  let z=24,row=0;
  while(z<END-18){
    const d=z/END;
    row++;
    const lanes=[-1,0,1].sort(()=>Math.random()-.5);
    const free=lanes[0];
    const blocks=d>.35&&Math.random()<.25+d*.4?[lanes[1],lanes[2]]:[lanes[1]];
    for(const bl of blocks){
      objects.push({type:Math.random()<.38?"low":"wall",lane:bl,z,done:false});
    }
    if(row%6===0){
      objects.push({type:Math.random()<.5?"shield":"magnet",lane:free,z:z+4,done:false});
    }else{
      const high=Math.random()<.25;
      for(let k=0;k<3;k++)objects.push({type:"coin",lane:free,z:z-3+k*2,high,done:false});
    }
    if(Math.random()<.18+d*.25){
      gaps.push({z:z+6,lane:pick(lanes),done:false});
    }
    z+=Math.max(8,12-d*4);
  }
}
function move(dir){
  if(state==="playing"){const n=Math.max(-1,Math.min(1,lane+dir));if(n!==lane){lane=n;beep(520,.05,"triangle",.04);}}
}
function jump(){
  if(state==="playing"&&y<=.001){vy=9.5;y=.002;beep(380,.12,"square",.03);}
}
function burst(wx,wy,wz,color,n=10){
  const p=project([wx,wy,wz]);if(!p)return;
  for(let i=0;i<n;i++)parts.push({x:p.x,y:p.y,vx:(Math.random()-.5)*260,vy:-Math.random()*260,life:.6,color});
}
function start(){
  distance=0;coins=0;lives=3;score=0;combo=0;
  lane=0;x=0;y=0;vy=0;invincible=0;shield=false;magnet=0;parts=[];
  buildLevel();state="playing";
  $("panel").style.display="none";
  updateHUD();
}
function finish(win){
  state=win?"won":"lost";
  if(win)score+=lives*500;
  const nb=score>best;
  if(nb){best=score;localStorage.skyBest=best;}
  beep(win?880:160,.5,win?"triangle":"sawtooth",.06);
  $("title").textContent=win?"🏆 결승점 도착!":"다시 도전해 보세요!";
  $("message").innerHTML=
    `점수 <b>${score}</b>${nb?" 🎉 신기록!":""}<br>`+
    `최고 점수 ${best}<br>`+
    `코인 ${coins}개 · ${Math.floor(distance)} m / ${END} m`+(win?`<br>남은 하트 보너스 +${lives*500}`:"");
  $("start").textContent="다시 시작";
  $("panel").style.display="flex";
}
function hurt(){
  if(invincible>0)return;
  if(shield){shield=false;invincible=1;beep(300,.2,"triangle");burst(x,y+1,0,"#64efd4",14);return;}
  lives--;invincible=1.6;combo=0;shake=.35;
  beep(120,.3,"sawtooth",.08);burst(x,y+1,0,"#ff6b88",16);
  if(navigator.vibrate)navigator.vibrate(120);
  if(lives<=0)finish(false);
}
function togglePause(){
  if(state==="playing"){state="paused";$("title").textContent="일시정지";$("message").innerHTML=`점수 ${score} · ${Math.floor(distance)} m`;$("start").textContent="계속하기";$("panel").style.display="flex";}
  else if(state==="paused"){state="playing";$("panel").style.display="none";}
}
function updateHUD(){
  $("coins").textContent=coins;
  $("lives").textContent=lives;
  $("score").textContent=score;
  $("distance").textContent=Math.floor(distance);
  $("bar").style.width=(distance/END*100)+"%";
  const m=1+Math.floor(combo/5);
  $("combo").textContent=`콤보 ${combo} · x${m}`;
  $("combo").style.opacity=combo>=3?1:0;
  $("buffs").textContent=(shield?"🛡 방패 ":"")+(magnet>0?`🧲 ${magnet.toFixed(1)}s`:"");
}
$("best0").textContent=best;
$("mute").textContent=muted?"🔇":"🔊";
$("start").onclick=()=>state==="paused"?togglePause():start();
$("pause").onpointerdown=e=>{e.preventDefault();togglePause()};
$("mute").onpointerdown=e=>{e.preventDefault();muted=!muted;localStorage.skyMute=muted?"1":"0";$("mute").textContent=muted?"🔇":"🔊"};
$("left").onpointerdown=e=>{e.preventDefault();move(-1)};
$("right").onpointerdown=e=>{e.preventDefault();move(1)};
$("jump").onpointerdown=e=>{e.preventDefault();jump()};
let sw=null;
canvas.addEventListener("pointerdown",e=>{sw={x:e.clientX,y:e.clientY}});
canvas.addEventListener("pointerup",e=>{
  if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;
  if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else jump();
});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state==="playing")togglePause()});
addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowUp","Space"].includes(e.code))e.preventDefault();
  if(e.repeat)return;
  if(e.code==="ArrowLeft"||e.code==="KeyA")move(-1);
  if(e.code==="ArrowRight"||e.code==="KeyD")move(1);
  if(e.code==="Space"||e.code==="ArrowUp")jump();
  if(e.code==="KeyP"||e.code==="Escape")togglePause();
  if(e.code==="Enter"&&(state==="won"||state==="lost"||state==="ready"))start();
});
function update(dt){
  time+=dt;
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  shake=Math.max(0,shake-dt);
  if(state!=="playing")return;
  const before=distance;
  distance=Math.min(END,distance+speed()*dt);
  score+=Math.round(speed()*dt*1)||0;
  x+=(laneX(lane)-x)*Math.min(1,dt*16);
  vy-=24*dt;y=Math.max(0,y+vy*dt);
  if(y===0)vy=0;
  invincible=Math.max(0,invincible-dt);
  magnet=Math.max(0,magnet-dt);
  for(const o of objects){
    if(o.done)continue;
    const z=o.z-distance;
    if(o.type==="coin"&&magnet>0&&z<1.5&&z>-1){
      coins++;combo++;score+=10*(1+Math.floor(combo/5));o.done=true;
      beep(990+combo*8,.07);burst(x,y+1,0,"#ffe176",6);continue;
    }
    if(z<1&&o.z-before>=-1){
      if(Math.abs(x-laneX(o.lane))<.85){
        if(o.type==="coin"){
          const height=o.high?2.05:.9;
          if(Math.abs((y+.8)-height)<.9){
            coins++;combo++;score+=10*(1+Math.floor(combo/5));o.done=true;
            beep(990+combo*8,.07);burst(laneX(o.lane),height,0,"#ffe176",8);
          }
        }else if(o.type==="shield"){
          shield=true;o.done=true;beep(660,.25,"triangle");burst(x,1,0,"#64efd4",14);
        }else if(o.type==="magnet"){
          magnet=6;o.done=true;beep(740,.25,"triangle");burst(x,1,0,"#c58bff",14);
        }else{
          if(o.type==="wall"||y<1.0)hurt();
          o.done=true;
        }
      }
    }
    if(z < -2)o.done=true;
  }
  for(const g of gaps){
    if(g.done)continue;
    if(Math.abs(g.z-distance)<1.1&&Math.abs(x-laneX(g.lane))<.86&&y<.25){hurt();g.done=true;}
    if(g.z-distance < -2)g.done=true;
  }
  updateHUD();
  if(state==="playing"&&distance>=END)finish(true);
}
function draw(){
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#152d55");
  bg.addColorStop(.6,"#5c9bb8");
  bg.addColorStop(1,"#b0e1df");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*14*shake/.35,(Math.random()-.5)*14*shake/.35);
  ctx.fillStyle="#ffffff30";
  for(let i=0;i<6;i++){
    const cx=((i*W*.37-distance*(3+i%3))%(W+200)+W+200)%(W+200)-100,cy=H*(.08+i*.045);
    ctx.beginPath();ctx.ellipse(cx,cy,60+i*8,14+i*2,0,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle="#fff8";
  ctx.beginPath();ctx.arc(W*.79,H*.18,35,0,Math.PI*2);ctx.fill();
  faces=[];
  const startZ=Math.floor((distance-5)/3)*3;
  for(let world=startZ;world<distance+100;world+=3){
    if(world>END+5)continue;
    const z=world-distance;
    for(let l=-1;l<=1;l++){
      const gap=gaps.some(g=>
        g.lane===l&&Math.abs(world-g.z)<1.6
      );
      if(!gap){
        box(laneX(l),-.28,z,2.2,.28,2.95,
          ["#243c65",l===0?"#44618a":"#3b547b","#263e65"]);
      }
    }
    for(const side of [-1,1]){
      box(side*3.5,0,z,.09,.1,2.95,
        ["#58e2d0","#b0fff0","#40b9b4"]);
    }
  }
  for(const o of objects){
    const z=o.z-distance;
    if(o.done||z < -3||z>95)continue;
    const ox=laneX(o.lane);
    if(o.type==="coin"){
      coin(ox,(o.high?2.05:.9)+Math.sin(time*4+o.z)*.08,z);
    }else if(o.type==="shield"||o.type==="magnet"){
      const c=o.type==="shield"?["#2fb8a8","#9ffff0","#1f8f86"]:["#8b55e0","#d9b8ff","#6a3bb8"];
      box(ox,1+Math.sin(time*4)*.15,z,.8,.8,.8,c);
    }else{
      const low=o.type==="low";
      box(ox,0,z,1.55,low?.85:3,1,
        low?["#e8a341","#ffe18a","#bb762e"]:
            ["#e65c79","#ff9ca9","#ae355c"]);
    }
  }

  const f=END-distance;
  if(f<100){
    for(const side of [-1,1])
      box(side*3.1,0,f,.4,4.5,.5,
        ["#f6c952","#fff0a5","#c2923f"]);
    box(0,4.1,f,6.6,.55,.5,
      ["#f6c952","#fff0a5","#c2923f"]);
    for(let i=0;i<8;i++){
      box(-2.8+i*.8,4.12,f-.27,.4,.48,.02,
        [i%2?"#ffffff":"#203456","#ffffff","#203456"]);
    }
  }

  if(!(invincible>0&&Math.floor(time*12)%2)){
    box(x,y+.4,0,.78,.85,.55,
      ["#53dec8","#b8fff0","#249f9d"]);
    box(x,y+1.25,0,.62,.62,.58,
      ["#f8d6b0","#ffe9ce","#d3a880"]);
    box(x-.22,y,0,.25,.45,.35,
      ["#263e69","#4e6c98","#1c2e51"]);
    box(x+.22,y,0,.25,.45,.35,
      ["#263e69","#4e6c98","#1c2e51"]);
    box(x-.51,y+.5,0,.22,.65,.32,
      ["#53dec8","#b8fff0","#249f9d"]);
    box(x+.51,y+.5,0,.22,.65,.32,
      ["#53dec8","#b8fff0","#249f9d"]);
  }

  if(shield)coin(x,y+1,0,"#64efd455",1.05);
  if(magnet>0)coin(x,y+1,0,"#c58bff40",1.25);
  faces.sort((a,b)=>b.z-a.z);
  for(const face of faces){
    ctx.beginPath();
    face.p.forEach((p,i)=>
      i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    ctx.closePath();ctx.fillStyle=face.color;ctx.fill();
    ctx.strokeStyle="#10254020";ctx.lineWidth=.6;ctx.stroke();
  }
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life/.6);ctx.fillStyle=p.color;ctx.fillRect(p.x-3,p.y-3,6,6);}
  ctx.globalAlpha=1;
  ctx.restore();
}
function frame(now){
  const dt=Math.min((now-last)/1000||0,.033);
  last=now;update(dt);draw();requestAnimationFrame(frame);
}
buildLevel();requestAnimationFrame(frame);
</script>
</body>
</html>
