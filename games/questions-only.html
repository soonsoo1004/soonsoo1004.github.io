<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>❓ 질문만 받아치기 — 5초 안에 물음표로만 되묻는 게임</title>
<meta name="description" content="도발하는 봇 콕에게 물음표(?)로 끝나는 말만 골라 받아치는 무광고 단일 HTML 게임. 15가지 표정, 5개 스테이지 60세트, 무한 릴레이. 평서문을 고르면 바로 패배.">
<meta name="author" content="린다 (Linda)">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#F5F2FF">
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100dvh;
    color:#2c2a3a;
    font-family:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
    letter-spacing:-.015em;
    -webkit-text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    background:
      radial-gradient(90% 55% at 12% -6%,#EDE6FF 0%,rgba(237,230,255,0) 70%),
      radial-gradient(80% 50% at 96% 4%,#D9F5EE 0%,rgba(217,245,238,0) 66%),
      linear-gradient(180deg,#FBF9FF 0%,#F6F3FE 55%,#F3F7F6 100%);
  }
  .wrap{
    width:100%;max-width:420px;margin:0 auto;min-height:100dvh;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:10px;
  }
  .screen{display:flex;flex-direction:column;gap:10px;flex:1 1 auto;min-height:0}
  .screen[hidden]{display:none}

  /* ---------- 상단 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:8px;min-width:0}
  .brand .mark{font-size:15px;line-height:1}
  .brand h1{margin:0;font-size:16.5px;font-weight:780;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .icon-btn{
    flex:none;width:33px;height:33px;border-radius:50%;cursor:pointer;padding:0;
    border:1px solid #E4DEFA;background:#fff;color:#6f6a8c;
    display:grid;place-items:center;
    box-shadow:0 3px 10px -6px rgba(96,80,160,.6);
    transition:transform .12s ease,background .15s ease;
  }
  .icon-btn:active{transform:scale(.93);background:#F4F0FF}
  .ico{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .ico .fill{fill:currentColor;stroke:none}
  #muteBtn .cross{display:none}
  #muteBtn[data-muted="1"] .wave{display:none}
  #muteBtn[data-muted="1"] .cross{display:inline}
  #muteBtn[data-muted="1"]{color:#C0304F;border-color:#F6D6DF;background:#FFF6F8}

  /* ---------- 홈 ---------- */
  .hero{
    display:flex;align-items:center;gap:12px;padding:2px 2px 0;flex:0 0 auto;
  }
  .heroFace{width:78px;flex:none;filter:drop-shadow(0 12px 16px rgba(94,72,190,.3))}
  .heroTxt{min-width:0;display:flex;flex-direction:column;gap:5px}
  .heroTxt .hi{margin:0;font-size:14.5px;font-weight:760;letter-spacing:-.03em;color:#312c52}
  .heroTxt .sub{margin:0;font-size:11.5px;font-weight:600;color:#8d88a8;line-height:1.45;word-break:keep-all}

  .listTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 0;flex:0 0 auto}
  .listTitle b{font-size:12px;font-weight:760;color:#6b6590;letter-spacing:-.01em}
  .listTitle span{font-size:11px;font-weight:600;color:#a29db8}

  .stages{display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
  .stage{
    position:relative;display:flex;align-items:center;gap:11px;width:100%;
    font:inherit;text-align:left;cursor:pointer;color:#2f2b47;
    padding:11px 13px;border-radius:17px;background:#fff;border:1.5px solid #E8E2F8;
    box-shadow:0 9px 20px -20px rgba(84,64,150,.9);
    transition:transform .1s ease,border-color .15s ease,background .15s ease;
  }
  .stage:active{transform:scale(.984);border-color:#BBA8F6;background:#FCFAFF}
  .snum{
    flex:none;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
    font-size:16px;line-height:1;background:#F2EDFF;border:1px solid #E7DFFB;
  }
  .sbody{min-width:0;flex:1 1 auto}
  .sbody b{display:block;font-size:14.5px;font-weight:740;letter-spacing:-.03em;line-height:1.25}
  .sbody small{display:block;margin-top:2px;font-size:11px;font-weight:600;color:#9893b0;letter-spacing:-.01em}
  .sbadge{
    flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;
    font-size:10.5px;font-weight:700;color:#a6a1ba;white-space:nowrap;
  }
  .sbadge .ok{color:#2E9C74}
  .sbadge b{font-size:12.5px;font-weight:800;color:#6A46D9}

  .relay{
    display:flex;align-items:center;gap:11px;width:100%;font:inherit;text-align:left;cursor:pointer;
    padding:13px 14px;border-radius:18px;border:0;color:#fff;
    background:linear-gradient(135deg,#7B5CF0 0%,#5F86E8 100%);
    box-shadow:0 14px 26px -18px rgba(98,70,220,.95);
    transition:transform .1s ease,filter .15s ease;
  }
  .relay:active{transform:scale(.984);filter:brightness(1.05)}
  .relay .snum{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3)}
  .relay .sbody b{color:#fff}
  .relay .sbody small{color:rgba(255,255,255,.78)}
  .relay .sbadge{color:rgba(255,255,255,.72)}
  .relay .sbadge b{color:#fff}

  .opts{display:flex;flex-direction:column;gap:8px;flex:0 0 auto;margin-top:2px}
  .opt{
    display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:15px;
    background:#fff;border:1.5px solid #E8E2F8;cursor:pointer;
    font:inherit;text-align:left;color:#2f2b47;
    box-shadow:0 8px 18px -20px rgba(84,64,150,.9);
    transition:border-color .15s ease,background .15s ease;
  }
  .opt .olbl{flex:1 1 auto;min-width:0}
  .opt .olbl b{display:block;font-size:13px;font-weight:730;letter-spacing:-.02em}
  .opt .olbl small{display:block;margin-top:1px;font-size:10.5px;font-weight:600;color:#9b96b2}
  .sw{
    flex:none;position:relative;width:40px;height:23px;border-radius:999px;background:#DDD7EE;
    transition:background .18s ease;
  }
  .sw::after{
    content:"";position:absolute;top:2.5px;left:2.5px;width:18px;height:18px;border-radius:50%;
    background:#fff;box-shadow:0 2px 5px rgba(70,50,140,.3);transition:transform .18s ease;
  }
  .opt[aria-pressed="true"] .sw{background:#6A46D9}
  .opt[aria-pressed="true"] .sw::after{transform:translateX(17px)}

  .foot{
    margin:2px 0 0;flex:0 0 auto;text-align:center;font-size:10.5px;line-height:1.5;color:#9b96b2;
  }

  /* ---------- 봇 얼굴 ---------- */
  .defs{position:absolute;width:0;height:0;overflow:hidden}
  .faceSvg{display:block;width:100%;height:auto;overflow:visible}
  .faceSvg .fx{display:none}
  .faceSvg[data-f="curious"] .fx[data-f="curious"],
  .faceSvg[data-f="surprised"] .fx[data-f="surprised"],
  .faceSvg[data-f="skeptic"] .fx[data-f="skeptic"],
  .faceSvg[data-f="sulky"] .fx[data-f="sulky"],
  .faceSvg[data-f="angry"] .fx[data-f="angry"],
  .faceSvg[data-f="furious"] .fx[data-f="furious"],
  .faceSvg[data-f="sad"] .fx[data-f="sad"],
  .faceSvg[data-f="joy"] .fx[data-f="joy"],
  .faceSvg[data-f="huh"] .fx[data-f="huh"],
  .faceSvg[data-f="panic"] .fx[data-f="panic"],
  .faceSvg[data-f="smug"] .fx[data-f="smug"],
  .faceSvg[data-f="proud"] .fx[data-f="proud"],
  .faceSvg[data-f="tired"] .fx[data-f="tired"],
  .faceSvg[data-f="love"] .fx[data-f="love"],
  .faceSvg[data-f="think"] .fx[data-f="think"]{display:inline}

  .faceWrap{position:relative;width:118px;flex:none;filter:drop-shadow(0 16px 22px rgba(94,72,190,.32))}
  .faceWrap.big{width:clamp(140px,72vw,282px)}
  .faceWrap.pop{animation:bounce .4s cubic-bezier(.3,1.5,.5,1)}
  @keyframes bounce{0%{transform:scale(.86) rotate(-3deg)}55%{transform:scale(1.07) rotate(2deg)}100%{transform:scale(1) rotate(0)}}
  .faceSvg .qmark{font-size:35px;font-weight:800;fill:#5F49C8;font-family:inherit}
  .faceSvg .dot{fill:#5F49C8}
  .faceSvg .note{font-size:27px;font-weight:700;fill:#fff}
  .faceSvg .note.sm{font-size:19px}
  .faceSvg[data-f="angry"] .bolt{animation:bolt .85s steps(2,end) infinite}
  @keyframes bolt{0%,55%{opacity:1;transform:translate(0,0)}60%{opacity:.35}70%{opacity:1;transform:translate(-1px,1px)}100%{opacity:1}}
  .faceSvg[data-f="furious"] .burst{transform-origin:151px 45px;animation:burst .9s ease-in-out infinite}
  @keyframes burst{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.12) rotate(6deg)}}
  .faceSvg[data-f="sad"] .tear{animation:tear 2.1s ease-in-out infinite}
  @keyframes tear{0%,100%{transform:translateY(0);opacity:.95}50%{transform:translateY(5px);opacity:.7}}
  .faceSvg[data-f="joy"] .notes{animation:float 1.8s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(4deg)}}
  .faceSvg[data-f="love"] .hbeat{animation:hbeat 1.1s ease-in-out infinite}
  @keyframes hbeat{0%,100%{transform:scale(1)}45%{transform:scale(1.08)}}
  .faceSvg[data-f="tired"] .puff{animation:puff 2.4s ease-in-out infinite}
  @keyframes puff{0%,100%{transform:translate(0,0);opacity:.5}50%{transform:translate(4px,-4px);opacity:.28}}

  /* ---------- 플레이 ---------- */
  .playTop{display:flex;align-items:center;gap:9px;flex:0 0 auto}
  .playTop .ttl{flex:1 1 auto;min-width:0;text-align:center}
  .playTop .ttl b{display:block;font-size:13.5px;font-weight:770;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .playTop .ttl small{display:block;margin-top:1px;font-size:10.5px;font-weight:650;color:#9b96b2}

  .hud{display:flex;align-items:center;gap:7px;flex:0 0 auto}
  .chip{
    display:inline-flex;align-items:baseline;gap:5px;
    padding:6px 11px;border-radius:999px;background:#fff;border:1px solid #E8E3F7;
    font-size:11.5px;font-weight:600;color:#8a85a5;white-space:nowrap;
    box-shadow:0 3px 10px -8px rgba(96,80,160,.55);
  }
  .chip b{font-size:13.5px;font-weight:800;color:#3A3560;letter-spacing:-.01em}
  .chip[data-hot="1"]{border-color:#C9B9FF;background:#F7F2FF}
  .chip[data-hot="1"] b{color:#6A46D9}
  .chip[data-hot="2"]{border-color:#F7C6D3;background:#FFF3F6}
  .chip[data-hot="2"] b{color:#C0304F}
  .clock{
    margin-left:auto;display:inline-flex;align-items:baseline;gap:3px;
    font-size:11px;font-weight:600;color:#8a85a5;
  }
  .clock b{
    font-size:21px;font-weight:820;letter-spacing:-.04em;color:#3A3560;
    font-variant-numeric:tabular-nums;transition:color .18s ease;
  }
  .clock[data-tone="warn"] b{color:#E08A1E}
  .clock[data-tone="danger"] b{color:#E0446A}

  .bar{flex:0 0 auto;height:7px;border-radius:999px;background:#E7E1F6;overflow:hidden}
  .bar i{
    display:block;height:100%;width:100%;border-radius:999px;
    background:linear-gradient(90deg,#5BC8A8,#48B7D8);
    transition:background .25s ease;
  }
  .bar[data-tone="warn"] i{background:linear-gradient(90deg,#F2B33D,#EE8F3C)}
  .bar[data-tone="danger"] i{background:linear-gradient(90deg,#F2685F,#E0446A)}

  .chat{position:relative;flex:1 1 auto;min-height:132px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden}
  .stageBox{display:flex;flex-direction:column;align-items:center;gap:11px;width:100%}

  .col{width:100%;display:flex;flex-direction:column;align-items:center;gap:6px}
  .who{font-size:10.5px;font-weight:650;color:#9a94b4;letter-spacing:-.01em}
  .bubble{
    --bg:#fff;--bd:#EBE6F8;
    position:relative;margin:0;padding:12px 15px;border-radius:19px;
    background:var(--bg);border:1px solid var(--bd);
    font-size:15.5px;font-weight:650;line-height:1.42;color:#332F49;
    box-shadow:0 10px 24px -20px rgba(84,64,150,.9);
    max-width:100%;text-align:center;word-break:keep-all;
    animation:rise .26s ease;
  }
  .bubble::after{
    content:"";position:absolute;top:-5.5px;left:50%;margin-left:-5px;width:10px;height:10px;
    background:var(--bg);border-left:1px solid var(--bd);border-top:1px solid var(--bd);
    transform:rotate(45deg);border-radius:2px 0 0 0;
  }
  .bubble.hit{--bg:#F2FBF7;--bd:#CBEEDC;color:#1E7A57}
  .col.mine{display:none}
  .col.mine.on{display:flex}
  .bubble.mine{--bg:#EDF6FF;--bd:#CFE4FA;color:#24507B;font-weight:600;font-size:14.5px}
  .pips{display:flex;align-items:center;justify-content:center;gap:4px;height:8px}
  .pips i{display:block;width:6px;height:6px;border-radius:50%;background:#DED8F0;transition:background .2s ease,transform .2s ease}
  .pips i.on{background:#57C39B}
  .pips i.now{background:#6A46D9;transform:scale(1.35)}
  .pips.relay{gap:5px}
  .pips.relay i{width:7px;height:7px}
  .next{margin:0;font-size:11.5px;font-weight:650;color:#9a94b4;letter-spacing:-.01em;text-align:center}
  .next b{color:#6A46D9;font-weight:800}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .toast{
    position:absolute;left:50%;bottom:2px;
    padding:5px 12px;border-radius:999px;background:#3A3560;color:#fff;
    font-size:11.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;
    opacity:0;transform:translateX(-50%) translateY(4px);transition:opacity .2s ease,transform .2s ease;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- 카드 ---------- */
  .cards{flex:0 0 auto;display:flex;flex-direction:column;gap:10px}
  .card{
    position:relative;width:100%;margin:0;cursor:pointer;
    font:inherit;text-align:left;color:#33304A;
    padding:15px 16px;border-radius:20px 20px 20px 7px;
    background:#fff;border:1.5px solid #E5DFF7;
    font-size:clamp(13.5px,4.05vw,15.5px);font-weight:600;line-height:1.36;word-break:keep-all;
    box-shadow:0 10px 22px -20px rgba(84,64,150,.9);
    transition:transform .1s ease,border-color .15s ease,background .15s ease;
    animation:rise .26s ease backwards;
  }
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .card:active{transform:scale(.982);border-color:#B9A6F5;background:#FCFAFF}
  .card::after{
    content:"";position:absolute;left:-5px;bottom:9px;width:10px;height:10px;
    background:#fff;border-left:1.5px solid #E5DFF7;border-bottom:1.5px solid #E5DFF7;
    transform:rotate(45deg);border-radius:0 0 0 2px;transition:background .15s ease;
  }
  .card[data-state="right"]{border-color:#57C39B;background:#F0FBF6;color:#1E7A57;animation:none}
  .card[data-state="right"]::after{background:#F0FBF6;border-color:#57C39B}
  .card[data-state="wrong"]{border-color:#EE7288;background:#FFF3F5;color:#B02A46;animation:shake .32s ease}
  .card[data-state="wrong"]::after{background:#FFF3F5;border-color:#EE7288}
  .cards[data-locked="1"] .card:not([data-state]){opacity:.5}
  @keyframes shake{0%{transform:translateX(0)}25%{transform:translateX(-5px)}55%{transform:translateX(4px)}100%{transform:translateX(0)}}

  .rule{flex:0 0 auto;margin:0;text-align:center;font-size:11px;line-height:1.5;color:#9691b0;letter-spacing:-.01em}
  .rule b{color:#6A46D9;font-weight:750}

  /* ---------- 오버레이 ---------- */
  .overlay{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:18px;
    background:rgba(30,26,52,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    opacity:0;transition:opacity .22s ease;
  }
  .overlay[hidden]{display:none}
  .overlay.show{opacity:1}
  .ovcard{
    width:100%;max-width:332px;padding:22px 20px 20px;border-radius:24px;
    background:#fff;text-align:center;
    box-shadow:0 26px 60px -30px rgba(28,20,60,.85);
    transform:translateY(8px);transition:transform .24s ease;
  }
  .overlay.show .ovcard{transform:none}
  .ovtag{
    display:inline-block;margin:0 0 9px;padding:5px 11px;border-radius:999px;
    background:#FFEEF2;color:#C0304F;font-size:11px;font-weight:750;
  }
  .ovtag.win{background:#EAFBF3;color:#1E8A63}
  .ovcard h2{margin:0 0 8px;font-size:21px;font-weight:820;letter-spacing:-.035em;color:#2c2a3a}
  .ovline{margin:0 0 13px;font-size:13.5px;line-height:1.5;color:#5d5878;font-weight:600;word-break:keep-all}
  .ovans{padding:11px 13px;border-radius:15px;background:#F2FBF7;border:1px solid #CFEEDF;text-align:left}
  .ovans .lbl{display:block;font-size:10.5px;font-weight:750;color:#3E9A76;letter-spacing:.02em}
  .ovans p{margin:3px 0 0;font-size:13.5px;font-weight:650;line-height:1.4;color:#1E6B4F;word-break:keep-all}
  .ovnote{margin:11px 0 0;font-size:11.5px;color:#9691b0;font-weight:600}
  .ovface{width:78px;margin:0 auto 4px;filter:drop-shadow(0 10px 14px rgba(94,72,190,.3))}
  .ovbtns{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .primary{
    width:100%;font:inherit;font-size:14.5px;font-weight:750;cursor:pointer;
    padding:13px 20px;border-radius:999px;border:0;background:#6A46D9;color:#fff;
    box-shadow:0 12px 24px -16px rgba(106,70,217,1);
    transition:transform .12s ease,background .15s ease;
  }
  .primary:active{transform:scale(.97);background:#5B39C6}
  .ghost{
    width:100%;font:inherit;font-size:13px;font-weight:700;cursor:pointer;
    padding:10px 20px;border-radius:999px;border:1.5px solid #E5DFF7;background:#fff;color:#6f6a8c;
    transition:transform .12s ease,background .15s ease;
  }
  .ghost:active{transform:scale(.97);background:#F6F2FF}

  /* ---------- 표정 도감 ---------- */
  .galcard{
    width:100%;max-width:352px;max-height:calc(100dvh - 44px);display:flex;flex-direction:column;
    padding:16px 16px 14px;border-radius:24px;background:#fff;
    box-shadow:0 26px 60px -30px rgba(28,20,60,.85);
    transform:translateY(8px);transition:transform .24s ease;
  }
  .overlay.show .galcard{transform:none}
  .galhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex:0 0 auto}
  .galhead b{flex:1 1 auto;font-size:14px;font-weight:780;letter-spacing:-.03em}
  .galhead small{font-size:10.5px;font-weight:650;color:#9b96b2}
  .galgrid{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;
    overflow-y:auto;padding:2px 0 2px;
    -webkit-overflow-scrolling:touch;
  }
  .galitem{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
  .galitem .mini{width:100%;max-width:74px}
  .galitem span{font-size:9.5px;font-weight:700;color:#8a85a5;letter-spacing:-.02em;text-align:center;line-height:1.2}

  @media (max-height:760px){
    .wrap{gap:8px}
    .faceWrap{width:98px}
    .faceWrap.big{width:clamp(136px,46vw,178px)}
    .heroFace{width:66px}
    .stageBox{gap:9px}
    .bubble{padding:10px 13px;font-size:14.5px}
    .card{padding:11px 14px}
    .cards{gap:8px}
    .clock b{font-size:19px}
    .heroTxt .hi{font-size:13.5px}
    .stage{padding:9px 12px}
  }
  @media (max-height:660px){
    .wrap{gap:6px;padding-top:calc(8px + env(safe-area-inset-top))}
    .faceWrap{width:78px}
    .faceWrap.big{width:clamp(118px,40vw,150px)}
    .heroFace{width:54px}
    .stageBox{gap:7px}
    .who{font-size:10px}
    .bubble{padding:9px 12px;font-size:13.5px;line-height:1.36}
    .card{padding:9px 12px}
    .cards{gap:6px}

    }

    updateProg();
    ruleEl.innerHTML = '3개 중 <b>물음표(?)</b>로 끝나는 말만 · <b>' + (G.roundMs / 1000).toFixed(1) + '초</b> 안에';
    renderNext(G.streak);

    if (leadIn) {
      G.answered = true;
      G.msLeft = G.roundMs;
      paintClock(G.roundMs);
      clockEl.textContent = (G.roundMs / 1000).toFixed(1);
      G.leadId = setTimeout(function () {
        if (G.over) return;
        G.answered = false;
        armClock();
      }, LEAD_IN);
      return;
    }
    armClock();
  }

  function updateProg() {
    if (G.mode === 'relay') {
      stageProg.textContent = '받아친 ' + G.hits + '개' + (G.cycle ? ' · ' + (G.cycle + 1) + '바퀴' : '');
      pipsEl.style.display = 'none';
      return;
    }
    var n = G.queue.length, html = '';
    for (var i = 0; i < n; i++) html += '<i class="' + (i < G.idx ? 'on' : (i === G.idx ? 'now' : '')) + '"></i>';
    pipsEl.innerHTML = html;
    pipsEl.style.display = 'flex';
    stageProg.textContent = (G.idx + 1) + ' / ' + n;
  }

  /* ============================================================
     11. 타이머
     ============================================================ */
  function armClock() {
    stopClock();
    G.startedAt = performance.now();
    G.msLeft = G.roundMs;
    clockEl.textContent = (G.roundMs / 1000).toFixed(1);
    fillEl.style.width = '100%';
    barEl.setAttribute('data-tone', 'ok');
    clockWrap.setAttribute('data-tone', 'ok');
    var pid = G.run * 10000 + G.idx + (G.cycle * 100);
    G.pid = pid;
    G.raf = requestAnimationFrame(function () { tick(pid); });
    G.limitId = setTimeout(function () {
      if (!G.over && !G.answered) fail('timeout');
    }, G.roundMs + 40);
  }

  function tick(pid) {
    if (G.over || G.answered || pid !== G.pid) return;
    var left = G.roundMs - (performance.now() - G.startedAt);
    if (left <= 0) { G.msLeft = 0; paintClock(0); fail('timeout'); return; }
    G.msLeft = left;
    paintClock(left);
    if (left <= 2000) {
      var slot = Math.ceil(left / 500);
      if (slot !== G.beatSlot) { G.beatSlot = slot; Snd.beat(); }
    }
    G.raf = requestAnimationFrame(function () { tick(pid); });
  }

  function paintClock(left) {
    clockEl.textContent = (left / 1000).toFixed(1);
    fillEl.style.width = Math.max(0, Math.min(100, (left / G.roundMs) * 100)) + '%';
    var tone = left <= G.roundMs * 0.32 ? 'danger' : (left <= G.roundMs * 0.64 ? 'warn' : 'ok');
    barEl.setAttribute('data-tone', tone);
    clockWrap.setAttribute('data-tone', tone);
  }

  function stopClock() {
    if (G.raf) cancelAnimationFrame(G.raf);
    if (G.limitId) clearTimeout(G.limitId);
    G.raf = 0; G.limitId = 0;
  }

  /* ============================================================
     12. 판정
     ============================================================ */
  function pick(i) {
    if (G.over || G.answered || G.screen !== 'play') return false;
    var card = G.cards[i];
    if (!card) return false;
    G.answered = true;
    stopClock();
    cardsEl.setAttribute('data-locked', '1');

    var btns = cardsEl.querySelectorAll('.card');
    var rightEnd = (card.text.slice(-1) === '?');
    if (card.t === 'ans') {
      if (btns[i]) btns[i].setAttribute('data-state', 'right');
      mineEl.textContent = card.text;
      mineWrap.classList.add('on');
      tauntEl.className = 'bubble hit';
      pass();
    } else {
      if (btns[i]) btns[i].setAttribute('data-state', 'wrong');
      if (btns[G.correct]) btns[G.correct].setAttribute('data-state', 'right');
      fail(rightEnd ? 'statement' : (card.text.slice(-1) === '!' ? 'exclaim' : 'statement'));
    }
    return true;
  }

  function pass() {
    G.streak += 1;
    G.hits += 1;
    if (G.streak > G.best) { G.best = G.streak; store('qonly_v2_best', G.best); }
    streakEl.textContent = String(G.streak);
    bestEl.textContent = String(G.best);
    streakChip.setAttribute('data-hot', G.streak >= 10 ? '2' : (G.streak >= 3 ? '1' : '0'));
    renderNext(G.streak);
    if (G.mode === 'relay') updateProg();

    Snd.correct();
    tauntEl.textContent = pickLine(G.streak >= 7 ? HIT_LINES_HOT : HIT_LINES, 'hit');
    setBotFace('surprised');
    G.extraId = setTimeout(function () {
      if (G.over) return;
      setBotFace(G.streak >= 9 ? 'furious' : (G.streak >= 4 ? 'sulky' : 'panic'));
    }, TEST ? 30 : 210);

    var title = null;
    for (var i = 0; i < TITLES.length; i++) if (G.streak === TITLES[i].at) { title = TITLES[i].name; break; }
    if (title) {
      showToast('칭호 · ' + title);
      Snd.fanfare(false);
      setBotFace('huh');
    }

    var last = (G.mode === 'stage' && G.idx + 1 >= G.queue.length);
    G.nextId = setTimeout(function () {
      if (G.over) return;
      if (last) { stageClear(); return; }
      G.idx += 1;
      beginRound(false);
    }, last ? (TEST ? 60 : 900) : NEXT_DELAY);
  }

  function fail(kind) {
    if (G.over || G.screen !== 'play') return;
    G.over = true;
    G.result = kind;
    stopClock();
    clearTimers();
    cardsEl.setAttribute('data-locked', '1');
    Snd.wrong();
    setBotFace('smug');

    var data = G.queue[G.idx] || { ans: '' };
    var scold = pickLine(SCOLD[kind] || SCOLD.statement, kind);

    if (G.mode === 'relay') {
      if (G.hits > G.relayBest) { G.relayBest = G.hits; store('qonly_v2_relay_best', G.relayBest); }
    } else {
      var sb = num('qonly_v2_stage_best_' + G.stageId);
      if (G.streak > sb) store('qonly_v2_stage_best_' + G.stageId, G.streak);
    }

    ovTag.className = 'ovtag';
    ovTag.textContent = '패배 · ' + G.streak + '연승에서 멈춤';
    ovTitle.textContent = G.mode === 'relay' ? '릴레이가 끊겼다' : HEADLINE[kind];
    ovScold.textContent = scold;
    ovAnsBox.hidden = false;
    ovAnsLbl.textContent = '이번 판 정답';
    ovAnswer.textContent = data.ans || '';
    ovNote.textContent = (G.mode === 'relay')
      ? '이번 릴레이 ' + G.hits + '개 받아침 · 최고 ' + G.relayBest + '개'
      : '연승 ' + G.streak + ' · 이 스테이지 최고 ' + Math.max(G.streak, num('qonly_v2_stage_best_' + G.stageId)) + '연승';
    ovBtn.textContent = G.mode === 'relay' ? '릴레이 다시' : '이 스테이지 다시';
    ovBtn.dataset.act = 'retry';
    ovHome.textContent = '홈으로';
    setFace(ovFace, 'smug');
    openOverlay();

    G.streak = 0;
    streakEl.textContent = '0';
    streakChip.setAttribute('data-hot', '0');
    renderNext(0);
  }

  function stageClear() {
    if (G.over) return;
    G.over = true;
    stopClock();
    clearTimers();
    Snd.bgmStop();
    Snd.fanfare(true);
    store('qonly_v2_clear_' + G.stageId, '1');

    ovTag.className = 'ovtag win';
    ovTag.textContent = '스테이지 클리어';
    ovTitle.textContent = stageNameOf(G.stageId) + ' 정복';
    ovScold.textContent = SETS[G.stageId].length + '문제를 다 받아쳤어. 다음 스테이지도 같은 규칙이야.';
    ovAnsBox.hidden = true;
    ovNote.textContent = '최고 연승 ' + G.best + ' · 이번 판 ' + G.queue.length + '문제 전부 정답';
    setFace(ovFace, 'joy');

    var nextS = nextStageOf(G.stageId);
    ovBtn.textContent = nextS ? ('다음 · ' + nextS.name) : '무한 릴레이';
    ovBtn.dataset.act = 'next';
    ovHome.textContent = '홈으로';
    openOverlay();
  }

  function nextStageOf(id) {
    for (var i = 0; i < STAGES.length; i++) if (STAGES[i].id === id) return STAGES[i + 1] || null;
    return null;
  }

  function openOverlay() {
    overlay.hidden = false;
    requestAnimationFrame(function () { overlay.classList.add('show'); });
  }

  function pickLine(pool, key) {
    if (poolIdx[key] === undefined) poolIdx[key] = Math.floor(G.rng() * pool.length);
    var v = pool[poolIdx[key] % pool.length];
    poolIdx[key] = (poolIdx[key] + 1) % 997;
    return v;
  }

  function renderNext(streak) {
    var nxt = null;
    for (var i = TITLES.length - 1; i >= 0; i--) if (TITLES[i].at > streak) { nxt = TITLES[i]; break; }
    if (!nxt) { nextEl.innerHTML = '칭호 다 땄어. 계속 가자'; return; }
    nextEl.innerHTML = '다음 칭호 <b>' + nxt.name + '</b> · ' + (nxt.at - streak) + '연승 남음';
  }

  function showToast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(showToast._id);
    showToast._id = setTimeout(hideToast, 1700);
  }
  function hideToast() { toastEl.classList.remove('show'); }

  /* ============================================================
     13. 입력
     ============================================================ */
  cardsEl.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.card') : null;
    if (!el) return;
    pick(parseInt(el.dataset.k, 10));
  });

  stageList.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('.stage') : null;
    if (!el) return;
    Snd.resume();
    startStage(el.dataset.stage);
  });

  relayBtn.addEventListener('click', function () { Snd.resume(); startRelay(); });
  $('backBtn').addEventListener('click', showHome);
  ovHome.addEventListener('click', showHome);

  ovBtn.addEventListener('click', function () {
    var act = ovBtn.dataset.act;
    overlay.classList.remove('show');
    overlay.hidden = true;
    if (act === 'next') {
      var nx = nextStageOf(G.stageId);
      if (nx) { Snd.resume(); startStage(nx.id); }
      else { Snd.resume(); startRelay(); }
      return;
    }
    Snd.resume();
    if (G.mode === 'relay') startRelay();
    else startStage(G.stageId);
  });

  expertToggle.addEventListener('click', function () {
    G.expert = !G.expert;
    store('qonly_v2_expert', G.expert ? '1' : '0');
    expertToggle.setAttribute('aria-pressed', G.expert ? 'true' : 'false');
    ruleEl.innerHTML = '3개 중 <b>물음표(?)</b>로 끝나는 말만 · <b>' + (G.expert ? '4.0' : '5.0') + '초</b> 안에';
  });

  function applyMuteUI() {
    for (var i = 0; i < muteBtns.length; i++) {
      if (!muteBtns[i]) continue;
      muteBtns[i].setAttribute('data-muted', Snd.muted ? '1' : '0');
      muteBtns[i].setAttribute('aria-pressed', Snd.muted ? 'true' : 'false');
      muteBtns[i].setAttribute('aria-label', Snd.muted ? '소리 켜기' : '소리 끄기');
    }
  }
  function toggleMute() {
    Snd.setMuted(!Snd.muted);
    applyMuteUI();
    if (!Snd.muted && G.screen === 'play' && !G.over) Snd.bgmStart();
  }
  for (var mb = 0; mb < muteBtns.length; mb++) if (muteBtns[mb]) muteBtns[mb].addEventListener('click', toggleMute);

  /* 표정 도감 */
  function openGallery() {
    if (!galGrid.childNodes.length) {
      for (var i = 0; i < FACES.length; i++) {
        var cell = document.createElement('div');
        cell.className = 'galitem';
        var svg = makeFaceSvg(FACES[i].k, 'faceSvg mini');
        cell.appendChild(svg);
        var lab = document.createElement('span');
        lab.textContent = FACES[i].n;
        cell.appendChild(lab);
        galGrid.appendChild(cell);
      }
    }
    gallery.hidden = false;
    requestAnimationFrame(function () { gallery.classList.add('show'); });
  }
  function closeGallery() {
    gallery.classList.remove('show');
    gallery.hidden = true;
  }
  facesBtn.addEventListener('click', openGallery);
  galClose.addEventListener('click', closeGallery);
  gallery.addEventListener('click', function (e) { if (e.target === gallery) closeGallery(); });

  /* 첫 터치에 오디오 열기 */
  document.addEventListener('pointerdown', function () {
    Snd.resume();
    if (G.screen === 'play' && !G.over && !Snd.muted) Snd.bgmStart();
  }, { passive: true });

  /* ============================================================
     14. 테스트 API
     ============================================================ */
  window.__questionsOnly = {
    version: 2,
    get errors() { return errors.slice(); },
    get state() {
      return {
        screen: G.screen, mode: G.mode, stage: G.stageId,
        qIndex: G.idx, total: G.mode === 'relay' ? 0 : G.queue.length,
        streak: G.streak, best: G.best, hits: G.hits, cycle: G.cycle,
        over: G.over, result: G.result, answered: G.answered,
        roundMs: G.roundMs, msLeft: Math.round(G.msLeft),
        clock: clockEl.textContent,
        correct: G.correct,
        cards: G.cards.map(function (c) { return { kind: c.t, text: c.text }; }),
        taunt: tauntEl.textContent,
        face: faceEl.getAttribute('data-f'),
        progress: stageProg.textContent,
        toast: toastEl.classList.contains('show') ? toastEl.textContent : '',
        overlay: !overlay.hidden,
        ovTitle: ovTitle.textContent,
        muted: Snd.muted, bgm: Snd.bgmOn,
        expert: G.expert
      };
    },
    pick: pick,
    pickCorrect: function () { return pick(G.correct); },
    pickWrong: function () {
      for (var i = 0; i < G.cards.length; i++) if (i !== G.correct) return pick(i);
      return false;
    },
    startStage: startStage,
    startRelay: startRelay,
    home: showHome,
    reset: function () { if (G.mode === 'relay') startRelay(); else startStage(G.stageId); },
    forceTimeout: function () { if (!G.over && G.screen === 'play') { G.answered = true; stopClock(); fail('timeout'); return true; } return false; },
    setMuted: function (m) { Snd.setMuted(m); applyMuteUI(); if (!m && G.screen === 'play' && !G.over) Snd.bgmStart(); },
    toggleMute: toggleMute,
    rms: function () { return Math.round(Snd.rms() * 1000000) / 1000000; },
    get sound() { return JSON.parse(JSON.stringify(Snd.stats)); },
    faceName: function () { return faceEl.getAttribute('data-f'); },
    openGallery: openGallery,
    closeGallery: closeGallery,
    galleryCount: function () { return galGrid.children.length; },
    get faces() { return FACES.map(function (f) { return f.k; }); },
    get sets() { return SETS; },
    get stages() { return STAGES.map(function (s) { return s.id; }); },
    get totalSets() { return TOTAL_SETS; }
  };

  /* ============================================================
     15. 시작
     ============================================================ */
  homeFace.appendChild(makeFaceSvg('curious'));
  ovFace.appendChild(makeFaceSvg('smug'));
  applyMuteUI();
  refreshHome();
  if (params.get('stagex')) startStage(params.get('stagex'));
  else if (params.get('relay') === '1') startRelay();
})();
</script>
</body>
