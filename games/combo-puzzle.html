<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>호야의 콤보 퍼즐 — 광고·결제 없는 12간지 매치3 힐링 게임</title>
<meta name="description" content="같은 캐릭터 3개를 한 줄로 맞추면 팡! 옆 칸끼리 손가락으로 밀어 바꾸는 매치3 퍼즐입니다. 12간지·보석·과일 테마, 연쇄 콤보, 줄 폭탄과 무지개 별. 광고·추적기·외부 요청 없이 파일 하나로 도는 무료 힐링 게임.">
<meta name="theme-color" content="#FFF2F6">
<meta name="color-scheme" content="light">
<meta name="robots" content="index,follow">
<style>
/* ===== 호야의 콤보 퍼즐 · 애니팡 스타일 매치3 ===== */
:root{
  --ink:#4A3B40;
  --muted:#9C868D;
  --line:rgba(122,92,102,.10);
  --card:#FFFFFF;
  --pink:#FF7FA8;
  --pink-soft:#FFE3EC;
  --cream:#FFF4E8;
  --shadow:0 10px 24px -14px rgba(150,110,125,.55);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕",system-ui,"Segoe UI",Roboto,sans-serif;
  background:
    radial-gradient(120% 70% at 50% -10%, #FFF2F6 0%, #FFE9F0 32%, #FFF5EC 66%, #FFFAF4 100%);
  overflow:hidden;
  -webkit-text-size-adjust:100%;
}
body::before,body::after{
  content:"";position:fixed;border-radius:50%;filter:blur(46px);opacity:.55;pointer-events:none;z-index:0;
}
body::before{width:300px;height:300px;left:-90px;top:-60px;background:#FFD9E6}
body::after{width:320px;height:320px;right:-120px;bottom:-120px;background:#FFE7C9}

.app{
  position:relative;z-index:1;
  height:100dvh;
  max-width:520px;margin:0 auto;
  padding:calc(8px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
}

/* ---------- 상단 ---------- */
.top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.mascot{
  width:48px;height:48px;flex:0 0 auto;border:0;padding:0;cursor:pointer;
  border-radius:16px;background:linear-gradient(160deg,#fff,#FFEFF4);
  box-shadow:0 6px 14px -8px rgba(160,110,130,.7),inset 0 0 0 1px rgba(255,255,255,.9);
  display:grid;place-items:center;overflow:hidden;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
}
.mascot:active{transform:scale(.94)}
.mascot img{width:112%;height:112%;object-fit:contain;margin-top:2px}
.ttl{flex:1 1 auto;min-width:0}
.ttl h1{
  margin:0;font-size:19px;line-height:1.2;letter-spacing:-.5px;font-weight:800;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ttl p{margin:2px 0 0;font-size:11px;color:var(--muted);letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gear{
  width:40px;height:40px;flex:0 0 auto;border:0;border-radius:14px;cursor:pointer;font-size:17px;
  background:linear-gradient(160deg,#fff,#FFF3F6);
  box-shadow:0 6px 14px -8px rgba(160,110,130,.7),inset 0 0 0 1px rgba(255,255,255,.9);
  transition:transform .15s;
}
.gear:active{transform:scale(.93)}

/* ---------- 말풍선 ---------- */
.say{
  flex:0 0 auto;display:flex;align-items:center;gap:7px;
  margin:0;padding:7px 12px;border-radius:14px;
  background:rgba(255,255,255,.82);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 6px 14px -12px rgba(150,110,125,.6);
  font-size:11.5px;color:#6E585F;letter-spacing:-.2px;line-height:1.35;
}
.say i{width:7px;height:7px;border-radius:50%;background:#7ED9A6;flex:0 0 auto;box-shadow:0 0 0 3px rgba(126,217,166,.22)}
.say span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- 점수판 ---------- */
.hud{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:linear-gradient(180deg,#fff,#FFFAFB);
  border-radius:18px;padding:6px 4px;
  box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.9);
}
.hud .h{position:relative;text-align:center;padding:1px 2px}
.hud .h+.h::before{content:"";position:absolute;left:0;top:16%;height:68%;width:1px;background:var(--line)}
.hud small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:-.2px;margin-bottom:1px}
.hud b{display:block;font-size:16px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.hud b.hot{color:#F0699A}
.hud .h.warn b{color:#E2574C}

/* ---------- 보드 ---------- */
.boardwrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;padding:2px 0}
.board{
  position:relative;border-radius:26px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FFF4F7 100%);
  padding:10px;
  box-shadow:
    0 16px 30px -20px rgba(150,105,125,.75),
    inset 0 0 0 1px rgba(255,255,255,.95),
    inset 0 3px 8px rgba(214,165,182,.20);
  touch-action:none;user-select:none;-webkit-user-select:none;
  overflow:hidden;
}
.cells{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:6px;width:100%;height:100%}
.cell{
  border-radius:14px;
  background:linear-gradient(180deg,rgba(255,243,246,.85),rgba(255,232,239,.6));
  box-shadow:inset 0 1px 2px rgba(255,255,255,.95),inset 0 -2px 3px rgba(199,158,173,.10);
}
.layer,.fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.fx{z-index:6}

/* ---------- 타일 ---------- */
.t{position:absolute;left:0;top:0;will-change:transform;z-index:2}
.ti{
  position:absolute;inset:3.5%;border-radius:24%;
  display:grid;place-items:center;
  background:linear-gradient(160deg,#FFFFFF 12%,var(--tt,#FDEFF4) 100%);
  box-shadow:
    0 2px 1px rgba(255,255,255,.95) inset,
    0 -3px 7px rgba(184,136,154,.16) inset,
    0 5px 9px -5px rgba(140,98,114,.45);
  transition:transform .16s cubic-bezier(.34,1.56,.64,1),box-shadow .16s;
  overflow:hidden;
}
.t .art{width:100%;height:100%;display:grid;place-items:center;pointer-events:none}
.t .art img{width:88%;height:88%;object-fit:contain;-webkit-user-drag:none;filter:drop-shadow(0 2px 2px rgba(120,74,92,.16))}
.t .art svg{width:86%;height:86%;filter:drop-shadow(0 2px 2px rgba(120,74,92,.16))}
.t.sel{z-index:4}
.t.sel .ti{transform:scale(1.10);box-shadow:0 0 0 3px rgba(255,116,160,.75),0 8px 14px -8px rgba(150,80,110,.7)}
.t.hint .ti{animation:hintPulse 1.05s ease-in-out infinite}
@keyframes hintPulse{
  0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,178,96,0),0 5px 9px -5px rgba(140,98,114,.45)}
  50%{transform:scale(1.09);box-shadow:0 0 0 4px rgba(255,190,110,.62),0 8px 14px -8px rgba(150,80,110,.6)}
}
.t.pop{z-index:5}
.t.pop .ti{animation:popOut .26s cubic-bezier(.34,1.7,.5,1) forwards}
@keyframes popOut{
  0%{transform:scale(1)}
  38%{transform:scale(1.26);filter:brightness(1.16)}
  100%{transform:scale(.08);opacity:0}
}
.t.born .ti{animation:bornIn .3s cubic-bezier(.34,1.6,.5,1)}
@keyframes bornIn{0%{transform:scale(.4);opacity:.2}100%{transform:scale(1);opacity:1}}
.t.bad .ti{animation:shake .28s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}60%{transform:translateX(4px)}}

/* 특수 블록 */
.t.sp-row .ti::after,.t.sp-col .ti::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  mix-blend-mode:overlay;opacity:1;z-index:3;
}
.t.sp-row .ti::after{background:repeating-linear-gradient(180deg,rgba(255,255,255,.98) 0 3.5px,rgba(150,90,120,.18) 3.5px 4.2px,transparent 4.2px 10px)}
.t.sp-col .ti::after{background:repeating-linear-gradient(90deg,rgba(255,255,255,.98) 0 3.5px,rgba(150,90,120,.18) 3.5px 4.2px,transparent 4.2px 10px)}
.t.sp-row .ti,.t.sp-col .ti{box-shadow:0 0 0 2.5px rgba(255,190,120,.95) inset,0 0 14px rgba(255,186,96,.85),0 5px 9px -5px rgba(140,98,114,.45)}
.t.sp-row .art,.t.sp-col .art{opacity:.92}
.t.sp-star .ti{
  background:conic-gradient(from 0deg,#FF9EC4,#FFD37A,#A8E6A3,#8ED7F0,#B9A6F5,#FF9EC4);
  animation:spin 6s linear infinite;
  box-shadow:0 0 0 2.5px rgba(255,255,255,.95) inset,0 0 18px rgba(255,170,210,.9),0 5px 9px -5px rgba(140,98,114,.45);
}
@keyframes spin{to{transform:rotate(360deg)}}
.t.sp-star .art{display:none}
.t.sp-star .ti::before{
  content:"";position:absolute;z-index:3;inset:0;margin:auto;width:56%;height:56%;
  background:#fff;
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  filter:drop-shadow(0 1px 2px rgba(120,70,120,.45));
}
.t.sp-star .ti::after{
  content:"";position:absolute;inset:16%;border-radius:50%;z-index:1;
  background:radial-gradient(circle,rgba(255,255,255,.55),rgba(255,255,255,0) 72%);
}

/* ---------- 콤보 배너 · 토스트 ---------- */
.banner{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);
  padding:7px 16px;border-radius:999px;z-index:7;pointer-events:none;opacity:0;
  font-weight:900;font-size:17px;letter-spacing:-.6px;color:#fff;white-space:nowrap;
  background:linear-gradient(135deg,#FF7FA8,#FFA45C);
  box-shadow:0 10px 22px -10px rgba(230,110,150,.9),0 0 0 3px rgba(255,255,255,.55);
  text-shadow:0 2px 6px rgba(180,80,120,.35);
}
.banner.show{animation:bannerPop .82s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes bannerPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  22%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  35%{transform:translate(-50%,-50%) scale(1)}
  75%{opacity:1;transform:translate(-50%,-62%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-92%) scale(.92)}
}
.plus{
  position:absolute;z-index:7;pointer-events:none;
  font-weight:900;font-size:14px;color:#fff;letter-spacing:-.4px;
  text-shadow:0 2px 6px rgba(210,90,130,.75),0 0 2px rgba(210,90,130,.6);
  animation:plusUp .68s ease-out forwards;
}
@keyframes plusUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}25%{opacity:1;transform:translate(-50%,-70%) scale(1.06)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.toast{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:700;color:#6E585F;
  background:rgba(255,255,255,.95);box-shadow:0 8px 18px -10px rgba(150,110,125,.8);
  opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:7;white-space:nowrap;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-2px)}

/* ---------- 버튼 줄 ---------- */
.acts{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.act{
  position:relative;border:0;cursor:pointer;
  padding:9px 4px 8px;border-radius:16px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:-.3px;color:#6B555C;
  background:linear-gradient(180deg,#fff,#FFF6F8);
  box-shadow:0 7px 16px -12px rgba(150,110,125,.85),inset 0 0 0 1px rgba(255,255,255,.95);
  transition:transform .14s,box-shadow .14s;
}
.act span{font-size:15px;line-height:1}
.act:active{transform:translateY(1px) scale(.97)}
.act i{
  position:absolute;top:4px;right:6px;font-style:normal;font-size:9px;font-weight:800;
  min-width:14px;height:14px;line-height:14px;border-radius:9px;text-align:center;
  background:#FFE0EA;color:#D9548A;
}
.act-main{background:linear-gradient(160deg,#FFFFFF,#FFE9F0);color:#C7507F}
.act[disabled]{opacity:.42}

/* ---------- 범례 ---------- */
.legend{flex:0 0 auto;display:flex;justify-content:center;gap:5px;flex-wrap:nowrap;overflow:hidden}
.lg{
  display:flex;flex-direction:column;align-items:center;gap:1px;
  font-size:9px;color:var(--muted);letter-spacing:-.3px;min-width:0;
}
.lg .b{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;overflow:hidden;
  background:linear-gradient(160deg,#fff,var(--tt,#FDEFF4));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 3px 6px -4px rgba(150,110,125,.8);
}
.lg .b img{width:96%;height:96%;object-fit:contain}
.lg .b svg{width:92%;height:92%}

/* ---------- 12간지 띠 ---------- */
.zstrip{flex:0 0 auto;padding:6px 8px 7px;border-radius:18px;background:rgba(255,255,255,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9)}
.zsh{display:block;font-size:9.5px;color:#B08D9A;letter-spacing:-.2px;margin:0 2px 4px;font-weight:800}
.zsh small{font-weight:600;color:#C3AEB7;margin-left:3px}

/* ---------- 시트(설정) ---------- */
.veil{
  position:fixed;inset:0;z-index:40;background:rgba(74,50,60,.34);
  opacity:0;pointer-events:none;transition:opacity .22s;backdrop-filter:blur(2px)
}
.veil.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:41;
  max-width:520px;margin:0 auto;max-height:84dvh;overflow:auto;
  padding:14px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius:26px 26px 0 0;background:#fff;
  box-shadow:0 -18px 40px -20px rgba(120,80,95,.6);
  transform:translateY(102%);transition:transform .28s cubic-bezier(.2,.9,.3,1);
  visibility:hidden;
}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sheet header b{font-size:15px;letter-spacing:-.4px}
.sheet .x
{width:34px;height:34px;border:0;border-radius:11px;background:#FFF1F5;color:#B26A88;font-size:14px;cursor:pointer}
.sech{font-size:11px;font-weight:800;color:#B08D9A;letter-spacing:-.2px;margin:14px 2px 7px}
.themecards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tcard{
  border:0;cursor:pointer;font-family:inherit;padding:9px 4px;border-radius:16px;min-width:0;
  background:linear-gradient(180deg,#fff,#FFF7F9);
  box-shadow:inset 0 0 0 1px rgba(233,205,215,.9);
  display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:11px;font-weight:700;color:#6B555C;letter-spacing:-.3px;
}
.tcard .row{display:flex;gap:2px;max-width:100%}
.tcard .row .b{width:15px;height:15px;flex:0 0 15px;border-radius:5px;display:grid;place-items:center;overflow:hidden;background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.tcard .row .b img,.tcard .row .b svg{width:96%;height:96%;object-fit:contain}
.tcard.on{box-shadow:inset 0 0 0 2px #FF8FB4,0 8px 18px -12px rgba(220,90,140,.9);background:linear-gradient(180deg,#fff,#FFEFF4)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.chip{
  border:0;cursor:pointer;font-family:inherit;padding:10px 6px;border-radius:14px;font-size:11.5px;font-weight:700;
  color:#6B555C;background:linear-gradient(180deg,#fff,#FFF7F9);letter-spacing:-.3px;
  box-shadow:inset 0 0 0 1px rgba(233,205,215,.9);
}
.chip.on{background:linear-gradient(160deg,#FFEAF1,#FFDCE8);color:#C7507F;box-shadow:inset 0 0 0 2px #FF9DBD}
.chip small{display:block;font-weight:600;font-size:9.5px;color:#B08D9A;margin-top:2px}
.zall{display:grid;grid-template-columns:repeat(6,1fr);gap:4px 3px}
.za{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:8px;color:#B39AA4;letter-spacing:-.3px;min-width:0}
.za .b{width:100%;max-width:34px;aspect-ratio:1/1;border-radius:10px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(160deg,#fff,var(--tt,#fff));box-shadow:inset 0 0 0 1px rgba(233,205,215,.9),0 3px 6px -4px rgba(150,110,125,.7);opacity:.52}
.za .b img{width:96%;height:96%;object-fit:contain}
.za .b svg{width:92%;height:92%;object-fit:contain}
.za.on .b{opacity:1;box-shadow:inset 0 0 0 2px #FF9DBD,0 3px 6px -4px rgba(150,110,125,.7)}
.za.on span{color:#C7507F;font-weight:800}
.sheet .warn{width:100%;margin-top:16px;border:0;cursor:pointer;font-family:inherit;padding:12px;border-radius:14px;font-size:12px;font-weight:700;color:#A8574A;background:#FFF0EC}

/* ---------- 모달 ---------- */
.modal{
  position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;
  background:rgba(74,50,60,.36);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .24s;
}
.modal.on{opacity:1;pointer-events:auto}
.mcard{
  width:100%;max-width:340px;border-radius:26px;background:#fff;padding:20px 18px 16px;text-align:center;
  box-shadow:0 30px 60px -30px rgba(110,70,85,.85);transform:translateY(10px) scale(.98);transition:transform .24s
}
.modal.on .mcard{transform:translateY(0) scale(1)}
.mface{width:74px;height:74px;margin:0 auto 8px;border-radius:24px;display:grid;place-items:center;
  background:linear-gradient(160deg,#FFFAF0,#FFE8F0);box-shadow:inset 0 0 0 1px rgba(255,255,255,.9),0 10px 20px -14px rgba(170,110,135,.9)}
.mface img{width:84%;height:84%;object-fit:contain}
.mcard h2{margin:2px 0 6px;font-size:18px;letter-spacing:-.6px}
.mcard p{margin:0 0 14px;font-size:12px;line-height:1.6;color:#7A626A;letter-spacing:-.2px}
.mmodes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.mmode{
  border:0;cursor:pointer;font-family:inherit;padding:9px 4px;border-radius:13px;font-size:11px;font-weight:800;color:#7A626A;
  background:#FFF6F9;box-shadow:inset 0 0 0 1px rgba(240,214,223,.9);letter-spacing:-.3px
}
.mmode small{display:block;font-weight:600;font-size:9px;color:#B08D9A;margin-top:2px}
.mmode.on{background:linear-gradient(160deg,#FFE9F1,#FFD9E7);color:#C7507F;box-shadow:inset 0 0 0 2px #FF9DBD}
.big,.soft{
  width:100%;border:0;cursor:pointer;font-family:inherit;border-radius:15px;font-weight:800;letter-spacing:-.4px;
}
.big{padding:13px;font-size:14.5px;color:#fff;background:linear-gradient(135deg,#FF7FA8,#FFA45C);box-shadow:0 12px 24px -14px rgba(230,110,150,.95);margin-bottom:8px}
.soft{padding:11px;font-size:12.5px;color:#7A626A;background:#FFF3F7}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:0 0 16px;padding:10px 4px;border-radius:16px;background:#FFF8FA;font-size:10.5px;color:#9C868D}
.mstats b{display:block;font-size:19px;color:#4A3B40;letter-spacing:-.6px;margin-top:2px;font-weight:800}
.mstats span+span{border-left:1px solid rgba(200,170,185,.35)}

@media (max-height:700px){
  .say{display:none}
  .legend{display:none}
  .ttl p{display:none}
}
@media (max-width:350px){
  .legend .lg:nth-child(n+5){display:none}
}

</style>
</head>
<body>

<main class="app">

  <header class="top">
    <button class="mascot" id="mascotBtn" type="button" aria-label="테마와 설정 열기"><img id="mascotImg" src="" alt="호야"></button>
    <div class="ttl">
      <h1>호야의 콤보 퍼즐</h1>
      <p>같은 친구 셋을 한 줄로! 손가락으로 밀어 바꿔요</p>
    </div>
    <button class="gear" id="gearBtn" type="button" aria-label="설정 열기">⚙️</button>
  </header>

/* ---------- 유틸 ---------- */
function ix(r,c){ return r*N+c; }
function rc(k){ return { r:(k/N)|0, c:k%N }; }
function T(r,c){ return (r<0||c<0||r>=N||c>=N)? null : grid[ix(r,c)]; }
function wait(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
function rndType(){ return Math.floor(Math.random()*6); }
function themeNow(){ return THEMES[S.theme]; }

/* ---------- 레이아웃 ---------- */
var cellsBuilt = false;

  cellsEl.innerHTML = '';

function layout(){

function cellXY(r,c){ return { x: geo.x0 + c*(geo.cell+geo.gap), y: geo.y0 + r*(geo.cell+geo.gap) }; }

/* ---------- 타일 ---------- */
function artFor(t){

function moveEl(t, r, c, dur){

function mount(t, r, c, fromR, dur){

    void el.offsetHeight;

}

/* ---------- 보드 생성 ---------- */
function wouldMatch(r,c,type){
  if(T(r,c-1) && T(r,c-2) && T(r,c-1).type===type && T(r,c-2).type===type) return true;
  if(T(r-1,c) && T(r-2,c) && T(r-1,c).type===type && T(r-2,c).type===type) return true;
  return false;
}
function buildGrid(){
  var guard = 0;
  do{
    clearLayer();
    grid = new Array(N*N).fill(null);
    for(var r=0;r<N;r++){
      for(var c=0;c<N;c++){
        var ty, tries=0;
        do{ ty = rndType(); tries++; }while(wouldMatch(r,c,ty) && tries<30);
        var t = { id: ++uid, type: ty, sp: null, r: r, c: c };
        grid[ix(r,c)] = t;
      }
    }
    guard++;
  }while(!findMove() && guard<40);
  for(var k=0;k<grid.length;k++){
    var tile = grid[k]; if(!tile) continue;
    var el = createEl(tile);
    el.classList.add('born');
    el.style.width = geo.cell+'px'; el.style.height = geo.cell+'px';
    var p = cellXY(tile.r, tile.c);
    el.style.transition = 'none';
    el.style.transform = 'translate3d('+p.x+'px,'+p.y+'px,0)';
    layer.appendChild(el);
    (function(e){ setTimeout(function(){ e.classList.remove('born'); }, 320); })(el);
  }
}
function clearLayer(){
  tileEls.forEach(function(el){ if(el.parentNode) el.parentNode.removeChild(el); });
  tileEls.clear();
  layer.innerHTML = '';
}

/* ---------- 매치 탐색 ---------- */
function findRuns(){
  var runs = [];
  for(var r=0;r<N;r++){
    var c=0;
    while(c<N){
      var t = T(r,c), ty = t? t.type : -9, e=c;
      if(ty>=0){
        while(e+1<N && T(r,e+1) && T(r,e+1).type===ty) e++;
      }
      if(ty>=0 && e-c+1>=3) runs.push({ dir:'h', r:r, c0:c, c1:e, len:e-c+1, type:ty });
      c = e+1;
    }
  }
  for(var c2=0;c2<N;c2++){
    var r2=0;
    while(r2<N){
      var t2 = T(r2,c2), ty2 = t2? t2.type : -9, e2=r2;
      if(ty2>=0){
        while(e2+1<N && T(e2+1,c2) && T(e2+1,c2).type===ty2) e2++;
      }
      if(ty2>=0 && e2-r2+1>=3) runs.push({ dir:'v', r0:r2, r1:e2, c:c2, len:e2-r2+1, type:ty2 });
      r2 = e2+1;
    }
  }
  return runs;
}
function runKeys(run){
  var out=[];
  if(run.dir==='h'){ for(var c=run.c0;c<=run.c1;c++) out.push(ix(run.r,c)); }
  else { for(var r=run.r0;r<=run.r1;r++) out.push(ix(r,run.c)); }
  return out;
}
function planClears(runs, pref){
  var clears = new Set(), make = new Map();
  var hMap = new Map(), vMap = new Map();
  runs.forEach(function(run){
    runKeys(run).forEach(function(k){ (run.dir==='h'? hMap : vMap).set(k, run); });
  });
  var cross = [];
  hMap.forEach(function(v,k){ if(vMap.has(k)) cross.push(k); });
  cross.forEach(function(k){ make.set(k,'star'); });
  function pick(keys){
    if(pref!=null && keys.indexOf(pref)>=0) return pref;
    return keys[(keys.length/2)|0];
  }
  runs.forEach(function(run){
    var keys = runKeys(run);
    var hasStar = keys.some(function(k){ return make.get(k)==='star'; });
    if(hasStar) return;
    var occupied = keys.filter(function(k){ return make.has(k); });
    if(occupied.length) return;
    if(run.len>=5){ var p1 = pick(keys); make.set(p1,'star'); return; }
    if(run.len===4){ var p2 = pick(keys); make.set(p2, run.dir==='h'? 'row':'col'); return; }
  });
  runs.forEach(function(run){ runKeys(run).forEach(function(k){ clears.add(k); }); });
  make.forEach(function(sp,k){ clears.delete(k); });
  return { clears: clears, make: make };
}

/* ---------- 특수 블록 연쇄 ---------- */
function mostCommonType(){
  var cnt=[0,0,0,0,0,0];
  grid.forEach(function(t){ if(t && t.type>=0) cnt[t.type]++; });
  var best=0;
  for(var i=1;i<6;i++) if(cnt[i]>cnt[best]) best=i;
  return best;
}
function expandSpecials(set, starColor){
  var queue = Array.from(set), seen = new Set(set);
  var guard = 0;
  while(queue.length && guard++ < 400){
    var k = queue.pop();
    var t = grid[k];
    if(!t || !t.sp) continue;
    var add = [];
    var p = rc(k);
    if(t.sp==='row'){ for(var c=0;c<N;c++) if(grid[ix(p.r,c)]) add.push(ix(p.r,c)); }
    else if(t.sp==='col'){ for(var r=0;r<N;r++) if(grid[ix(r,p.c)]) add.push(ix(r,p.c)); }
    else if(t.sp==='star'){
      var color = (starColor!=null && starColor>=0)? starColor : mostCommonType();
      for(var q=0;q<grid.length;q++){ if(grid[q] && grid[q].type===color) add.push(q); }
    }
    add.forEach(function(a){
      if(!seen.has(a)){ seen.add(a); set.add(a); queue.push(a); }
    });
  }
}

/* ---------- 파티클 ---------- */
var parts = [], praf = 0, lastT = 0, fxW = 300, fxH = 300, dpr = 1;
function resizeFx(){
  var r = board.getBoundingClientRect();
  dpr = Math.min(2, window.devicePixelRatio||1);
  fxW = r.width; fxH = r.height;
  fx.width = Math.round(fxW*dpr); fx.height = Math.round(fxH*dpr);
  fx.style.width = fxW+'px'; fx.style.height = fxH+'px';
}
function burst(x, y, color, n){
  n = n||10;
  for(var i=0;i<n;i++){
    var a = Math.random()*Math.PI*2, sp = 55+Math.random()*170;
    parts.push({ x:x, y:y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-45,
                 life:0, ttl:0.40+Math.random()*0.17, r:2+Math.random()*3.4, c:color });
  }
  if(parts.length>340) parts = parts.slice(-340);
  if(!praf){ lastT = 0; praf = requestAnimationFrame(fxLoop); }
}
function fxLoop(ts){
  if(!lastT) lastT = ts;
  var dt = Math.min(0.05, (ts-lastT)/1000); lastT = ts;
  var g = fx.getContext('2d');
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,fxW,fxH);
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.life += dt;
    if(p.life >= p.ttl){ parts.splice(i,1); continue; }
    p.vy += 620*dt; p.vx *= 0.985;
    p.x += p.vx*dt; p.y += p.vy*dt;
    var k = 1 - p.life/p.ttl;
    g.globalAlpha = Math.max(0, k);
    g.fillStyle = p.c;
    g.beginPath(); g.arc(p.x, p.y, p.r*(0.5+k*0.7), 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
  if(parts.length){ praf = requestAnimationFrame(fxLoop); }
  else { praf = 0; g.clearRect(0,0,fxW,fxH); lastT = 0; }
}

/* ---------- 소리 ---------- */
var AC = null, muted = false;
function actx(){
  if(AC) return AC;
  try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; }
  return AC;
}
function unlockAudio(){
  var c = actx();
  if(c && c.state !== 'running'){ try{ c.resume(); }catch(e){} }
}
function tone(f, f2, dur, type, vol, delay){
  if(muted) return;
  var c = actx(); if(!c) return;
  var t0 = c.currentTime + (delay||0);
  var o = c.createOscillator(), g = c.createGain();
  o.type = type||'sine';
  o.frequency.setValueAtTime(f, t0);
  if(f2 && f2!==f) o.frequency.exponentialRampToValueAtTime(Math.max(40,f2), t0+dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol||0.14, t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0008, t0+dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0+dur+0.03);
}
function noiseBurst(dur, vol, freq){
  if(muted) return;
  var c = actx(); if(!c) return;
  var len = Math.max(1, Math.floor(c.sampleRate*dur));
  var buf = c.createBuffer(1, len, c.sampleRate);
  var d = buf.getChannelData(0);
  for(var i=0;i<len;i++){ var k = 1 - i/len; d[i] = (Math.random()*2-1)*k*k; }
  var src = c.createBufferSource(); src.buffer = buf;
  var flt = c.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = freq||900;
  var g = c.createGain(); g.gain.value = vol||0.18;
  src.connect(flt); flt.connect(g); g.connect(c.destination);
  src.start();
}
var PACKS = {
  basic: { pop:function(m){ tone(760*m, 540*m, 0.13, 'triangle', 0.16); } },
  cat:   { pop:function(m){ tone(540*m, 900*m, 0.09, 'sine', 0.13); tone(900*m, 600*m, 0.19, 'sine', 0.12, 0.08); } },
  dog:   { pop:function(m){ tone(240*m, 150*m, 0.12, 'triangle', 0.18); noiseBurst(0.09, 0.14, 700); } },
  drop:  { pop:function(m){ tone(1500*m, 620*m, 0.16, 'sine', 0.13); tone(2100*m, 1400*m, 0.09, 'sine', 0.05, 0.04); } },
  gem:   { pop:function(m){ var r=[1,1.26,1.59]; for(var i=0;i<3;i++) tone(880*m*r[i], 880*m*r[i], 0.12, 'triangle', 0.09, i*0.045); } },
  mute:  { pop:function(){} }
};
function sfx(kind, opt){
  if(muted) return;
  var pack = PACKS[S.sound] || PACKS.basic;
  if(kind==='pop'){ pack.pop(1 + Math.min(0.8, ((opt&&opt.combo)||1)*0.09 - 0.09)); }
  else if(kind==='bad'){ tone(200, 130, 0.11, 'sawtooth', 0.08); }
  else if(kind==='special'){ tone(660, 1320, 0.16, 'triangle', 0.12); tone(990, 1980, 0.18, 'sine', 0.09, 0.07); }
  else if(kind==='shuffle'){ noiseBurst(0.34, 0.12, 1500); tone(320, 720, 0.3, 'sine', 0.07); }
  else if(kind==='over'){ tone(520, 300, 0.22, 'triangle', 0.12); tone(390, 210, 0.3, 'triangle', 0.1, 0.16); }
}

function showPlus(x, y, txt){

  board.appendChild(d);

}
var toastT = 0;

/* ---------- 점수 ---------- */
function addScore(n){ S.score += n; if(S.score > S.best){ S.best = S.score; } updateHud(); }

/* ---------- 한 판 흐름 ---------- */
var hist = [];
function snapshot(){
  var cells = grid.map(function(t){ return t? { type:t.type, sp:t.sp } : null; });
  return { cells:cells, score:S.score, moves:S.moves, time:S.time, comboBest:S.comboBest, swapCount:S.swapCount };
}
function pushHist(){
  hist.push(snapshot());
  if(hist.length>8) hist.shift();
  updateHud();
}
function restore(snap){
  clearLayer();
  grid = new Array(N*N).fill(null);
  snap.cells.forEach(function(o,k){
    if(!o) return;
    var p = rc(k);
    var t = { id:++uid, type:o.type, sp:o.sp, r:p.r, c:p.c };
    grid[k] = t;
    var el = createEl(t);
    el.style.width = geo.cell+'px'; el.style.height = geo.cell+'px';
    var xy = cellXY(p.r,p.c);
    el.style.transition='none';
    el.style.transform = 'translate3d('+xy.x+'px,'+xy.y+'px,0)';
    layer.appendChild(el);
  });
  S.score = snap.score; S.moves = snap.moves; S.time = snap.time;
  S.comboBest = snap.comboBest; S.swapCount = snap.swapCount||0;
  S.combo = 0; S.over = false;
  updateHud();
}

function consumeMove(){
  if(S.mode==='moves') S.moves = Math.max(0, S.moves-1);
  updateHud();
}

function movePixels(k){
  var p = rc(k), xy = cellXY(p.r,p.c);
  return { x: xy.x + geo.cell/2, y: xy.y + geo.cell/2 };
}

async function runClears(set, combo, starColor, make){
  var all = new Set(set);
  expandSpecials(all, starColor);
  var madeCells = [];
  if(make){
    make.forEach(function(sp, k){
      var t = grid[k];
      if(!t) return;
      if(sp==='star'){ t.type = -1; t.sp = 'star'; }
      else { t.sp = sp; }
      var el = tileEls.get(t.id);
      if(el){ applyLook(t, el); el.classList.add('born');
        setTimeout(function(){ el.classList.remove('born'); }, 330); }
      all.delete(k);
      madeCells.push(k);
    });
    if(madeCells.length) sfx('special');
  }
  var popped = [];
  var sumX = 0, sumY = 0, cnt = 0;
  all.forEach(function(k){
    var t = grid[k]; if(!t) return;
    var el = tileEls.get(t.id); if(!el) return;
    var c = movePixels(k);
    burst(c.x, c.y, themeNow().col[t.type>=0? t.type : 3], 9 + Math.min(16, combo*3));
    el.classList.add('pop');
    popped.push({ el: el, t: t, k: k });
    sumX += c.x; sumY += c.y; cnt++;
  });
  if(!cnt) return;
  var gained = Math.round(cnt * 50 * combo / 10) * 10;
  addScore(gained);
  if(cnt>=3) showPlus(sumX/cnt, sumY/cnt, '+'+fmt(gained));
  sfx('pop', { combo: combo });
  var bt = null;
  if(make && make.size){
    make.forEach(function(sp){ bt = (sp==='star'? '무지개 별 ✨' : '줄 폭탄 💥')+' 완성!'; });
  } else if(combo>=2){ bt = '콤보 ×'+combo+' 팡!'; }
  else if(cnt>=7){ bt = '대박 팡!'; }
  if(bt) showBanner(bt);
  await wait(230);
  popped.forEach(function(o){
    if(o.el.parentNode) o.el.parentNode.removeChild(o.el);
    tileEls.delete(o.t.id);
    grid[o.k] = null;
  });
}

async function settle(){
  var maxDur = 0;
  for(var c=0;c<N;c++){
    var write = N-1;
    for(var r=N-1;r>=0;r--){
      var t = T(r,c);
      if(!t) continue;
      if(write!==r){
        grid[ix(write,c)] = t; grid[ix(r,c)] = null;
        var dur = 110 + (write-r)*26;
        if(dur>maxDur) maxDur = dur;
        moveEl(t, write, c, dur);
        t.r = write; t.c = c;
      }
      write--;
    }
    var spawnIdx = 0;
    for(var rr=write; rr>=0; rr--){
      var nt = { id: ++uid, type: rndType(), sp:null, r:rr, c:c };
      grid[ix(rr,c)] = nt;
      mount(nt, rr, c, rr-(write+1), 150 + (write-rr+1)*24);
      spawnIdx++;
      var d2 = 150 + (write-rr+1)*24;
      if(d2>maxDur) maxDur = d2;
    }
  }
  if(maxDur) await wait(maxDur+40);
}

async function resolveBoard(){
  var combo = 0;
  while(true){
    var runs = findRuns();
    if(!runs.length) break;
    combo++;
    var plan = planClears(runs, lastSwapKey());
    S.combo = combo;
    if(combo > S.comboBest) S.comboBest = combo;
    updateHud();
    await runClears(plan.clears, combo, null, plan.make);
    await settle();
  }
  S.combo = 0;
  updateHud();
  return combo;
}

var lastSwap = null;
function lastSwapKey(){ return lastSwap ? ix(lastSwap.r, lastSwap.c) : null; }

function adjacent(a,b){ return (Math.abs(a.r-b.r)+Math.abs(a.c-b.c))===1; }

async function trySwap(a,b){
  if(S.busy || S.over || !S.started) return false;
  if(!adjacent(a,b)) return false;
  var ta = T(a.r,a.c), tb = T(b.r,b.c);
  if(!ta || !tb) return false;
  S.busy = true; clearHint(); clearSel();
  pushHist();
  grid[ix(a.r,a.c)] = tb; grid[ix(b.r,b.c)] = ta;
  moveEl(ta, b.r, b.c, 140); moveEl(tb, a.r, a.c, 140);
  ta.r=b.r; ta.c=b.c; tb.r=a.r; tb.c=a.c;
  lastSwap = { r:b.r, c:b.c };
  await wait(150);

  var starSet = starCombo(a,b,ta,tb);
  if(starSet){
    consumeMove(); S.swapCount++;
    await runClears(starSet.clears, 1, starSet.color, null);
    await settle();
    await resolveBoard();
    await afterTurn();
    S.busy = false;
    return true;
  }
  if(!findRuns().length){
    grid[ix(a.r,a.c)] = ta; grid[ix(b.r,b.c)] = tb;
    moveEl(ta, a.r, a.c, 150); moveEl(tb, b.r, b.c, 150);
    ta.r=a.r; ta.c=a.c; tb.r=b.r; tb.c=b.c;
    var ea = tileEls.get(ta.id), eb = tileEls.get(tb.id);
    if(ea) ea.classList.add('bad');
    if(eb) eb.classList.add('bad');
    sfx('bad');
    await wait(200);
    if(ea) ea.classList.remove('bad');
    if(eb) eb.classList.remove('bad');
    hist.pop(); updateHud();
    S.busy = false;
    scheduleHint();
    return false;
  }
  consumeMove(); S.swapCount++;
  S.lastCombo = await resolveBoard();
  await afterTurn();
  S.busy = false;
  return true;
}

function starCombo(a,b,ta,tb){
  var sa = ta.sp==='star', sb = tb.sp==='star';
  if(!sa && !sb) return null;
  var clears = new Set();
  if(sa && sb){
    for(var k=0;k<grid.length;k++) if(grid[k]) clears.add(k);
    sfx('special');
    showBanner('더블 별! 전부 팡!');
    return { clears: clears, color: null };
  }
  var starCell = sa? b : a;
  var otherCell = sa? a : b;
  var other = sa? tb : ta;
  clears.add(ix(starCell.r, starCell.c));
  clears.add(ix(otherCell.r, otherCell.c));
  if(other.sp==='row' || other.sp==='col'){
    var p = otherCell;
    if(other.sp==='row'){ for(var c=0;c<N;c++) if(grid[ix(p.r,c)]) clears.add(ix(p.r,c)); }
    else { for(var r=0;r<N;r++) if(grid[ix(r,p.c)]) clears.add(ix(r,p.c)); }
  }
  var color = other.type;
  for(var q=0;q<grid.length;q++){ if(grid[q] && grid[q].type===color) clears.add(q); }
  sfx('special');
  showBanner('무지개 팡!');
  return { clears: clears, color: color };
}

async function afterTurn(){
  lastSwap = null;
  updateHud();
  if(checkOver()){ endGame(); return; }
  if(!findMove()){
    await wait(120);
    await shuffleBoard(true);
  }
  scheduleHint();
}

function checkOver(){
  if(!S.started) return false;
  if(S.mode==='moves') return S.moves<=0;
  if(S.mode==='time') return S.time<=0;
  return false;
}

function endGame(){
  S.over = true;

  updateHud();

  $('#overCombo').textContent = '×'+Math.max(1,S.comboBest);
  $('#overBest').textContent = fmt(S.best);

var hintTimer = 0, hinted = [];
function scheduleHint(){
  clearTimeout(hintTimer);
  hintTimer = setTimeout(function(){ showHint(); }, 3000);
}
function showHint(){
  if(S.busy || S.over || !S.started) return;
  var mv = findMove();
  if(!mv) return;
  clearHint();
  mv.forEach(function(p){
    var t = T(p.r,p.c); if(!t) return;

  });

  hinted = [];

/* ---------- 가능한 수 찾기 ---------- */
function typesGrid(){
  return grid.map(function(t){ return t? t.type : -9; });
}
function lineLen(a, r, c){
  var ty = a[ix(r,c)];
  if(ty<0) return 0;
  var n=1, i;
  for(i=c-1;i>=0 && a[ix(r,i)]===ty;i--) n++;
  for(i=c+1;i<N && a[ix(r,i)]===ty;i++) n++;
  return n;
}
function vertLen(a, r, c){
  var ty = a[ix(r,c)];
  if(ty<0) return 0;
  var n=1, i;
  for(i=r-1;i>=0 && a[ix(i,c)]===ty;i--) n++;
  for(i=r+1;i<N && a[ix(i,c)]===ty;i++) n++;
  return n;
}
function findMove(){
  var a = typesGrid();
  function ok(r,c){ return lineLen(a,r,c)>=3 || vertLen(a,r,c)>=3; }
  for(var r=0;r<N;r++){
    for(var c=0;c<N;c++){
      var t = T(r,c);
      if(t && t.sp==='star'){
        if(c+1<N) return [{r:r,c:c},{r:r,c:c+1}];
        if(r+1<N) return [{r:r,c:c},{r:r+1,c:c}];
      }
      if(c+1<N){
        var k1=ix(r,c), k2=ix(r,c+1);
        var tmp=a[k1]; a[k1]=a[k2]; a[k2]=tmp;
        var good = ok(r,c) || ok(r,c+1);
        tmp=a[k1]; a[k1]=a[k2]; a[k2]=tmp;
        if(good) return [{r:r,c:c},{r:r,c:c+1}];
      }
      if(r+1<N){
        var k3=ix(r,c), k4=ix(r+1,c);
        var tmp2=a[k3]; a[k3]=a[k4]; a[k4]=tmp2;
        var good2 = ok(r,c) || ok(r+1,c);
        tmp2=a[k3]; a[k3]=a[k4]; a[k4]=tmp2;
        if(good2) return [{r:r,c:c},{r:r+1,c:c}];
      }
    }
  }
  return null;
}

/* ---------- 섞기 ---------- */
async function shuffleBoard(auto){
  if(S.busy && !auto) return;
  S.busy = true;
  clearHint(); clearSel();
  toast(auto? '움직일 곳이 없어 섞을게요' : '보드를 섞었어요');
  sfx('shuffle');
  tileEls.forEach(function(el){ el.classList.add('pop'); });
  await wait(230);
  clearLayer();
  grid = new Array(N*N).fill(null);
  var guard=0;
  do{
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      var ty, tries=0;
      do{ ty=rndType(); tries++; }while(wouldMatch(r,c,ty) && tries<30);
      grid[ix(r,c)] = { id:++uid, type:ty, sp:null, r:r, c:c };
    }
    guard++;
  }while((findRuns().length || !findMove()) && guard<40);
  for(var k=0;k<grid.length;k++){
    var t = grid[k];
    var el = createEl(t);
    el.classList.add('born');
    el.style.width = geo.cell+'px'; el.style.height = geo.cell+'px';
    var p = cellXY(t.r,t.c);
    el.style.transition='none';
    el.style.transform='translate3d('+p.x+'px,'+p.y+'px,0)';
    layer.appendChild(el);
    (function(e){ setTimeout(function(){ e.classList.remove('born'); }, 330); })(el);
  }
  await wait(260);
  S.busy = false;
  scheduleHint();
}

/* ---------- 입력 ---------- */
var drag = null, sel = null;
function boardPoint(e){
  var r = board.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
function pickCell(x,y){
  var c = Math.floor((x - geo.x0)/(geo.cell+geo.gap));
  var r = Math.floor((y - geo.y0)/(geo.cell+geo.gap));
  if(r<0||c<0||r>=N||c>=N) return null;
  return { r:r, c:c };
}
function clearSel(){
  if(sel){ var t=T(sel.r,sel.c); if(t){ var el=tileEls.get(t.id); if(el) el.classList.remove('sel'); } }
  sel = null;
}
function setSel(p){
  clearSel();
  sel = { r:p.r, c:p.c };
  var t = T(p.r,p.c); if(!t) { sel=null; return; }
  var el = tileEls.get(t.id); if(el) el.classList.add('sel');
}

board.addEventListener('pointerdown', function(e){
  if(e.button!==undefined && e.button>0) return;
  unlockAudio();
  if(S.busy || S.over || !S.started) return;
  var pt = boardPoint(e);
  var p = pickCell(pt.x, pt.y);
  if(!p || !T(p.r,p.c)) return;
  drag = { p:p, x:e.clientX, y:e.clientY, moved:false };
  clearHint();
  if(e.pointerType !== 'mouse'){ try{ e.preventDefault(); }catch(err){} }
}, { passive:false });

window.addEventListener('pointermove', function(e){
  if(!drag || drag.moved) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if(Math.abs(dx) < 18 && Math.abs(dy) < 18) return;
  drag.moved = true;
  var a = drag.p, b;
  if(Math.abs(dx) > Math.abs(dy)){ b = { r:a.r, c:a.c + (dx>0? 1 : -1) }; }
  else { b = { r:a.r + (dy>0? 1 : -1), c:a.c }; }
  if(b.r<0||b.c<0||b.r>=N||b.c>=N) return;
  if(!T(b.r,b.c)) return;
  trySwap(a, b);
});

function endDrag(e){
  if(!drag) return;
  var d = drag; drag = null;
  if(d.moved) return;
  var p = d.p;
  if(sel){
    if(sel.r===p.r && sel.c===p.c){ clearSel(); return; }
    if(adjacent(sel,p)){ var a = sel; clearSel(); trySwap(a, p); return; }
  }
  setSel(p);
}
window.addEventListener('pointerup', endDrag);
window.addEventListener('pointercancel', function(){ drag = null; });

document.addEventListener('keydown', function(e){

  var el = $('#themeCards');
  el.innerHTML = '';
  Object.keys(THEMES).forEach(function(key){
    var th = THEMES[key];
    var b = document.createElement('button');
    b.type='button'; b.className='tcard'+(S.theme===key?' on':'');
    var row = '<span class="row">';
    for(var i=0;i<6;i++){
      row += '<span class="b" style="--tt:'+th.tint[i]+'">'+th.art(i)+'</span>';
    }
    row += '</span>';
    b.innerHTML = row + '<span>'+th.label+'</span>';
    b.addEventListener('click', function(){ applyTheme(key); });
    el.appendChild(b);
  });
}
function renderModeChips(){
  var el = $('#modeChips');
  el.innerHTML = '';
  Object.keys(MODE).forEach(function(key){
    var b = document.createElement('button');
    b.type='button'; b.className='chip'+(S.mode===key?' on':'');
    b.innerHTML = MODE[key].label;
    b.addEventListener('click', function(){
      S.mode = key; store.set('mode', key);
      renderModeChips(); renderStartModes();
      closeSheets();
      startGame(key);
    });
    el.appendChild(b);
  });
}
function renderStartModes(){
  var el = $('#startModes');
  if(!el) return;
  el.innerHTML = '';
  Object.keys(MODE).forEach(function(key){
    var b = document.createElement('button');
    b.type='button'; b.className='mmode'+(S.mode===key?' on':'');
    b.setAttribute('data-mode', key);
    b.innerHTML = MODE[key].label;
    b.addEventListener('click', function(){
      S.mode = key;
      renderStartModes(); renderModeChips();
    });
    el.appendChild(b);
  });
}

/* ---------- 이벤트 연결 ---------- */
function wire(){
  $('#gearBtn').addEventListener('click', function(){ openSheet('sheetSet'); });
  $('#mascotBtn').addEventListener('click', function(){ openSheet('sheetSet'); });
  $('#sheetX').addEventListener('click', closeSheets);
  $('#veil').addEventListener('click', closeSheets);
  $('#btnTheme').addEventListener('click', function(){ openSheet('sheetSet'); });
  $('#btnHint').addEventListener('click', function(){ unlockAudio(); showHint(); });
  $('#btnUndo').addEventListener('click', doUndo);
  $('#btnNew').addEventListener('click', function(){
    closeModal('mOver'); startGame(S.mode);
  });
  $('#btnReset').addEventListener('click', function(){
    S.best = 0; store.set('best',0); updateHud(); toast('최고 점수를 지웠어요');
  });
  $('#btnStart').addEventListener('click', function(){
    unlockAudio();
    closeModal('mStart');
    startGame(S.mode);
  });
  $('#overUndo').addEventListener('click', function(){ closeModal('mOver'); doUndo(); });
  $('#overNew').addEventListener('click', function(){ closeModal('mOver'); startGame(S.mode); });
  window.addEventListener('resize', function(){ layout(); });
  window.addEventListener('orientationchange', function(){ setTimeout(layout, 220); });
  document.addEventListener('visibilitychange', function(){ if(!document.hidden){ layout(); } });
}

function doUndo(){
  if(S.busy) return;
  var snap = hist.pop();
  if(!snap){ toast('되돌릴 수가 없어요'); updateHud(); return; }
  restore(snap);
  S.over = false;
  if(S.mode==='time' && S.time>0) startTick();
  scheduleHint();
  toast('한 수 되돌렸어요');
}

/* ---------- 부팅 ---------- */
function boot(){
  muted = (S.sound==='mute');
  buildCells();
  layout();
  wire();
  renderThemeCards();
  renderSoundChips();
  renderModeChips();
  renderStartModes();
  renderLegend();
  renderZodiacAll();
  updateMascot();
  buildGrid();
  updateHud();
  openModal('mStart');
  var ro = null;
  if(window.ResizeObserver){
    ro = new ResizeObserver(function(){ layout(); });
    ro.observe($('#boardwrap'));
  }
  window.addEventListener('load', function(){ setTimeout(layout, 60); });
  setTimeout(layout, 120);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* ---------- 테스트 훅 ---------- */
window.__cp = {
  N: N,
  state: function(){
    return { grid: grid.map(function(t){ return t? {type:t.type, sp:t.sp}:null; }),
             score:S.score, moves:S.moves, time:S.time, mode:S.mode, combo:S.combo,
             comboBest:S.comboBest, lastCombo:S.lastCombo, busy:S.busy, over:S.over, started:S.started,
             theme:S.theme, sound:S.sound, hist:hist.length };
  },
  swap: function(r1,c1,r2,c2){ return trySwap({r:r1,c:c1},{r:r2,c:c2}); },
  tileAt: function(r,c){ var t=T(r,c); return t? {type:t.type, sp:t.sp}:null; },
  findMove: findMove,
  findRuns: findRuns,
  shuffle: function(){ return shuffleBoard(false); },
  resolve: function(){ return resolveBoard(); },
  hint: showHint,
  busy: function(){ return S.busy; },
  particles: function(){ return parts.length; },
  domFx: function(){ return document.querySelectorAll('.plus').length
                        + document.querySelectorAll('.t.pop').length
                        + document.querySelectorAll('.t.born').length; },
  banner: function(){ return document.querySelectorAll('.banner.show').length; },
  theme: function(n){ applyTheme(n); },
  mode: function(m){ startGame(m); },
  start: function(m){ startGame(m); },
  tiles: function(){ return document.querySelectorAll('.t').length; },
  forceOver: function(){ if(S.mode==='moves'){ S.moves=0; } else { S.time=0; } updateHud(); endGame(); },
  setGrid: function(types){
    clearLayer();
    grid = new Array(N*N).fill(null);
    for(var r=0;r<N;r++) for(var c=0;c<N;c++){
      var ty = types[r*N+c];
      var t = { id:++uid, type: ty, sp:null, r:r, c:c };
      grid[ix(r,c)] = t;
      var el = createEl(t);
      el.style.width = geo.cell+'px'; el.style.height = geo.cell+'px';
      var xy = cellXY(r,c);
      el.style.transition='none';
      el.style.transform='translate3d('+xy.x+'px,'+xy.y+'px,0)';
      layer.appendChild(el);
    }
  },
  audio: function(){ return { ctx: !!AC, state: AC? AC.state : 'none', muted: muted, sound: S.sound }; },
  setSpecial: function(r,c,sp){
    var t = T(r,c); if(!t) return null;
    if(sp==='star') t.type = -1;
    t.sp = sp;
    var el = tileEls.get(t.id); if(el) applyLook(t, el);
    return { type:t.type, sp:t.sp };
  },
  layout: layout
};

})();

</script>
