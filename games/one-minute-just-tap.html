<script>
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var K=20;
function makeCore(seed){
  var rnd=mulberry32(seed),centers=[];
  for(var i=0;i<400;i++)centers.push(0.18+rnd()*0.64);
  centers[0]=0.5;
  var S={T:60000,t:0,pos:0.1,dir:1,idx:0,hits:0,fails:0,combo:0,maxCombo:0,score:0,perfects:0,feverLeft:0,feverCount:0,widen:0,over:false,c:centers[0],rescue:0,rescueCombo:0,rescues:0,goldHits:0,waveHits:0,spurtHits:0};
  // 10초마다 이벤트: 10s 골드존 / 20s 스피드 웨이브 / 30s 골드존 / 40s 스피드 웨이브 (각 3.5초), 50s~60s 라스트 스퍼트
  S.spurt=function(){return S.t>=50000};
  S.evt=function(){if(S.t<10000||S.t>=50000)return null;var blk=Math.floor(S.t/10000);if(S.t%10000>=3500)return null;return blk%2===1?'gold':'wave'};
  S.evtLeft=function(){return S.evt()?3500-(S.t%10000):0};
  S.width=function(){var w=Math.max(0.12,0.30-0.008*S.hits)+S.widen;if(S.t<5000)w=Math.max(w,0.36);if(S.evt()==='gold')w+=0.06;return Math.min(0.5,w)};
  S.speed=function(){var v=0.8+1.1*(S.t/S.T);if(S.evt()==='wave')v*=1.3;if(S.spurt())v*=1.08;return v};
  S.mult=function(){return Math.min(10,1+S.combo)};
  S.tmult=function(){var e=S.evt();return (S.spurt()?2:1)*(e==='gold'?3:e==='wave'?2:1)};
  S.step=function(dt){
    if(S.over)return;
    dt=Math.min(dt,33);
    var rem=S.T-S.t; if(dt>=rem){dt=rem}
    S.t+=dt;
    if(S.rescue>0){S.rescue=Math.max(0,S.rescue-dt);if(S.rescue===0){S.rescueCombo=0;S.ev2='rescueEnd'}}
    var sp=S.speed()*(S.feverLeft>0?1.15:1)*dt/1000;
    S.pos+=S.dir*sp;
    while(S.pos>1||S.pos<0){if(S.pos>1){S.pos=2-S.pos;S.dir=-1}else{S.pos=-S.pos;S.dir=1}}
    if(S.feverLeft>0){S.feverLeft=Math.max(0,S.feverLeft-dt);if(S.feverLeft===0)S.ev='feverEnd'}
    if(S.t>=S.T){S.over=true;S.ev='end'}
  };
  S.tap=function(){
    if(S.over)return null;
    var w=S.width(),d=S.pos-S.c,ad=Math.abs(d),r={};
    if(ad<=w/2){
      var perfect=ad<=w*0.2,rescued=false;
      if(S.rescue>0&&S.rescueCombo>S.combo){S.combo=S.rescueCombo;rescued=true;S.rescues++}
      S.rescue=0;S.rescueCombo=0;
      S.combo++;S.hits++;if(perfect)S.perfects++;
      S.maxCombo=Math.max(S.maxCombo,S.combo);
      var fever=S.feverLeft>0,e=S.evt(),sp=S.spurt();
      var pts=K*S.mult()*(perfect?2:1)*(fever?2:1)*S.tmult();
      if(e==='gold')S.goldHits++;if(e==='wave')S.waveHits++;if(sp)S.spurtHits++;
      S.score+=pts;S.widen=Math.max(0,S.widen-0.01);
      if(S.combo>=5&&!fever&&!S.feverCool){S.feverLeft=3000;S.feverCount++;S.feverCool=true;r.fever=true}
      if(S.combo<5)S.feverCool=false;
      r={ok:true,perfect:perfect,pts:pts,fever:r.fever,rescued:rescued,evt:e,spurt:sp};
      S.idx++;S.c=centers[S.idx%centers.length];
    }else{
      var approaching=(S.dir>0&&S.pos<S.c)||(S.dir<0&&S.pos>S.c);
      var why=ad>w*1.6?'빗나감':(approaching?'빠름':'늦음');
      S.fails++;
      var prev=S.combo,hadRescue=S.rescue>0;
      S.combo=S.feverLeft>0?1:0;
      if(!hadRescue&&prev>=3){S.rescue=1000;S.rescueCombo=prev}else{S.rescue=0;S.rescueCombo=0}
      S.widen=Math.min(0.08,S.widen+0.02);
      r={ok:false,why:why,rescue:S.rescue>0,lost:prev};
    }
    return r;
  };
  S.grade=function(){return S.score>=GC.S?'S':S.score>=GC.A?'A':S.score>=GC.B?'B':'C'};
  return S;
}

    for(var j=0;j<trail.length-1;j++){cx.globalAlpha=.06+.05*j*(ev2==='wave'?1.8:1);cx.fillStyle=tc;var tj=trail[j];cx.beginPath();cx.moveTo(tj,y-24);cx.lineTo(tj+10,y);cx.lineTo(tj,y+24);cx.lineTo(tj-10,y);cx.closePath();cx.fill()}
    cx.globalAlpha=1;
    if(ev2==='wave'){cx.strokeStyle='rgba(110,231,255,.35)';cx.lineWidth=2;for(var l=0;l<6;l++){var ly=y-60+l*24,lx=((T*900+l*130)%(W+160))-80;cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(lx-60,ly);cx.stroke()}}
    var sc=1+punch*.2;
    cx.save();cx.translate(mx,y);cx.scale(sc,sc);cx.shadowColor=tc;cx.shadowBlur=22;cx.fillStyle='#fff';cx.beginPath();cx.moveTo(0,-32);cx.lineTo(15,0);cx.lineTo(0,32);cx.lineTo(-15,0);cx.closePath();cx.fill();cx.shadowBlur=0;cx.fillStyle=tc;cx.beginPath();cx.moveTo(0,-14);cx.lineTo(6,0);cx.lineTo(0,14);cx.lineTo(-6,0);cx.closePath();cx.fill();cx.restore();
    cx.textAlign='center';
    if(state==='play'){for(var pi=0;pi<5;pi++){var on=fever||S.combo>pi;cx.fillStyle=on?(fever?'#ff9a3c':hsl(hue,95,65)):'rgba(255,255,255,.16)';cx.beginPath();cx.arc(W/2+(pi-2)*26,y+62,on?8:6,0,6.283);cx.fill()}}
    if(fever){cx.fillStyle='#ffb36b';cx.font='900 22px sans-serif';cx.fillText('🔥 FEVER ×2 '+(S.feverLeft/1000).toFixed(1)+'s',W/2,y+94)}
    else if(state==='play'){cx.fillStyle='#cdd6f6';cx.font='bold 16px sans-serif';cx.fillText('콤보 '+S.combo+(S.combo>=5?' · 피버 대기':' · 5콤보에 피버'),W/2,y+94)}
    if(state==='play'){var nt=0,nl='';if(S.t<50000){nt=(Math.floor(S.t/10000)+1)*10000;var nb=nt/10000;nl=nb===5?'🔥 라스트 스퍼트 ×2':(nb%2===1?'🌟 골드존 ×3':'⚡ 스피드 웨이브 ×2');cx.fillStyle='rgba(205,214,246,.75)';cx.font='600 13px sans-serif';cx.fillText('다음 '+nl+' · '+Math.ceil((nt-S.t)/1000)+'초 후',W/2,y+158)}}
    if(S.rescue>0&&state==='play'){var rl=S.rescue/1000;cx.fillStyle='rgba(255,170,60,.9)';cx.font='900 18px sans-serif';cx.fillText('아깝다! 지금 다시 탭 → 콤보 '+S.rescueCombo+' 복구',W/2,y+120);
      cx.fillStyle='rgba(255,255,255,.15)';rr(W/2-90,y+128,180,8,4);cx.fill();cx.fillStyle='#ffaa3c';rr(W/2-90,y+128,180*rl,8,4);cx.fill()}
  }
  if(state==='idle'){cx.fillStyle='#fff';cx.textAlign='center';cx.font='900 34px sans-serif';cx.fillText('저스트 탭 래더',W/2,y-110);cx.font='700 18px sans-serif';cx.fillStyle='#7cf5c7';cx.globalAlpha=.6+.4*Math.sin(T*4);cx.fillText('탭하면 시작',W/2,y+110);cx.globalAlpha=1;
    cx.font='600 13px sans-serif';cx.fillStyle='#9aa6c8';cx.fillText('10초마다 골드존·스피드 웨이브 · 마지막 10초 ×2',W/2,y+136)}
  // 파티클
  for(var i2=parts.length-1;i2>=0;i2--){var p=parts[i2];p.l-=dt;if(p.l<=0){parts.splice(i2,1);continue}
    var al=Math.max(0,p.l/p.l0);
    if(p.k==='ring'){var rr0=p.r0+(1-al)*70;cx.globalAlpha=al;cx.strokeStyle=p.c;cx.lineWidth=3*al+1;cx.beginPath();cx.arc(p.x,p.y,rr0,0,6.283);cx.stroke();continue}
    if(p.k==='txt'){p.y+=p.vy*dt;cx.globalAlpha=Math.min(1,al*1.6);cx.fillStyle=p.c;cx.font='900 '+p.sz+'px system-ui,sans-serif';cx.textAlign='center';cx.shadowColor=p.c;cx.shadowBlur=8;cx.fillText(p.t,p.x,p.y);cx.shadowBlur=0;continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.k==='spark'?160:420)*dt;cx.globalAlpha=Math.min(1,al*1.6);cx.fillStyle=p.c;
    if(p.k==='shard'){p.rot+=p.vr*dt;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);cx.beginPath();cx.moveTo(0,-p.sz);cx.lineTo(p.sz*.7,p.sz*.8);cx.lineTo(-p.sz*.7,p.sz*.8);cx.closePath();cx.fill();cx.restore()}
    else{cx.beginPath();cx.arc(p.x,p.y,p.sz*al+.6,0,6.283);cx.fill()}}
  cx.globalAlpha=1;
  // 펭펭
  var gy=H-14,ps=Math.min(150,W*.38,H*.2),bob=Math.sin(T*3)*2;
  peng.v+=1700*dt;peng.y+=peng.v*dt;if(peng.y>=0){peng.y=0;peng.v=0}if(peng.y<-80){peng.y=-80;if(peng.v<0)peng.v=0}
  peng.sq=Math.max(0,peng.sq-dt*6);peng.sayL=Math.max(0,peng.sayL-dt);peng.sad=Math.max(0,peng.sad-dt);
  var fv=fever?Math.sin(T*18)*.2:0,sadR=peng.sad>0?-.25:0;
  // 눈 언덕
  var mg=cx.createLinearGradient(0,gy-30,0,H);mg.addColorStop(0,'rgba(220,235,255,.55)');mg.addColorStop(1,'rgba(220,235,255,.9)');cx.fillStyle=mg;cx.beginPath();cx.moveTo(0,H);cx.lineTo(0,gy+4);cx.quadraticCurveTo(W*.5,gy-34,W,gy+4);cx.lineTo(W,H);cx.closePath();cx.fill();
  cx.save();cx.translate(W/2,gy+bob*(peng.y===0?1:0)+peng.y);cx.rotate(fv+sadR);cx.scale(1+peng.sq*.12,1-peng.sq*.12);
  if(pOK){cx.drawImage(PIMG,-ps/2,-ps+4,ps,ps)}else{cx.font=Math.round(ps*.8)+'px sans-serif';cx.textAlign='center';cx.fillText('🐧',0,-ps*.15)}
  cx.restore();
  if(peng.sayL>0){var bx=W/2+ps*.5+6,by=gy-ps+peng.y*.5-4;cx.font='900 15px system-ui,sans-serif';cx.textAlign='center';var bw=cx.measureText(peng.say).width+22;
    cx.globalAlpha=Math.min(1,peng.sayL*3);cx.fillStyle='#fff';rr(bx-bw/2+bw*.35,by-26,bw,28,14);cx.fill();cx.fillStyle='#0b1020';cx.fillText(peng.say,bx+bw*.35,by-6);cx.globalAlpha=1}
  // 피버 불꽃 테두리
  if(fever){
    cx.save();cx.shadowColor='#ff7a1a';cx.shadowBlur=28;cx.strokeStyle='rgba(255,120,30,.6)';cx.lineWidth=7;cx.strokeRect(2,2,W-4,H-4);cx.restore();
    var st=11;
    for(var e2=0;e2<4;e2++){var len=(e2<2)?W:H;
      for(var s2=0;s2<len;s2+=st){var fh=14+22*Math.abs(Math.sin(s2*.17+T*14+e2))+10*Math.sin(s2*.05-T*9),fh2=fh*.55;
        var bx0,by0,dx,dy;
        // 바깥(주황)과 안쪽(노랑) 불꽃
        for(var layer=0;layer<2;layer++){var hh=layer?fh2:fh;cx.fillStyle=layer?'rgba(255,230,90,.9)':'rgba(255,100,20,.75)';cx.beginPath();
          if(e2===0){cx.moveTo(s2,H);cx.lineTo(s2+st,H);cx.lineTo(s2+st/2,H-hh)}
          else if(e2===1){cx.moveTo(s2,0);cx.lineTo(s2+st,0);cx.lineTo(s2+st/2,hh)}
          else if(e2===2){cx.moveTo(0,s2);cx.lineTo(0,s2+st);cx.lineTo(hh,s2+st/2)}
          else{cx.moveTo(W,s2);cx.lineTo(W,s2+st);cx.lineTo(W-hh,s2+st/2)}
          cx.closePath();cx.fill()}}}
  }
  if(flash>0){cx.fillStyle='rgba(255,255,255,'+Math.min(.5,flash*.5)+')';cx.fillRect(-8,-8,W+16,H+16)}
  cx.globalAlpha=1;cx.restore();
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function tap(){
  ac();
  if(state==='idle'){askNick();start();return}
  if(state!=='play'||grace>0)return;
  var r=S.tap();if(!r)return;
  var x=trackX(S.pos),y=trackY();
  if(r.ok){
    punch=1;bigPunch=1;
    var big=S.combo>=10,fev=S.feverLeft>0;
    shake=Math.min(14,(r.perfect?6:3.5)+Math.min(S.combo,15)*.25+(fev?2:0));
    var base=520+Math.min(S.combo,12)*45;
    tone(base,r.perfect?.18:.1,r.perfect?'triangle':'sine',.18);
    if(r.perfect)tone(base*1.5,.12,'sine',.1);
    if(r.evt==='gold')tone(1568,.14,'triangle',.1);
    var cols=r.evt==='gold'?['#ffd84a','#fff3a0','#ffb300']:(r.perfect?['#ffd84a','#fff','#ff9bf0']:['#7cf5c7','#6ee7ff','#fff']);
    shardBurst(x,y,Math.min(34,16+S.combo*2),cols,r.perfect?1.2:1);
    sparkRing(x,y,r.perfect?'#ffd84a':'#7cf5c7',12);
    if(r.perfect)sparkRing(x,y,'#fff',4);
    popText(x,y-60,'+'+r.pts.toLocaleString('en-US'),r.evt==='gold'?'#ffd84a':(r.perfect?'#ffd84a':'#7cf5c7'),r.perfect||r.evt);
    setMsg((r.perfect?'★ PERFECT':'✔ GOOD')+(r.rescued?'  ♻ 복구!':''),r.perfect?'#ffd84a':'#7cf5c7');
    if(r.rescued){tone(1046,.2,'triangle',.14);popText(x,y-95,'콤보 '+S.combo+' 복구!','#ffaa3c',true);say('휴~')}
    if(r.fever){tone(880,.35,'sawtooth',.12,1760);setMsg('🔥 FEVER!','#ff9bf0');shake=14;flash=.8;firework(W*.3,y-90,20);firework(W*.7,y-70,40);say('불꽃!')}
    if(S.combo%10===0){firework(x,y-60,hue);tone(1318,.25,'triangle',.12);say(S.combo+'콤보!')}
    if(!newBest&&best>0&&S.score>best){newBest=true;setMsg('🏆 신기록!','#ffd84a');tone(1200,.3,'triangle',.15);firework(W/2,y-110,50)}
    peng.v=-(330+Math.min(S.combo,15)*8);peng.sq=1;
    if(!r.fever&&S.combo<10&&Math.random()<.35)say(r.perfect?'퍼펙트!':'굿!');
  }else{
    shake=6;tone(160,.2,'sawtooth',.14,90);shardBurst(x,y,10,['#ff5a6e','#ff9aa8'],.8);setMsg('✘ '+r.why,'#ff5a6e');
    peng.sad=.8;peng.v=-140;if(r.rescue){say('다시!')}else say('앗!')
  }
}
function askNick(){if(nick!==null)return;nick=ls.get('omj_nick',null);if(nick===null){var v='';try{v=prompt('닉네임 (최대 10자, 비우면 익명)','')||''}catch(e){}nick=v.trim().slice(0,10);ls.set('omj_nick',nick)}}
function dateDash(){return seedStr.slice(0,4)+'-'+seedStr.slice(4,6)+'-'+seedStr.slice(6)}
function recText(){return '[1분 승부] '+(nick||'익명')+' | '+Math.round(S.score).toLocaleString('en-US')+'점 | 최대 콤보 ×'+S.maxCombo+' | 등급 '+S.grade()+' | '+dateDash()}
function end(){
  state='over';tone(440,.5,'triangle',.18,220);
  shownScore=S.score;upd();
  var g=S.grade();
  if(S.score>best){best=Math.round(S.score);ls.set('omj_best_'+seedStr,String(best));if(!newBest)setMsg('🏆 신기록!','#ffd84a')}
  $('gr').textContent=g;$('rs').textContent=Math.round(S.score).toLocaleString('en-US')+'점 · 콤보 ×'+S.maxCombo;
  var nxt=g==='S'?null:g==='A'?GC.S:g==='B'?GC.A:g==='C'?GC.B:0;
  $('nx').textContent=nxt?(g==='C'?'B':g==='B'?'A':'S')+'까지 '+(nxt-Math.round(S.score)).toLocaleString('en-US')+'점':'최고 등급 달성';
  $('st').textContent='피버 '+S.feverCount+'회 · 골드존 적중 '+S.goldHits+' · 스퍼트 적중 '+S.spurtHits+' · 재도전 성공 '+S.rescues;
  setTimeout(function(){$('over').style.display='flex'},350);
}
$('again').onclick=function(e){e.stopPropagation();start()};
$('copy').onclick=function(e){e.stopPropagation();var t=recText();
  function fallback(){var c=$('cp');c.value=t;c.style.display='block';$('cph').style.display='block';c.focus();c.select()}
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){$('copy').textContent='복사됨 ✔'},fallback)}else fallback()}catch(err){fallback()}};
cv.addEventListener('pointerdown',function(e){e.preventDefault();tap()});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.key===' '){e.preventDefault();if($('over').style.display==='flex'){start()}else tap()}});
document.addEventListener('visibilitychange',function(){grace=500});

last=performance.now();raf=requestAnimationFrame(loop);
})();
