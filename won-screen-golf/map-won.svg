<title id="mt">WON 스크린골프 약도 — 장산역 13번 출구에서 해천빌딩 6층</title>
<desc id="md">부산 2호선 장산역 13번 출구에서 해운대로를 따라 117미터, 왼쪽길로 54미터 들어가면 해운대로774번길 11 해천빌딩 6층입니다. 대림아크로텔 바로 옆 건물, 도보 3분 약 173미터. 주차는 건물 지하주차장과 타워주차장을 쓰고 주차권에 도장을 받습니다.</desc>
